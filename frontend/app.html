<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Janus</title>
  <meta name="description" content="Janus：本地优先的多 Agent 协作工作空间。你只在需要决策时介入，每一步都可以追溯和回放。" />
  <style>
    :root {
      /* Warm neutrals and a clay accent, after Claude's own interface. */
      --bg: #faf9f5;
      --surface: #ffffff;
      --soft: #f5f4ee;
      --line: #e6e3d9;
      --line-2: #efede5;
      --text: #1f1e1d;
      --muted: #6b6963;
      --faint: #9b988e;
      --accent: #c96442;
      --accent-ink: #a8502f;
      --accent-soft: #f7ece6;
      --accent-line: #e9c4b3;
      --ink: #1f1e1d;
      --serif: "Tiempos Headline", "Iowan Old Style", "Songti SC", "STSong", Georgia, serif;
      --green: #11845a;
      --green-soft: #e3f4ec;
      --amber: #9a5d05;
      --amber-soft: #fff2d9;
      --amber-line: #f0d9a8;
      --red: #b9364a;
      --red-soft: #fcebee;
      --violet: #6d45c4;
      --violet-soft: #f1ebfc;
      --shadow: 0 1px 2px rgba(31, 30, 29, .04), 0 4px 14px rgba(31, 30, 29, .04);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, h4, p { margin: 0; }
    code, .mono { font-family: var(--mono); font-size: 12.5px; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .small { font-size: 12.5px; }
    .hidden { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: .15s; }
    .btn:hover { border-color: var(--accent-line); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-ink); color: #fff; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--accent); }
    .btn.danger { color: var(--red); }
    .btn.sm { height: 31px; padding: 0 11px; font-size: 13px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 12.5px; }
    .link:hover { text-decoration: underline; }
    .seq { border: 0; background: var(--soft); border-radius: 5px; padding: 0 5px; color: var(--muted); font: 11.5px var(--mono); }
    .seq:hover { color: var(--accent); background: var(--accent-soft); }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.gray { background: #eff1f5; color: #566174; }
    .pill.blue { background: var(--accent-soft); color: var(--accent-ink); }
    .pill.green { background: var(--green-soft); color: var(--green); }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.violet { background: var(--violet-soft); color: var(--violet); }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 7px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); font-size: 12px; white-space: nowrap; }
    .av { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; flex: none; color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: 0; }
    .av.sm { width: 20px; height: 20px; border-radius: 6px; font-size: 9px; }
    .av.lg { width: 34px; height: 34px; border-radius: 10px; font-size: 12px; }
    .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 10px; }
    .sec-h h2 { font-size: 15px; display: flex; align-items: center; }
    .sec-h > span { font-size: 12.5px; color: var(--muted); }
    .bar { height: 6px; border-radius: 99px; background: #eceef3; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s ease; }

    /* ---------- Onboarding ---------- */
    .ob { min-height: 100vh; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 15px; }
    .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: linear-gradient(140deg, #6e6cff, #4c4ad8); color: #fff; font-weight: 800; font-size: 14px; }
    .rt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
    .rt:last-child { border-bottom: 0; }
    .rt .grow { flex: 1; min-width: 0; }
    .rt .grow span { display: block; color: var(--faint); font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pick { position: relative; display: flex; gap: 11px; align-items: flex-start; padding: 13px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; transition: .15s; width: 100%; }
    .pick:hover { border-color: var(--accent-line); }
    .pick.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .pick .grow { flex: 1; min-width: 0; }
    .pick b { display: block; font-size: 14px; }
    .pick .d { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .pick .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .pick .check { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #c9ced8; display: grid; place-items: center; color: #fff; font-size: 11px; }
    .pick.on .check { background: var(--accent); border-color: var(--accent); }
    .pick.radio .check { border-radius: 50%; }
    .pick select { height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); font-size: 12px; padding: 0 4px; }
    .pick.add { justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; min-height: 84px; }
    .form { margin-top: 10px; padding: 16px; display: grid; gap: 12px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .field input, .field textarea, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); outline: 0; font-size: 13.5px; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); background: #fff; }
    .field textarea { min-height: 64px; resize: vertical; }
    .row-end { display: flex; justify-content: flex-end; gap: 8px; }
    .note { padding: 10px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
    .note.warn { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }
    .path-row { display: flex; gap: 8px; }
    .path-row input { flex: 1; min-width: 0; font-family: var(--mono); }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .presets button, .suggest button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; }
    .presets button:hover, .suggest button:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
    .switch { flex: none; width: 38px; height: 22px; border: 0; border-radius: 99px; background: #cfd5df; padding: 2px; }
    .switch i { display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"] i { transform: translateX(16px); }
    .switch:disabled { opacity: .55; cursor: not-allowed; }
    .seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 12.5px; color: var(--muted); }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    pre.json { margin: 0; padding: 12px 14px; border-radius: 10px; background: #2b2a27; color: #dfe3f3; font: 12px/1.6 var(--mono); overflow: auto; white-space: pre; }
    .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stack { display: grid; gap: 10px; }
    .conn, .role { padding: 14px 16px; }
    .conn .kvs, .role .kvs { margin-top: 10px; }
    .conn .kvs .mono { word-break: break-all; }
    .hint { margin-top: 5px; color: var(--faint); font-size: 12px; }
    pre.log-tail a { color: #a5b4fc; }
    pre.log-tail { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: #2b2a27; color: #dfe3f3; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow: auto; }
    .presets button.on { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .ws-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ws-table th { text-align: left; padding: 10px 14px; color: var(--muted); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
    .ws-table th small { display: block; color: var(--faint); font-weight: 500; }
    .ws-table td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
    .ws-table tr:last-child td { border-bottom: 0; }
    .ws-table tr.off td:first-child b { color: var(--faint); }
    .chk { display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .chk span b, .chk span span { display: block; }
    .picker { width: min(640px, 100%); }
    .pick-tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pick-tools label { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
    .dir-list { margin-top: 10px; max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
    .dir { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line-2); background: var(--surface); text-align: left; font-size: 13px; }
    .dir:hover { background: var(--accent-soft); }
    @media (max-width: 720px) { .grid3 { grid-template-columns: 1fr; } .ws-table th, .ws-table td { padding: 8px; } }
    .session { padding-bottom: 0; overflow: hidden; }
    .chat { max-height: 520px; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 12px; }
    .chat > * { flex-shrink: 0; }
    .msg { display: flex; gap: 8px; align-items: flex-start; }
    .msg.from-user { justify-content: flex-end; }
    .bubble { max-width: 82%; padding: 9px 12px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line-2); white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.6; }
    .msg.from-user .bubble { background: var(--accent-soft); border-color: var(--accent-line); }
    .bubble .via { display: block; margin-top: 4px; color: var(--faint); font-size: 11.5px; }
    .bubble.insert { background: var(--surface); border: 1px dashed var(--accent); border-left: 3px solid var(--accent); }
    .insert-h { display: block; margin-bottom: 4px; color: var(--accent-ink); font-size: 11.5px; font-weight: 600; }
    .msg-tray { margin: 0 -18px; padding: 10px 18px 2px; border-top: 1px solid var(--line); background: var(--surface); }
    .msg-tray-h { color: var(--faint); font-size: 11.5px; font-weight: 600; margin-bottom: 6px; }
    .msg-tray-i { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line-2); }
    .msg-tray-i:first-of-type { border-top: 0; }
    .msg-tray-t { flex: 1; min-width: 0; font-size: 13px; white-space: pre-wrap; word-break: break-word; color: var(--ink, inherit); }
    .spin { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
    .chat-tool { margin-left: 28px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-tool code { color: var(--accent-ink); }
    .chat-tool.pending { color: var(--amber); }
    .chat-tool .pill { margin-left: 8px; }
    .chat-prompt { margin-left: 28px; padding: 8px 10px; border-left: 2px solid var(--accent); background: var(--soft); color: var(--muted); font-size: 12px; }
    .chat-prompt-h { color: var(--accent-ink); font-weight: 600; }
    .chat-prompt .via { margin-left: 8px; color: var(--faint); font-weight: 400; }
    .chat-prompt details { margin-top: 5px; }
    .chat-prompt summary { cursor: pointer; color: var(--accent); }
    .chat-prompt pre { max-height: 280px; overflow: auto; margin: 6px 0 0; padding: 8px; border-radius: 7px; background: #2b2a27; color: #e3e6f4; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
    .chat-note { text-align: center; color: var(--muted); font-size: 12px; }
    .chat-note.amber { color: var(--amber); } .chat-note.green { color: var(--green); } .chat-note.red { color: var(--red); }
    .chat-div { border-top: 1px dashed var(--line); padding-top: 8px; color: var(--faint); font-size: 12px; }
    .chat-div details { margin-top: 4px; } .chat-div summary { cursor: pointer; color: var(--accent); }
    .composer { margin: 0 -18px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--soft); }
    .composer textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; outline: 0; font-size: 13.5px; }
    .composer textarea:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
    .composer.off textarea { background: var(--soft); }
    .composer-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .composer-f .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .set-crumb { color: var(--muted); font-size: 13px; font-weight: 600; padding-left: 12px; border-left: 1px solid var(--line); }
    .set { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 48px; }
    .set-nav { position: sticky; top: 76px; align-self: start; display: grid; gap: 2px; }
    .set-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border: 0; border-radius: 9px; background: none; text-align: left; }
    .set-item:hover { background: var(--line-2); }
    .set-item.on { background: var(--surface); box-shadow: var(--shadow); }
    .set-item b { display: block; font-size: 13.5px; }
    .set-item small { display: block; color: var(--faint); font-size: 12px; }
    .set-main > h2 { font-size: 20px; letter-spacing: -.01em; }
    .set-main > p { margin-top: 6px; color: var(--muted); }
    .set-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .set-h h1 { font-size: 22px; letter-spacing: -.02em; }
    .set-h p { margin-top: 4px; color: var(--muted); font-size: 13px; max-width: 640px; }
    .set-next { display: flex; justify-content: space-between; margin-top: 24px; }
    .pv-empty { padding: 28px; text-align: center; color: var(--muted); }
    .pv-ic { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
    .pv-ic.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 9px; }
    .pv-ic.lg { width: 38px; height: 38px; border-radius: 10px; font-size: 12px; }
    .menu-wrap { position: relative; }
    .menu { position: absolute; right: 0; top: 34px; z-index: 5; min-width: 150px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(20,28,48,.14); display: grid; }
    .menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; }
    .menu button:hover { background: var(--soft); }
    .menu button.danger { color: var(--red); }
    .pdlg { width: min(1040px, 100%); height: min(720px, calc(100vh - 32px)); display: grid; grid-template-columns: 300px minmax(0, 1fr); background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(16,22,38,.25); }
    .pdlg-rail { background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .rail-search { padding: 14px 12px 6px; }
    .rail-search input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); outline: 0; }
    .rail-search input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
    .rail-list { overflow: auto; padding: 4px 10px 14px; }
    .rail-g { margin: 12px 8px 4px; color: var(--faint); font-size: 12px; }
    .rail-i { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 9px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 13.5px; }
    .rail-i span:not(.pv-ic) { flex: 1; }
    .rail-i:hover:not(:disabled) { background: var(--line-2); }
    .rail-i.on { background: var(--line); }
    .rail-i i { font-style: normal; color: var(--accent); }
    .rail-i:disabled { cursor: default; opacity: .55; } .rail-i.on:disabled { opacity: 1; }
    .pdlg-form { display: flex; flex-direction: column; min-height: 0; }
    .pdlg-h { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; }
    .pdlg-h .grow { flex: 1; min-width: 0; }
    .pdlg-h h2 { font-size: 16px; } .pdlg-h p { color: var(--muted); font-size: 12.5px; }
    .pdlg-body { flex: 1; overflow: auto; padding: 4px 20px 16px; display: grid; gap: 14px; align-content: start; }
    .pdlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line-2); }
    .seg.stretch { display: flex; width: 100%; } .seg.stretch button { flex: 1; padding: 7px 10px; }
    details.sec { border-radius: 10px; background: var(--soft); padding: 10px 12px; }
    details.sec summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
    details.sec textarea { width: 100%; margin-top: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: 0; resize: vertical; font-size: 13px; }
    pre.env-preview { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line-2); font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-all; color: var(--muted); }
    @media (max-width: 860px) { .set { grid-template-columns: 1fr; } .set-nav { position: static; grid-auto-flow: column; overflow: auto; } .pdlg { grid-template-columns: 1fr; height: calc(100vh - 32px); } .pdlg-rail { max-height: 200px; } }
    .import-pv { padding: 10px 12px; border-radius: 10px; background: var(--green-soft); border: 1px solid #cfe9dc; font-size: 12.5px; }
    .import-pv ul { margin: 6px 0 4px; padding: 0; list-style: none; display: grid; gap: 4px; }
    .import-pv li { display: flex; gap: 8px; align-items: baseline; }
    .import-pv li code { flex: none; color: var(--green); font-weight: 600; }
    .import-pv li span { color: var(--muted); }
    .on-tab { border-color: var(--accent); color: var(--accent); }
    .ws-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; margin-left: 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 13px; max-width: 260px; }
    .ws-btn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws-btn:hover { border-color: var(--accent-line); }
    .ws-dot { color: var(--accent); } .caret { color: var(--faint); font-size: 10px; }
    .ws-menu { left: 6px; right: auto; top: 38px; min-width: 300px; }

    .quick-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }

    .skill .grow span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12.5px; }
    .mcp { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }

    .page-narrow { max-width: 920px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 48px; }

    .composer-card { padding: 14px 16px; }

    .run-list { padding: 4px 0; }

    .run-row .grow { flex: 1; min-width: 0; } .run-row b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .run-row small { color: var(--faint); font-size: 12px; }

    /* ---------- App shell ---------- */
    header.hdr { position: sticky; top: 0; z-index: 5; background: rgba(255, 255, 255, .9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }

    .hdr-r { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }

    main.main { max-width: 1320px; margin: 0 auto; padding: 20px 24px 60px; }

    .replay { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 14px; margin-bottom: 14px; border-radius: 12px; background: #1d2244; color: #fff; font-size: 13px; }

    .replay button { border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .08); color: #fff; border-radius: 7px; height: 28px; padding: 0 10px; font-size: 12.5px; }
    .replay #replayLabel { flex-basis: 100%; color: rgba(255, 255, 255, .75); font-size: 12.5px; }

    .board { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-width: 0; gap: 20px; align-items: start; }
    .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: sticky; top: 76px; }

    .run { padding: 18px 20px; }

    .stages li.done { border-color: var(--green); color: var(--text); }
    .stages li.on { border-color: var(--accent); color: var(--accent-ink); }

    .ask { padding: 16px 18px; border-color: var(--amber-line); }

    .ask .q { margin-top: 10px; font-size: 14.5px; }

    .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .opt small { color: var(--accent); font-weight: 600; margin-left: 4px; }

    .opt.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    .ask textarea { width: 100%; margin-top: 10px; min-height: 52px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; font-size: 13px; }
    .ask-f { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .ask-f .small { flex: 1; min-width: 200px; }
    /* One body for every request an agent puts in front of the person: options or a form. */

    .req-opts .btn.reject { color: var(--red); }
    .form-f { margin-top: 12px; } .form-f > label { display: block; font-size: 13px; font-weight: 600; } .form-f > small { display: block; color: var(--muted); font-size: 12px; }
    .form-f .opts { margin-top: 6px; } .form-f .opt small { display: block; margin: 2px 0 0; color: var(--muted); font-weight: 400; }
    .form-f input[type=text], .form-f input[type=number] { width: 100%; height: 34px; margin-top: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
    .form-f .custom { margin-top: 6px; }
    .req-diff { margin-top: 10px; max-height: 220px; overflow: auto; }
    .tid { display: inline-grid; place-items: center; height: 22px; min-width: 30px; padding: 0 5px; border-radius: 6px; background: #eef0f5; color: #475265; font: 600 11.5px var(--mono); }
    pre.cmd { margin: 10px 0 0; padding: 10px 12px; border-radius: 8px; background: #2b2a27; color: #e8ebf7; font: 13px var(--mono); white-space: pre-wrap; }
    .kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; margin-top: 10px; font-size: 12.5px; }
    .kv label { color: var(--faint); }
    .quiet { padding: 14px 16px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }

    .result { padding: 18px 20px; border-color: #c9ecdb; }

    .res-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
    .res-grid h4, .diag h4 { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }

    .res-grid li { display: grid; gap: 2px; }

    .diag { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }

    .cats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }

    .cats span.hit { border-color: var(--amber); background: var(--amber); color: #fff; font-weight: 600; }
    .diag b { font-size: 14px; }
    .diag p { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .res-f { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .dag { padding: 16px; overflow-x: auto; }
    .dag-cols { display: flex; gap: 28px; }
    .dag-col { display: grid; gap: 10px; align-content: center; flex: 1 1 0; min-width: 160px; position: relative; }
    .dag-col:not(:last-child)::after { content: "→"; position: absolute; right: -21px; top: 50%; transform: translateY(-50%); color: var(--faint); }
    .node { display: grid; gap: 6px; padding: 11px 12px; text-align: left; border: 1px solid var(--line); border-left: 3px solid #cfd4de; border-radius: 10px; background: var(--surface); transition: .15s; }
    .node:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
    .node.blue { border-left-color: var(--accent); }
    .node.green { border-left-color: var(--green); }
    .node.amber { border-left-color: var(--amber); background: #fffcf5; }
    .node.red { border-left-color: var(--red); }
    .node.violet { border-left-color: var(--violet); }
    .node-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .node > b { font-size: 13.5px; line-height: 1.4; }
    .node-a { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
    .shared { padding: 14px; }
    .board-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: start; }

    .lane-open { background: var(--amber-soft); margin-bottom: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .lane-open .lane-h, .lane-open .lane-more { grid-column: 1 / -1; }

    .lane-h span { color: var(--faint); font-size: 12px; }
    .lane-e { color: var(--faint); font-size: 12.5px; padding: 4px 0 2px; }
    .lane-more { justify-self: start; font-size: 12.5px; }
    .fact { display: grid; gap: 5px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12.5px; min-width: 0; }

    .fact-m { color: var(--faint); font-size: 11.5px; }

    .panel { padding: 16px; }

    .panel-h h3 { font-size: 14.5px; }
    .panel-h span { color: var(--muted); font-size: 12px; }

    .agent:last-child { border-bottom: 0; padding-bottom: 0; }
    .agent-m { display: flex; align-items: center; gap: 9px; }
    .agent-m .grow { flex: 1; min-width: 0; }
    .agent-m b { display: block; font-size: 13.5px; }
    .agent-m .grow span { display: block; color: var(--faint); font-size: 12px; }
    .agent-t { margin: 7px 0 0 35px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
    .agent-t b { color: var(--text); font-weight: 600; }
    .agent .bar { margin: 7px 0 0 35px; height: 4px; }
    .agent-x { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 6px 0 0 35px; color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
    .filters button { border: 0; background: none; color: var(--muted); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; }
    .filters button.on, .filters button:hover { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    .ev { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
    .ev:last-child { border-bottom: 0; }
    .ev-i { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; background: var(--accent-soft); color: var(--accent-ink); }
    .ev-i.green { background: var(--green-soft); color: var(--green); }
    .ev-i.amber { background: var(--amber-soft); color: var(--amber); }
    .ev-i.red { background: var(--red-soft); color: var(--red); }
    .ev-i.gray { background: #eff1f5; color: #5b6577; }
    .ev-t { font-size: 13px; }
    .ev-t b { font-weight: 600; }
    .ev-m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; color: var(--faint); font-size: 11.5px; }
    .ev-m code { font-size: 11.5px; }
    .panel-more { width: 100%; margin-top: 8px; }

    /* ---------- Task detail ---------- */
    .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .task-hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin: 14px 0 18px; }
    .task-hero h1 { font-size: 22px; letter-spacing: -.01em; margin-top: 6px; }
    .task-hero p { margin-top: 6px; color: var(--muted); max-width: 720px; }
    .detail { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
    .detail .card { padding: 16px 18px; }
    .detail .card + .card { margin-top: 16px; }
    .card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .card-h h3 { font-size: 14.5px; }
    .card-h span { color: var(--faint); font-size: 12px; }
    .acc { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
    .acc li { display: flex; gap: 8px; }
    .acc i { font-style: normal; width: 18px; color: var(--faint); }
    .acc li.ok i { color: var(--green); }
    .prompt { margin: 0; padding: 12px 14px; border-radius: 10px; background: #2b2a27; color: #e3e6f4; font: 12.5px/1.65 var(--mono); white-space: pre-wrap; }
    .honest { margin-top: 10px; color: var(--faint); font-size: 12px; }
    .tl { display: grid; }
    .tl-i { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
    .tl-i:last-child { border-bottom: 0; }
    .tl-i .r { text-align: right; color: var(--faint); font-size: 11.5px; font-family: var(--mono); display: grid; gap: 3px; justify-items: end; }
    .tl-div { margin: 12px 0 2px; padding: 7px 10px; border-radius: 8px; background: var(--soft); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12.5px; color: var(--muted); }
    .tl-div b { color: var(--text); }
    .tool { margin-top: 5px; padding: 7px 9px; border-radius: 7px; background: var(--soft); font-size: 12px; }
    .tool code { color: #3b4357; word-break: break-all; }
    .tool div { margin-top: 3px; color: var(--muted); }
    .why { margin-top: 5px; padding: 7px 9px; border-left: 2px solid var(--violet); background: var(--violet-soft); border-radius: 0 7px 7px 0; font-size: 12.5px; color: #4a3a73; }
    .find { margin-top: 5px; padding: 7px 9px; border-radius: 7px; background: var(--red-soft); color: #7e2534; font-size: 12.5px; }
    .cand { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .cand td:first-child { white-space: nowrap; }
    .cand td { padding: 7px 4px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
    .cand tr:last-child td { border-bottom: 0; }
    .cand tr.pick-row td { font-weight: 600; }
    .cand .x { color: var(--faint); font-weight: 400; }
    .kvs { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 7px 10px; font-size: 12.5px; }
    .kvs label { color: var(--faint); }

    .pmode-h { padding: 10px 14px 6px; } .pmode-h b { font-size: 13px; font-weight: 600; } .pmode-h small { display: block; color: var(--muted); font-size: 12px; }
    .pmode-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid var(--line-2); background: none; text-align: left; }
    .pmode-opt:hover { background: var(--soft); }

    .pmode-opt .grow { flex: 1; min-width: 0; } .pmode-opt b { font-size: 13.5px; font-weight: 500; } .pmode-opt small { display: block; color: var(--muted); font-size: 12px; }
    .pmode-opt em { margin-left: 6px; font-style: normal; color: var(--faint); font-size: 11.5px; }

<body>
  <div id="root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ============================================================
    // Static definitions
    // ============================================================
    const SUGGESTIONS = [
      ["除零保护", "给 divide 增加除零保护：除数为 0 时抛出 ValueError，并补充对应测试"],
      ["新增函数", "为 calc 增加 subtract 和 multiply 两个函数，补测试，并在 README 中说明用法"],
      ["代码调研", "阅读这个项目，整理代码结构和测试覆盖情况，给出三条改进建议"]
    ];
    // Fallbacks for team snapshots of early runs, whose members had no name, initials or color of their own.
    const RUNTIMES = {
      codex: { name: "Codex", init: "CX", color: "#1f2937" },
      pi: { name: "Pi", init: "PI", color: "#0e7490" },
      claude: { name: "Claude Code", init: "CC", color: "#b4532a" }
    };
    const PRESETS = {
      researcher: { init: "RS", color: "#5452e8" },
      implementer: { init: "IM", color: "#11845a" },
      reviewer: { init: "RV", color: "#b0670a" },
      tester: { init: "QA", color: "#6d45c4" },
      writer: { init: "WR", color: "#64748b" }
    };
    const WS_LABEL = { shared_readonly: "共享只读目录", readonly_commit: "只读，指定 commit", isolated_worktree: "独立 worktree", orchestrator: "主控工作区", workspace: "直接在工作目录中" };
    const TASK_STATUS = {
      created: ["待确认", "gray"], pending: ["等待依赖", "gray"], ready: ["就绪", "gray"], assigned: ["已分配", "blue"], running: ["执行中", "blue"],
      waiting_input: ["等你回答", "amber"], waiting_approval: ["等你审批", "amber"], waiting_review: ["待评审", "violet"],
      blocked: ["等待决策", "red"], cancelling: ["清理中", "amber"], cancelled_by_dependency: ["因依赖取消", "gray"], skipped_by_decision: ["按决定跳过", "gray"], verifying: ["验证中", "violet"], verification_failed: ["验证失败", "red"], succeeded: ["已完成", "green"], failed: ["失败", "red"], cancelled: ["已取消", "gray"]
    };
    const AGENT_PHASE = {
      idle: ["空闲", "gray"], thinking: ["规划中", "blue"], coordinating: ["协调中", "blue"], reading_files: ["读取文件", "blue"],
      editing: ["修改文件", "blue"], running_tool: ["调用工具", "blue"], running_test: ["运行测试", "blue"],
      waiting_for_input: ["等待输入", "amber"], waiting_for_agent: ["等待协作者", "amber"], waiting_approval: ["等待审批", "amber"], error: ["异常", "red"]
    };
    const ATTEMPT_STATUS = { running: ["进行中", "blue"], succeeded: ["成功", "green"], failed: ["失败", "red"], rejected: ["被评审驳回", "red"], verdict: ["给出驳回意见", "amber"] };
    const DIAG_CATS = [["input", "用户输入不足"], ["plan", "任务拆解不合理"], ["capability", "Agent 能力不匹配"], ["tool", "工具或环境不足"], ["data", "数据源缺失"], ["permission", "权限限制"], ["execution", "Agent 执行偏差"], ["review", "评审遗漏"]];
    const ICON = {
      "run.created": "✦", "plan.proposed": "◇", "plan.approved": "✓", "run.cancelled": "■", "run.paused": "Ⅱ", "run.resumed": "▶",
      "task.ready": "▸", "task.assigned": "↗", "attempt.started": "▶", "attempt.failed": "✕", "task.retry_scheduled": "↻", "task.reopened": "↺",
      "result.submitted": "⇪", "task.succeeded": "✓", "dependency.resolved": "⇢", "artifact.created": "▤", "artifact.handoff": "⇄", "context.handoff": "⇄",
      "question.asked": "?", "question.escalated": "⇡", "question.answered": "✎", "answer.delivered": "↩",
      "approval.requested": "⚑", "input.requested": "✎", "input.answered": "↩", "approval.granted": "✓", "approval.denied": "✕", "review.rejected": "✕", "review.approved": "✓",
      "run.delivered": "★", "run.waiting_input": "?", "run.budget_exhausted": "⌛", "run.accepted_with_risk": "⚠", "risk.accepted": "✓", "fix.requested": "↻", "task.failed": "✕", "task.blocked": "⊘", "task.cancelled_by_dependency": "■", "task.skipped_by_decision": "→", "task.cancel_requested": "‖", "verification.started": "◌", "verification.failed": "✕", "verification.passed": "✓", "run.failed": "✕", "run.interrupted": "■", "policy.violation": "⚠", "agent.status": "·", "tool.call": "⌘", "tool.started": "⌘", "tool.completed": "✓", "session.prompt": "→", "decision.summary": "◆",
      "run.recovered": "↻", "message.routed": "↪", "decision.withdrawn": "↩", "plan.validation_exhausted": "✕", "plan.replan_requested": "✎", "verification.command_rejected": "⚠", "run.budget_extended": "⌛", "plan.revision_requested": "✎", "agent.message": "❝", "user.message": "✎", "message.delivered": "↪", "control.taken": "✋", "control.released": "↻", "session.interrupted": "‖"
    };
    const TONE = {
      green: ["plan.approved", "task.succeeded", "review.approved", "approval.granted", "input.answered", "run.delivered", "risk.accepted"],
      amber: ["question.asked", "question.escalated", "approval.requested", "input.requested", "plan.proposed", "run.paused", "control.taken", "session.interrupted", "user.message"],
      red: ["attempt.failed", "review.rejected", "approval.denied", "run.cancelled", "task.failed", "run.failed", "run.interrupted", "policy.violation"],
      gray: ["agent.status", "tool.call", "tool.completed", "dependency.resolved", "task.ready"],
      blue: ["tool.started", "session.prompt"]
    };
    const toneOf = type => Object.keys(TONE).find(k => TONE[k].includes(type)) || "";
    function categoryOf(type) {
      if (/^(plan\.approved|question\.answered|input\.answered|approval\.(granted|denied)|review\.|risk\.|fix\.|run\.(paused|resumed|cancelled))/.test(type)) return "decisions";
      if (/^(question\.|approval\.requested|input\.requested|answer\.|user\.message|message\.delivered|control\.|session\.)/.test(type)) return "messages";
      if (type === "agent.message") return "progress";
      if (type.startsWith("artifact.") || type === "context.handoff") return "artifacts";
      if (/^(agent\.status|tool\.|session\.prompt|decision\.summary)/.test(type)) return "progress";
      return "tasks";
    }
    const CATEGORY_LABEL = { all: "全部", tasks: "任务", messages: "消息", artifacts: "产物", decisions: "决策", progress: "进度与工具" };

    // ============================================================
    // App state
    // ============================================================
    const S = {
      screen: "home", tab: "agents", wsId: (() => { try { return localStorage.getItem("janus.ws") || ""; } catch { return ""; } })(),
      cfg: { path: "" },
      setup: { connections: [], roles: [], workspaces: [] }, connDraft: null, wsDraft: null, picker: null, inspectFor: null,
      goal: "",
      meta: null, runs: [], runId: null, runTeam: null, live: false, es: null, inspect: null,
      events: [],
      page: "board", taskId: null, replay: null, mounted: null, modal: null,
      drafts: {}, medium: "all", boardView: "board", boardSel: null, boardAgent: "", boardTask: "", boardMore: {}, audit: { cat: "all", task: "", actor: "" }, hl: null, openRow: null
    };

    const $ = sel => document.querySelector(sel);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pad = n => String(n).padStart(2, "0");
    const clock = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
    const dur = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${pad(s % 60)} 秒`; };
    const ago = (ts, now) => { const s = Math.max(0, Math.round((now - ts) / 1000)); return s < 60 ? `${s}s 前` : `${Math.floor(s / 60)} 分钟前`; };
    const short = (text, n = 26) => text.length > n ? text.slice(0, n) + "…" : text;
    function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 3200); }

    // ============================================================
    // Team
    // ============================================================
    // The team is a snapshot stored with the run, so old runs keep showing who they really used.
    function team() { return S.runTeam || []; }
    function who(id) {
      if (id === "user") return { id, name: "你", init: "你", color: "#0f766e" };
      if (id === "janus") return { id, name: "Janus", init: "JN", color: "#8a94a6" };
      const m = team().find(m => m.id === id);
      if (!m) return { id, name: id, init: "?", color: "#94a3b8" };
      const p = PRESETS[m.id] || (m.lead ? { init: "LD", color: RUNTIMES[m.runtime]?.color } : {});
      return { ...m, init: m.init || p.init || m.name.slice(0, 2).toUpperCase(), color: m.color || p.color || "#64748b" };
    }
    const avatar = (id, cls = "sm") => { const m = who(id); return `<span class="av ${cls}" style="background:${m.color}" title="${esc(m.name)}">${esc(m.init)}</span>`; };
    const rtName = id => S.setup.connections.find(c => c.id === id)?.name || RUNTIMES[id]?.name || id || "—";
    const memberRt = m => m.runtime_name || rtName(m.runtime);
    const agentName = id => { const m = who(id); return m.runtime ? `${m.name} · ${memberRt(m)}` : m.name; };

    // ============================================================
    // Event store: every view is derived from S.events
    // ============================================================
    // @project-doc docs/architecture/frontend.md#event_derivation
    function derive(events) {
      const s = { run: { status: "idle", goal: "", start: 0, now: 0, paused: false, kind: "" }, tasks: {}, order: [], agents: {}, inbox: [], artifacts: [], answers: {}, msgs: {}, result: null, events };
      const ag = id => (s.agents[id] ||= { phase: "idle", note: "", progress: null, beat: 0, session: null });
      const dropSess = id => { s.inbox = s.inbox.filter(i => i.key !== "sess-" + id); };
      const endLive = t => { if (t) { t.live = false; dropSess(t.id); } };
      for (const e of events) {
        s.run.now = e.ts;
        if (e.actor && e.actor !== "user" && e.actor !== "janus") ag(e.actor).beat = e.ts;
        const t = e.task && s.tasks[e.task];
        const d = e.data || {};
        switch (e.type) {
          case "run.created": Object.assign(s.run, { status: d.mode === "goal" ? "running" : "planning", mode: d.mode || "plan", goal: d.goal, start: e.ts, kind: d.kind, cwd: d.cwd, git: d.git, baseRef: d.baseRef, workspace: d.workspace, inPlace: d.inPlace }); Object.assign(ag("lead"), { phase: "thinking" }); break;
          case "plan.proposed":
            s.tasks = {}; s.order = []; s.lastPlanSeq = e.seq; s.inbox = s.inbox.filter(i => i.key !== "plan");
            d.tasks.forEach(x => { s.tasks[x.id] = { ...x, status: "created", attempts: [], progress: 0, artifacts: [] }; s.order.push(x.id); });
            s.run.status = "awaiting_plan"; s.inbox.push({ kind: "plan", key: "plan", seq: e.seq }); ag("lead").phase = "waiting_for_input"; break;
          case "plan.approved":
            s.answers.plan = true; s.inbox = s.inbox.filter(i => i.key !== "plan"); s.run.status = "running";
            s.order.forEach(id => { s.tasks[id].status = "pending"; });
            Object.entries(d.overrides || {}).forEach(([id, a]) => { Object.assign(s.tasks[id], { agent: a, reason: "你在确认计划时改派", overridden: true }); });
            ag("lead").phase = "coordinating"; break;
          case "plan.frozen": break;
          // Goal mode: the lead's orchestrations add tasks to the board as it goes.
          case "orchestration.accepted":
            (d.tasks || []).forEach(x => { if (!s.tasks[x.id]) s.order.push(x.id); s.tasks[x.id] = { ...x, candidates: x.candidates || [], status: "pending", attempts: [], progress: 0, artifacts: [] }; });
            ag("lead").phase = "coordinating"; break;
          case "goal.status": ag("lead").note = e.text; break;
          case "run.waiting_input": {
            s.run.status = "waiting_input";
            const stuck = d.tasks ? d.tasks.map(x => x.id) : Object.values(s.tasks).filter(x => ["failed", "blocked", "verification_failed", "cancelled", "cancelled_by_dependency"].includes(x.status)).map(x => x.id);
            s.inbox = s.inbox.filter(i => i.kind !== "run_decision");
            if (stuck.length) s.inbox.push({ kind: "run_decision", key: "run-decision", seq: e.seq, tasks: stuck });
            break;
          }
          case "run.budget_exhausted": s.run.status = "waiting_input"; s.inbox = s.inbox.filter(i => i.kind !== "budget"); s.inbox.push({ kind: "budget", key: "budget", seq: e.seq, text: e.text }); break;
          case "run.budget_extended": s.run.status = "running"; s.inbox = s.inbox.filter(i => i.kind !== "budget"); break;
          case "plan.validation_exhausted": s.run.status = "waiting_input"; s.inbox = s.inbox.filter(i => i.kind !== "plan_invalid"); s.inbox.push({ kind: "plan_invalid", key: "plan-invalid", seq: e.seq, text: e.text, error: d.error, reason: d.reason }); ag("lead").phase = "error"; break;
          case "plan.replan_requested": s.inbox = s.inbox.filter(i => i.kind !== "plan_invalid"); s.run.status = "planning"; ag("lead").phase = "thinking"; break;
          case "decision.withdrawn": s.inbox = s.inbox.filter(i => i.key !== d.key); if (t && ["waiting_input", "waiting_approval"].includes(t.status)) t.status = "running"; break;
          case "run.cancelled": s.run.status = "cancelled"; s.inbox = []; s.order.forEach(id => { s.tasks[id].live = false; }); s.order.forEach(id => { if (s.tasks[id].status !== "succeeded") s.tasks[id].status = "cancelled"; }); break;
          case "run.paused": s.run.paused = true; break;
          case "run.resumed": s.run.paused = false; break;
          case "task.ready": (d.tasks || [e.task]).forEach(id => { s.tasks[id].status = "ready"; }); break;
          case "task.assigned": t.status = "assigned"; break;
          case "task.blocked": t.status = d.kind === "rework" ? "waiting_review" : "blocked"; t.blockedBy = d.dependency; break;
          case "task.cancel_requested": t.status = "cancelling"; break;
          case "task.cancelled_by_dependency": t.status = "cancelled_by_dependency"; endLive(t); break;
          case "task.skipped_by_decision": t.status = "skipped_by_decision"; endLive(t); break;
          case "verification.started": t.status = "verifying"; break;
          case "verification.failed": t.status = "verification_failed"; t.verificationFailures = d.failures || []; if (!t.delegated) s.inbox.push({ kind: "failed", key: "verify-" + e.task, task: e.task, seq: e.seq, error: (d.failures || []).join("；") }); break;
          case "verification.passed": break;
          case "attempt.started":
            t.attempts.push({ n: e.attempt, session: d.session, workspace: d.workspace, start: e.ts, status: "running", seq: e.seq });
            // Runs recorded before "inPlace" existed: an attempt in "工作目录 …" changed the directory itself.
            if (s.run.inPlace == null && /^工作目录 /.test(d.workspace || "")) s.run.inPlace = true;
            Object.assign(t, { live: true, control: "auto", turn: "running" });
            t.status = "running"; t.progress = 5; Object.assign(ag(t.agent), { session: d.session, phase: "thinking", note: "", progress: 5 }); break;
          case "agent.status": Object.assign(ag(e.actor), { phase: d.phase, note: e.text, progress: d.progress ?? null }); if (d.session) ag(e.actor).session = d.session; if (t && d.progress != null) t.progress = d.progress;
            if (t && d.turn === "idle") { t.turn = "idle"; if (!s.inbox.some(i => i.key === "sess-" + e.task)) s.inbox.push({ kind: "session", key: "sess-" + e.task, task: e.task, seq: e.seq }); }
            if (!t && d.turn === "idle" && !s.inbox.some(i => i.key === "sess-" + e.actor)) s.inbox.push({ kind: "session", key: "sess-" + e.actor, agent: e.actor, seq: e.seq });
            break;
          case "tool.started": Object.assign(ag(e.actor), { phase: d.tool === "janus.wait" ? "waiting_for_agent" : "running_tool", note: e.text }); break;
          case "tool.completed": if (d.tool === "janus.wait" || d.tool === "janus.reply" || d.tool === "janus.orchestrate") Object.assign(ag(e.actor), { phase: e.actor === "lead" ? "coordinating" : "thinking", note: e.text }); break;
          // Session events without a task belong to the lead's planning session.
          case "control.taken": if (t) t.control = "human"; break;
          case "session.interrupted": if (t && !d.finish) t.control = "human"; break;
          case "control.released": if (t) { t.control = "auto"; t.turn = "running"; dropSess(e.task); } else if (e.to) dropSess(e.to); break;
          // A message is recorded when sent (`pending`), then routed; one that waited is delivered by id.
          case "user.message":
            if (d.id) { s.msgs[d.id] = { id: d.id, text: d.text, by: e.actor, to: e.to, task: e.task, seq: e.seq, delivery: "pending" }; break; }
            if (t && d.delivery === "prompt") { t.turn = "running"; dropSess(e.task); ag(t.agent).phase = "thinking"; } else if (!t && d.delivery === "prompt" && e.to) dropSess(e.to);
            break;
          case "message.routed": {
            const m = s.msgs[d.id];
            if (m) Object.assign(m, { delivery: d.delivery, routedTask: e.task, routedSeq: e.seq });
            if (d.delivery === "prompt") { if (t) { t.turn = "running"; dropSess(e.task); ag(t.agent).phase = "thinking"; } else if (e.to) dropSess(e.to); }
            break;
          }
          case "message.delivered": if (t) t.turn = "running"; (d.ids || []).forEach(id => { if (s.msgs[id]) s.msgs[id].deliveredSeq = e.seq; }); break;
          case "question.asked": t.status = "waiting_input"; t.question = { ...d, seq: e.seq, from: e.actor }; Object.assign(ag(e.actor), { phase: "waiting_for_input", note: e.text }); break;
          case "question.escalated": s.inbox = s.inbox.filter(i => i.key !== d.key); s.inbox.push({ kind: "question", key: d.key, task: e.task, seq: e.seq, reason: d.reason, recommend: d.recommend }); break;
          case "question.answered": s.answers[d.key] = d.answer; s.inbox = s.inbox.filter(i => i.key !== d.key); if (t.status === "waiting_input") t.status = "running"; if (t.question) t.question.answer = d.answer; ag(t.agent).phase = "thinking"; break;
          case "approval.requested": if (t) t.status = "waiting_approval"; s.inbox.push({ kind: "approval", task: e.task, agent: e.actor, seq: e.seq, ...d }); Object.assign(ag(e.actor), { phase: "waiting_approval", note: e.text }); break;
          case "input.requested": if (t) t.status = "waiting_input"; s.inbox.push({ kind: "input", task: e.task, agent: e.actor, seq: e.seq, ...d }); Object.assign(ag(e.actor), { phase: "waiting_for_input", note: e.text }); break;
          case "input.answered": s.answers[d.key] = d.action; s.inbox = s.inbox.filter(i => i.key !== d.key); if (t && t.status === "waiting_input") t.status = "running"; if (e.to) ag(e.to).phase = "thinking"; break;
          case "approval.granted": case "approval.denied":
            s.answers[d.key] = e.type === "approval.granted" ? "granted" : "denied"; s.inbox = s.inbox.filter(i => i.key !== d.key);
            if (t && t.status === "waiting_approval") { t.status = "running"; ag(t.agent).phase = "running_tool"; } break;
          case "task.failed": t.status = "failed"; t.error = d.error;
            // A task the lead orchestrated is the lead's to deal with: it reads the failure on the board.
            if (!t.delegated) s.inbox.push({ kind: "failed", key: "fail-" + e.task, task: e.task, seq: e.seq, error: d.error }); break;
          case "run.failed": s.run.status = "failed"; s.run.error = d.error || e.text; break;
          case "run.interrupted": s.run.status = "interrupted"; s.inbox = []; s.order.forEach(id => { s.tasks[id].live = false; }); Object.values(s.agents).forEach(a => { a.phase = "idle"; }); break;
          case "run.recovered":
            s.run.status = d.phase;
            if (d.phase === "awaiting_plan" && s.lastPlanSeq) s.inbox.push({ kind: "plan", key: "plan", seq: s.lastPlanSeq });
            if (d.tasks) {
              d.tasks.forEach(x => { const rt = s.tasks[x.id]; if (!rt) return; rt.status = x.status; rt.blockedBy = x.blockedBy; rt.live = false;
                if (x.status === "failed" && !rt.delegated) s.inbox.push({ kind: "failed", key: "fail-" + x.id, task: x.id, seq: e.seq, error: rt.attempts.at(-1)?.error || "重启前已用完重试次数" }); });
            } else s.order.forEach(id => { if (s.tasks[id].status !== "succeeded") s.tasks[id].status = "pending"; });
            if (d.phase === "planning") ag("lead").phase = "thinking";
            break;
          case "plan.revision_requested": s.inbox = s.inbox.filter(i => i.key !== "plan"); s.run.status = "planning"; s.tasks = {}; s.order = []; ag("lead").phase = "thinking"; break;
          case "artifact.created": { const a = { ...d, task: e.task, attempt: e.attempt, seq: e.seq, by: e.actor }; s.artifacts.push(a); t.artifacts.push(a); break; }
          case "attempt.failed": { endLive(t); const at = t.attempts.at(-1); at.status = "failed"; at.error = d.error; t.status = "ready"; Object.assign(ag(t.agent), { phase: "error", note: d.error, progress: null }); break; }
          case "review.rejected": {
            const target = s.tasks[d.target]; target.attempts.at(-1).status = "rejected";
            const own = t.attempts.at(-1); if (own) own.status = "verdict"; endLive(t);
            t.status = "blocked"; t.blockedBy = d.target; Object.assign(ag(e.actor), { phase: "idle", note: "", progress: null }); break;
          }
          case "task.reopened": t.status = "ready"; s.inbox = s.inbox.filter(i => !["fail-" + e.task, "verify-" + e.task, "run-decision"].includes(i.key)); if (["delivered", "accepted", "accepted_with_risk"].includes(s.run.status)) s.run.status = "running"; break;
          case "task.succeeded": {
            Object.assign(t, { status: "succeeded", progress: 100, summary: d.summary, evidence: d.evidence }); endLive(t);
            const at = t.attempts.at(-1); if (at && at.status === "running") at.status = "succeeded";
            Object.assign(ag(t.agent), { phase: t.agent === "lead" ? "coordinating" : "idle", note: "", progress: null }); break;
          }
          case "fix.requested": s.answers[d.key] = true; break;
          case "run.delivered": s.run.status = "delivered"; s.result = { ...d, seq: e.seq }; Object.assign(ag("lead"), { phase: "idle", note: "" }); break;
          case "run.accepted_with_risk": s.run.status = "accepted_with_risk"; s.inbox = s.inbox.filter(i => !["run_decision", "failed", "budget"].includes(i.kind)); break;
          case "risk.accepted": s.run.status = "accepted"; if (s.result) s.result.accepted = e.ts; break;
        }
      }
      return s;
    }

    // ============================================================
    // Server client: the orchestrator owns state; the page renders its events
    // ============================================================
    async function api(path, body) {
      const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const text = await res.text();
  if (!res.ok) {
    const error = new Error(text || res.statusText);
    error.status = res.status;
    throw error;
  }
      return text ? JSON.parse(text) : {};
    }
    async function act(body) {
      if (S.replay != null || !S.runId) return;
  body = { ...body, commandId: body.commandId || (crypto.randomUUID ? crypto.randomUUID() : `cmd-${Date.now()}-${Math.random()}`) };
  for (let attempt = 0; attempt < 2; attempt++) {
    body.expectedSequence = S.events.at(-1)?.seq || 0;
    try {
      await api(`/api/runs/${S.runId}/actions`, body);
      // Resuming (or messaging an interrupted run) makes it live again: reconnect, staying on this page.
      if (!S.live && ["resumeRun", "message"].includes(body.type)) { await openRun(S.runId, true); toast("已从中断处继续"); }
      return;
    } catch (err) {
      if (err.status === 409 && attempt === 0) {
        try {
          await openRun(S.runId, true);
          continue;
        } catch (refreshErr) {
          toast("状态刷新失败：" + refreshErr.message);
        }
      }
      toast(err.message);
      return;
    }
  }
    }
    async function loadMeta() {
      try { S.meta = await api("/api/meta"); } catch (err) { toast("连不上 Janus 后端：" + err.message); }
    }
    async function loadRuns() {
      try { S.runs = (await api("/api/runs")).runs; } catch { S.runs = []; }
    }
    let inspectTimer;
    function inspectPath() {
      clearTimeout(inspectTimer);
      inspectTimer = setTimeout(async () => {
        try { S.inspect = await api("/api/inspect?path=" + encodeURIComponent(S.cfg.path)); } catch { S.inspect = null; }
        const el = document.getElementById("inspectLine"); if (el) el.innerHTML = inspectLine();
      }, 250);
    }
    function inspectLine() {
      const i = S.inspect;
      if (!S.cfg.path.trim()) return "请填写一个目录";
      if (!i) return "检查中…";
      if (!i.exists) return `<span style="color:var(--red)">目录不存在</span>`;
      if (!i.git) return "不是 Git 仓库：任务直接在这个目录中执行，Janus 不会生成改动的 diff";
      return `✓ Git 仓库 · 当前分支 ${esc(i.branch)} · ${i.dirty ? `⚠ 有 ${i.dirty} 个未提交改动（任务会直接在这些改动之上工作）` : "工作区干净"}`;
    }
    async function createRun(goal, workspace) {
      try {
        const { id } = await api("/api/runs", { goal, workspace });
        S.goal = "";
        S.modal = null;
        await openRun(id);
      } catch (err) { toast("创建失败：" + err.message); }
    }
    // @project-doc docs/architecture/frontend.md#server_sync
    async function openRun(id, keepPage) {
      S.es?.close();
      const data = await api(`/api/runs/${id}`);
      history.replaceState(null, "", `?run=${id}`);
      if (data.run.config?.workspace?.id && wsOf(data.run.config.workspace.id)) rememberWs(data.run.config.workspace.id);
      const view = keepPage && S.runId === id ? { page: S.page, taskId: S.taskId, agentId: S.agentId } : { page: "board", taskId: null, agentId: null };
      Object.assign(S, { runId: id, runTeam: data.run.config?.team || null, runConfig: data.run.config || null, menu: null, live: data.live, events: data.events, screen: "app", ...view, replay: null, drafts: {}, hl: null, openRow: null, modal: null, boardSel: null, boardAgent: "", boardTask: "", boardMore: {} });
      await loadRuns();
      mountApp(); render();
      const es = new EventSource(`/api/runs/${id}/stream?after=${S.events.length ? S.events.at(-1).seq : 0}`);
      es.onmessage = msg => {
        const e = JSON.parse(msg.data);
        const last = S.events.length ? S.events.at(-1).seq : 0;
        if (e.seq <= last) return;
        if (e.seq !== last + 1) { openRun(id); return; }
        S.events.push(e); render();
      };
      es.addEventListener("lagged", () => openRun(id));
      S.es = es;
    }

    // ============================================================
    // Goal mode has no plan to confirm or review stage: the lead pursues the goal, may bring in the
    // team, and delivers.
    function goalStages(st) {
      return st.run.mode === "goal" ? ["推进目标", "协作", "交付", "验收"] : ["确认计划", "执行", "评审", "交付", "验收"];
    }
    function goalStageIndex(st) {
      const r = st.run;
      if (r.status === "accepted") return 4;
      if (["delivered", "accepted_with_risk"].includes(r.status)) return 3;
      if (st.order.some(id => !["succeeded", "failed", "cancelled"].includes(st.tasks[id].status))) return 1;
      return 0;
    }

    // What the run does to its directory, from facts rather than the sentence recorded at creation:
    // runs that work in place used to be described as read-only outside Git.
    function wsNote(r) {
      if (r.git) return r.workspace || `Git 仓库，基线 ${(r.baseRef || "").slice(0, 7)}`;
      if (r.inPlace) return "非 Git 目录：任务直接在这个目录中执行，没有 diff";
      return r.workspace || "";
    }

    // Global settings (Agents, roles) and workspaces (where and with whom tasks run)
    // ============================================================
    const kindOf = id => S.meta?.kinds?.find(k => k.id === id);
    const connOf = id => S.setup.connections.find(c => c.id === id);
    const roleOf = id => S.setup.roles.find(r => r.id === id);
    const wsOf = id => S.setup.workspaces.find(w => w.id === id);
    const okConns = () => S.setup.connections.filter(c => c.status === "ok");
    const boundRoles = () => S.setup.roles.filter(r => r.connection && connOf(r.connection));
    const curWs = () => wsOf(S.wsId) || S.setup.workspaces[0] || null;
    const runsOf = ws => S.runs.filter(r => ws && (r.config?.workspace?.id ? r.config.workspace.id === ws.id : r.cwd === ws.path));
    const roleAv = (r, cls = "") => `<span class="pv-ic ${cls}" style="background:${esc(r?.color || "#64748b")}">${esc(r?.init || "?")}</span>`;
    const ROLE_COLORS = ["#c96442", "#7b6cc2", "#3f7d5b", "#b5852b", "#2f7f8c", "#b04d6d", "#5f6b7a", "#8a6a4f"];

    async function loadSetup() {
      try { S.setup = await api("/api/setup"); } catch (err) { toast("读取设置失败：" + err.message); }
      renderScreen();
    }
    async function setupSave(kind, body) {
      const res = await fetch(`/api/setup/${kind}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const text = await res.text();
      if (!res.ok) throw new Error(text || res.statusText);
      return JSON.parse(text);
    }
    async function setupDelete(kind, id) {
      const res = await fetch(`/api/setup/${kind}/${id}`, { method: "DELETE" });
      if (!res.ok) throw new Error(await res.text());
    }
    function rememberWs(id) { S.wsId = id; try { localStorage.setItem("janus.ws", id); } catch {} }

    // What is still missing before a first task can run, in order.
    function onboarding() {
      return [
        ["接入一个 Agent", okConns().length > 0, () => go("settings", { tab: "agents" })],
        ["定义角色（含一个主控）", boundRoles().some(r => r.lead) && boundRoles().length >= 2, () => go("settings", { tab: "roles" })],
        ["新建工作区", S.setup.workspaces.length > 0, () => openWsEdit(null)]
      ];
    }
    function nextStep() { return onboarding().find(([, done]) => !done); }

    function go(screen, opts = {}) {
      S.es?.close();
      Object.assign(S, { screen, replay: null, modal: null, menu: null }, opts.tab ? { tab: opts.tab } : {});
      if (screen === "home" && opts.ws) rememberWs(opts.ws);
      history.replaceState(null, "", screen === "settings" ? `?settings=${S.tab}` : screen === "home" && S.wsId ? `?ws=${S.wsId}` : location.pathname);
      renderScreen(); window.scrollTo(0, 0);
    }
    function renderScreen() {
      if (S.screen === "app") { render(); return; }
      const focus = document.activeElement?.id;
      // Rebuilding replaces every scrolled panel (the role dialog, lists); put them back where they were.
      const key = el => `${el.className}#${[...document.querySelectorAll(`.${CSS.escape(el.classList[0])}`)].indexOf(el)}`;
      const scrolled = [...$("#root").querySelectorAll("*")].filter(el => el.scrollTop > 0 && el.classList.length).map(el => [key(el), el.scrollTop]);
      const winY = window.scrollY;
      const body = S.screen === "settings" ? settingsPage() : S.screen === "workspace" ? wsEditPage() : homePage();
      $("#root").innerHTML = body + (S.connDraft ? providerDialog() : "") + (S.roleDraft ? roleDrawer() : "") + (S.picker ? folderPicker() : "");
      for (const [k, top] of scrolled) { const el = [...$("#root").querySelectorAll("*")].find(x => x.classList.length && key(x) === k); if (el) el.scrollTop = top; }
      window.scrollTo(0, winY);
      if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); if (el.setSelectionRange && el.type !== "password" && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
    }

    // ---------- Top bar shared by every screen ----------
    function wsSwitcher() {
      // While creating a workspace, the top bar is about that new workspace only.
      if (S.screen === "workspace" && !S.wsDraft?.id) return `<span class="ws-btn ws-new"><span class="ws-dot">＋</span><b>新建工作区</b></span>`;
      const ws = S.screen === "workspace" ? wsOf(S.wsDraft.id) : curWs();
      if (!S.setup.workspaces.length) return "";
      const menu = S.menu === "ws" ? `<div class="menu ws-menu" role="menu">
          <div class="menu-g">工作区</div>
          ${S.setup.workspaces.map(w => `<button data-act="wsOpen" data-v="${w.id}" class="${w.id === ws?.id ? "on" : ""}"><b>${esc(w.name)}</b><span>${esc(w.path)}</span></button>`).join("")}
          <hr><button data-act="wsNew">＋ 新建工作区</button>${ws ? `<button data-act="wsEdit" data-v="${ws.id}">当前工作区设置</button>` : ""}</div>` : "";
      return `<span class="menu-wrap"><button class="ws-btn" data-act="toggleMenu" data-v="ws" aria-haspopup="menu"><span class="ws-dot">⌂</span><b>${esc(ws?.name || "选择工作区")}</b><span class="caret">▾</span></button>${menu}</span>`;
    }
    // Left: where you are (workspace / task). Right: things that are not about this workspace.
    function topbar(center = "") {
      return `<header class="hdr"><div class="hdr-in">
        <div class="brand" data-act="goHome" role="button" tabindex="0" style="cursor:pointer"><span class="mark">J</span>Janus</div>
        <div class="ctx">${wsSwitcher()}</div>${center}
        <div class="hdr-r"><button class="btn sm ${S.screen === "settings" ? "on-tab" : ""}" data-act="goSettings">⚙ 设置</button></div>
      </div></header>`;
    }
    function onboardBar() {
      const steps = onboarding();

        <button class="btn sm primary" data-act="onbNext">${esc(nextStep()[0])} →</button></div>`;
    }

    // ---------- Settings: system-wide Agents and roles ----------
    const envText = env => Object.entries(env || {}).map(([k, v]) => `${k}=${/\s|#/.test(v) ? JSON.stringify(v) : v}`).join("\n");
    const typeIcon = (k, cls = "") => `<span class="pv-ic ${cls}" style="background:${k?.color || "#64748b"}">${esc(k?.init || "?")}</span>`;
    // The auth method's own `login` flag says whether Janus drives an account login (Codex ChatGPT, Grok xAI).
    const loginAuth = c => kindOf(c.kind)?.auths?.find(a => a.id === c.auth && a.login);
    function connStatus(c) {
      if (c.status === "testing") return ["检查中…", "blue"];
      if (loginAuth(c) && !c.loggedIn) return c.login?.state === "running" ? ["等待登录", "amber"] : ["未登录", "amber"];
      return { ok: ["可用", "green"], error: ["失败", "red"], untested: ["未测试", "gray"] }[c.status] || ["未测试", "gray"];
    }

    function settingsPage() {
      const tab = S.tab || "agents";
      const nav = [["agents", "Agents", S.setup.connections.length], ["roles", "角色", S.setup.roles.length], ["adapters", "ACP 适配器", S.adapters ? S.adapters.adapters.filter(a => a.current).length : "…"]];
      if (tab === "adapters" && !S.adapters) loadAdapters();
      return `${topbar()}
        <div class="set">
          <nav class="set-nav" aria-label="设置">
