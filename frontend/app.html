          case "plan.approved": decisions.push({ ...base, key: "d" + e.seq, title: `确认计划${plans > 1 ? `（第 ${plans} 版）` : ""}`, text: `${st.order.length} 个任务${Object.keys(d.overrides || {}).length ? `，改派 ${Object.entries(d.overrides).map(([t, a]) => `${t} → ${who(a).name}`).join("、")}` : ""}`, agents: ["lead"] }); break;
          case "orchestration.accepted": decisions.push({ ...base, key: "d" + e.seq, title: "主控提交编排", text: (d.tasks || []).map(x => `${x.id} ${x.title} → ${who(x.agent).name}${x.deps?.length ? `（依赖 ${x.deps.join("、")}）` : ""}`).join("\n"), tasks: (d.tasks || []).map(x => x.id), agents: ["lead"] }); break;
          case "orchestration.rejected": decisions.push({ ...base, key: "d" + e.seq, title: "编排没有通过校验", text: (d.errors || []).join("\n") || e.text, agents: ["lead"] }); break;
          case "board.posted":
            if (d.kind === "blocker") blockers.push({ ...base, key: "ob" + e.seq, title: `${e.task} 遇到阻塞`, text: d.text || e.text, tasks: [e.task], agents: [e.actor, "lead"], urgent: true, task: e.task });
            else handoffs.push({ ...base, key: "h" + e.seq, by: e.actor, from: e.task, to: "lead", agent: "lead", summary: `${d.kind === "note" ? "备注" : "进展"}：${d.text || e.text}`, artifacts: [], post: true });
            break;
          case "plan.revision_requested": revisions++; decisions.push({ ...base, key: "d" + e.seq, title: "要求重新规划", text: d.feedback || e.text, agents: ["lead"] }); break;
          case "question.answered": decisions.push({ ...base, key: "d" + e.seq, title: `回答 ${e.task || ""} 的提问`, text: d.answer + (d.note ? `；${d.note}` : ""), tasks: [e.task], agents: [e.to] }); break;
          case "approval.granted": case "approval.denied": decisions.push({ ...base, key: "d" + e.seq, title: e.type === "approval.granted" ? "批准一次操作" : "拒绝一次操作", text: e.text, tasks: [e.task], agents: [e.to] }); break;
          case "review.approved": case "review.rejected":
            decisions.push({ ...base, key: "d" + e.seq, title: e.type === "review.approved" ? `评审通过${d.target ? ` ${d.target}` : ""}` : `评审驳回 ${d.target}`, text: (d.findings || []).map(f => `[${f.severity}] ${f.text}`).join("\n") || e.text, tasks: [e.task, d.target].filter(Boolean), agents: [e.actor], reject: e.type === "review.rejected" }); break;
          case "risk.accepted": decisions.push({ ...base, key: "d" + e.seq, title: "接受风险并验收", text: e.text }); break;
          case "user.message": {
            const dup = d.delivery === "prompt" && decisions.some(x => x.msg && x.to === e.to && x.text === d.text);
            if (!dup) decisions.push({ ...base, key: "d" + e.seq, title: `给 ${who(e.to).name} 的补充`, text: d.text || e.text, tasks: e.task ? [e.task] : [], agents: [e.to], msg: true, to: e.to });
            if (!d.id && ["next", "queued"].includes(d.delivery)) (notes[e.to] ||= []).push({ ...base, text: d.text || e.text, task: e.task, delivery: d.delivery });
            break;
          }
          case "message.delivered": if (!d.ids) delete notes[e.to]; break;
        }
      }
      // Messages with ids still waiting for their agent: queued for the turn's end, or left for its next session.
      Object.values(st.msgs || {}).filter(m => !m.deliveredSeq && ["queued", "next"].includes(m.delivery))
        .forEach(m => (notes[m.to] ||= []).push({ seq: m.seq, ts: 0, by: m.by, text: m.text, task: m.task || m.routedTask, delivery: m.delivery }));
      // Each result is used by whoever it was handed to; a newer attempt supersedes an older one.
      results.forEach(r => {
        r.usedBy = handoffs.filter(h => h.from === r.task && h.seq > r.seq && !results.some(x => x.task === r.task && x.seq > r.seq && x.seq < h.seq)).map(h => h.to);
        r.old = results.some(x => x.task === r.task && x.seq > r.seq);
      });
      const arts = st.artifacts.map(a => ({ ...a, key: "a" + a.seq, old: st.artifacts.some(x => x.task === a.task && x.kind === a.kind && x.kind !== "report" && x.seq > a.seq) || (a.kind === "report" && st.artifacts.some(x => x.task === a.task && x.kind === "report" && x.attempt > a.attempt)), usedBy: [...new Set(handoffs.filter(h => h.artifacts.includes(a.name)).map(h => h.to))] }));
      // Open items: anything that blocks someone until a person or an agent acts.
      const open = st.inbox.map(i => {
        const t = i.task && st.tasks[i.task];
        const title = { plan: "计划等你确认", question: `${i.task} 的提问等你回答`, approval: `${i.task || who(i.agent).name} 请求你决定`, input: `${i.task || who(i.agent).name} 需要你${i.mode === "url" ? "打开链接" : "填写"}`, failed: `${i.task} 用完重试次数`, session: `${i.task || who(i.agent).name} 这一轮结束，等你的消息` }[i.kind] || "等你处理";
        const text = i.kind === "question" ? t?.question?.question : i.kind === "approval" ? i.command : i.kind === "input" ? i.message : i.kind === "failed" ? i.error : i.kind === "plan" ? `${st.order.length} 个任务` : "";
        return { key: "o" + i.seq + i.kind, seq: i.seq, title, text: text || "", tasks: i.task ? [i.task] : [], agents: [t?.agent || i.agent || "lead"], urgent: true };
      });
      // Goal mode: a collaborator's blocker stays open while its task is unfinished, and a question
      // waits for the lead (who answers it with janus.reply), not for the person.
      blockers.filter(b => !["succeeded", "failed", "cancelled"].includes(st.tasks[b.task]?.status)).forEach(b => open.push(b));
      if (st.run.mode === "goal") st.order.map(id => st.tasks[id]).filter(t => t.status === "waiting_input" && t.question && t.question.answer == null && !st.inbox.some(i => i.key === t.question.key)).forEach(t => {
        open.push({ key: "oq" + t.id + t.question.seq, seq: t.question.seq, title: `${t.id} 的提问等主控回答`, text: t.question.question || "", tasks: [t.id], agents: [t.agent, "lead"], sub: "主控会在看板上看到并回答" });
      });
      st.order.map(id => st.tasks[id]).filter(t => t.status === "blocked").forEach(t => {
        const r = [...decisions].reverse().find(x => x.reject && x.tasks.includes(t.blockedBy));
        open.push({ key: "ob" + t.id, seq: r?.seq, title: `${t.blockedBy} 按评审意见修复中`, text: r?.text || "", tasks: [t.blockedBy, t.id], agents: [st.tasks[t.blockedBy]?.agent, t.agent].filter(Boolean) });
      });
      // Once the run is over, a message still waiting can no longer reach anyone: mark it instead of listing it as open.
      const over = ["delivered", "accepted", "accepted_with_risk", "cancelled", "failed"].includes(st.run.status);
      if (over) Object.values(notes).flat().forEach(n => { const d = decisions.find(x => x.seq === n.seq); if (d) d.lost = true; });
      else Object.entries(notes).forEach(([agent, list]) => list.forEach(n => open.push({ key: "on" + n.seq, seq: n.seq, title: `留给 ${who(agent).name} 的消息`, text: n.text, tasks: n.task ? [n.task] : [], agents: [agent], sub: n.delivery === "queued" ? "这一轮结束后送达" : "下次会话时带给它" })));
      return { open, results, arts, handoffs, decisions };
    }
    function shared(st, full) {
      if (!st.run.goal) return "";
      const tabs = `<div class="filters" style="margin:0">${[["board", "看板"], ["feed", "动态"]].map(([k, l]) => `<button class="${S.boardView === k ? "on" : ""}" data-act="boardView" data-v="${k}">${l}</button>`).join("")}</div>`;
      const head = `<div class="sec-h"><h2>共享看板</h2>${tabs}</div>`;
      if (S.boardView === "feed") return head + medium(st, full);
      const f = boardFacts(st);
      const pick = x => (!S.boardAgent || [x.by, x.agent, ...(x.agents || [])].includes(S.boardAgent)) && (!S.boardTask || [x.task, x.from, x.to, ...(x.tasks || [])].includes(S.boardTask));
      const tag = id => id ? `<span class="tid">${esc(id)}</span>` : "";
      const seq = n => n ? `<button class="seq" data-act="seq" data-v="${n}">#${n}</button>` : "";
      const card = (x, body, more, rel) => {
        const on = S.boardSel?.key === x.key;
        return `<div class="fact${on ? " on" : ""}${x.old ? " old" : ""}${x.urgent ? " urgent" : ""}" data-act="fact" data-v="${x.key}" data-tasks="${esc(rel.tasks.filter(Boolean).join(","))}" data-agents="${esc(rel.agents.filter(Boolean).join(","))}" role="button" tabindex="0">${body}${on ? `<div class="fact-x">${more}</div>` : ""}</div>`;
      };
      const by = id => `<span class="fact-by">${avatar(id)} ${esc(who(id).name)}</span>`;
      const lanes = [
        { k: "open", title: "待决", items: f.open, empty: "没有卡住的事", render: x => card(x,
          `<div class="fact-h">${x.tasks.map(tag).join("")}<b>${esc(x.title)}</b></div>${x.text ? `<p>${esc(short(x.text, 90))}</p>` : ""}${x.sub ? `<div class="fact-m">${esc(x.sub)}</div>` : ""}`,
          `${x.text.length > 90 ? `<p class="pre">${esc(x.text)}</p>` : ""}<div class="fact-a">${x.tasks[0] ? `<button class="btn sm" data-act="task" data-v="${x.tasks[0]}">去处理</button>` : ""}${x.agents[0] ? `<button class="btn sm ghost" data-act="agentChat" data-v="${x.agents[0]}">和 ${esc(who(x.agents[0]).name)} 对话</button>` : ""}${seq(x.seq)}</div>`,
          x) },
        { k: "results", title: "结论", items: f.results, empty: "还没有任务交付结论", render: x => card(x,
          `<div class="fact-h">${tag(x.task)}${by(x.by)}${x.old ? `<span class="fact-m">旧版本</span>` : ""}</div><p>${esc(short(x.summary, 90))}</p>
           <div class="fact-m">${x.evidence.length} 条证据${x.risks.length ? ` · <span class="warn">${x.risks.length} 条风险</span>` : ""}${x.usedBy.length ? ` · 交给 ${x.usedBy.join("、")}` : ""}</div>`,
          `${x.summary.length > 90 ? `<p class="pre">${esc(x.summary)}</p>` : ""}${x.evidence.length ? `<h5>证据</h5><ul>${x.evidence.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : ""}${x.risks.length ? `<h5>风险</h5><ul>${x.risks.map(v => `<li>⚠ ${esc(v)}</li>`).join("")}</ul>` : ""}<div class="fact-a"><button class="btn sm" data-act="task" data-v="${x.task}">任务详情</button><button class="btn sm ghost" data-act="agentChat" data-v="${x.by}">和 ${esc(who(x.by).name)} 对话</button>${seq(x.seq)}</div>`,
          { tasks: [x.task, ...x.usedBy], agents: [x.by, ...x.usedBy.map(id => st.tasks[id]?.agent)] }) },
        { k: "arts", title: "产物", items: f.arts, empty: "还没有产物", render: x => card(x,
          `<div class="fact-h">${tag(x.task)}<b class="mono">${esc(x.name)}</b></div><div class="fact-m">${esc(ART_KIND[x.kind] || x.kind)}${x.bytes != null ? ` · ${kb(x.bytes)}` : ""}${x.old ? " · 旧版本" : ""}${x.usedBy.length ? ` · 交给 ${x.usedBy.join("、")}` : ""}</div>`,
          `${x.desc ? `<p>${esc(x.desc)}</p>` : ""}<div class="fact-m">由 ${esc(who(x.by).name)} 在第 ${x.attempt} 次尝试中提交${x.hash ? ` · <span class="mono">${esc(x.hash)}</span>` : ""}</div><div class="fact-a"><a class="btn sm" href="/api/file?path=${encodeURIComponent(x.path)}" target="_blank" rel="noopener">打开</a>${seq(x.seq)}</div>`,
          { tasks: [x.task, ...x.usedBy], agents: [x.by] }) },
        { k: "handoffs", title: "交接", items: f.handoffs, empty: "还没有交接", render: x => card(x,
          `<div class="fact-h">${tag(x.from)}<span class="arrow">→</span>${tag(x.to)}<span class="fact-by">${avatar(x.agent)} ${esc(who(x.agent).name)}</span></div><p>${esc(short(x.summary || "上游没有提交结论", 80))}</p>${x.artifacts.length ? `<div class="fact-m">带上 ${x.artifacts.length} 个产物</div>` : ""}`,
          `${x.artifacts.length ? `<ul>${x.artifacts.map(n => `<li class="mono">${esc(n)}</li>`).join("")}</ul>` : ""}<div class="fact-m">${clock(x.ts)} 注入 ${esc(who(x.agent).name)} 的新会话</div><div class="fact-a"><button class="btn sm" data-act="task" data-v="${x.to}">看 ${x.to} 收到了什么</button>${seq(x.seq)}</div>`,
          { tasks: [x.from, x.to], agents: [x.by, x.agent] }) },
        { k: "decisions", title: "决定", items: f.decisions, empty: "还没有决定", render: x => card(x,
          `<div class="fact-h">${(x.tasks || []).slice(0, 2).map(tag).join("")}<b>${esc(x.title)}</b></div><p>${esc(short(x.text, 90))}</p><div class="fact-m">${esc(who(x.by).name)} · ${clock(x.ts)}${x.lost ? ` · <span class="warn">未送达</span>` : ""}</div>`,
          `${x.text.length > 90 ? `<p class="pre">${esc(x.text)}</p>` : ""}<div class="fact-a">${x.agents?.[0] && x.agents[0] !== "user" ? `<button class="btn sm ghost" data-act="agentChat" data-v="${x.agents[0]}">和 ${esc(who(x.agents[0]).name)} 对话</button>` : ""}${seq(x.seq)}</div>`,
          { tasks: x.tasks || [], agents: x.agents || [] }) }
      ];
      const LIMIT = 5;
      const cols = lanes.map(l => {
        const items = l.items.filter(pick).reverse();
        const all = S.boardMore[l.k], shown = all ? items : items.slice(0, LIMIT);
        return `<div class="lane${l.k === "open" && items.length ? " lane-open" : ""}"><div class="lane-h"><b>${l.title}</b><span>${items.length}</span></div>
          ${items.length ? shown.map(l.render).join("") : `<p class="lane-e">${l.empty}</p>`}
          ${items.length > LIMIT ? `<button class="link lane-more" data-act="boardMore" data-v="${l.k}">${all ? "收起" : `还有 ${items.length - LIMIT} 条`}</button>` : ""}</div>`;
      });
      // Open items block someone, so they sit above the lanes as a strip; with none, a single line says so.
      const openCol = cols.shift(), openN = f.open.filter(pick).length;
      const members = team(), tasks = st.order;
      const filters = `<div class="board-f">
        <select class="run-pick" data-bind="boardAgent" aria-label="按 Agent 筛选"><option value="">全部 Agent</option>${members.map(m => `<option value="${m.id}" ${S.boardAgent === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
        <select class="run-pick" data-bind="boardTask" aria-label="按任务筛选"><option value="">全部任务</option>${tasks.map(id => `<option value="${id}" ${S.boardTask === id ? "selected" : ""}>${id} ${esc(short(st.tasks[id].title, 16))}</option>`).join("")}</select>
        ${S.boardSel ? `<button class="link" data-act="fact" data-v="${S.boardSel.key}">取消高亮</button>` : ""}${openN ? "" : `<span class="board-ok">没有卡住的事</span>`}</div>`;
      return head + `<article class="card shared">${filters}${openN ? openCol : ""}<div class="lanes">${cols.join("")}</div></article>`;
    }

    function medium(st, full) {
      const all = st.events.filter(e => categoryOf(e.type) !== "progress");
      const list = all.filter(e => S.medium === "all" || categoryOf(e.type) === S.medium).slice(-14).reverse();
      return `<article class="card panel">
        <div class="filters">${["all", "tasks", "messages", "artifacts", "decisions"].map(k => `<button class="${S.medium === k ? "on" : ""}" data-act="medium" data-v="${k}">${CATEGORY_LABEL[k]}</button>`).join("")}</div>
        ${list.length ? list.map(e => evRow(e)).join("") : `<p class="small muted" style="padding:10px 0">还没有事件。</p>`}
        <button class="btn sm panel-more" data-act="nav" data-v="audit">查看全部 ${full.events.length} 条事件 →</button>
      </article>`;
    }
    function evRow(e) {
      const route = e.to ? ` → ${esc(who(e.to).name)}` : "";
      return `<div class="ev"><span class="ev-i ${toneOf(e.type)}">${ICON[e.type] || "·"}</span><div><div class="ev-t"><b>${esc(who(e.actor).name)}${route}</b>　${esc(e.text)}</div>
        <div class="ev-m"><code>${e.type}</code>${e.task ? `<span>${e.task}${e.attempt ? ` · 尝试 ${e.attempt}` : ""}</span>` : ""}<span>${clock(e.ts)}</span><button class="seq" data-act="seq" data-v="${e.seq}">#${e.seq}</button></div></div></div>`;
    }

    // ---------- Task detail ----------
    function taskPage(st) {
      const t = st.tasks[S.taskId];
      if (!t) return `<div class="card skeleton">在当前回放位置，这个任务还不存在。<br><button class="btn sm" data-act="nav" data-v="board" style="margin-top:10px">返回工作台</button></div>`;
      const m = who(t.agent);
      const [label, tone] = TASK_STATUS[t.status];
      const evs = st.events.filter(e => e.task === t.id || e.data?.target === t.id || (e.data?.tasks || []).includes(t.id) || (e.data?.unlocked || []).includes(t.id));
      const done = t.status === "succeeded";
      const ws = t.attempts.at(-1)?.workspace || "工作目录";
      const started = evs.filter(e => e.type === "attempt.started");
      const lastStart = started.at(-1)?.data || {};
      const prompt = lastStart.prompt || "任务还没有开始，Prompt 会在启动尝试时由编排器生成。";
      const timeline = evs.map(e => {
        if (e.type === "attempt.started") return `<div class="tl-div"><b>尝试 ${e.attempt}</b><span>${esc(e.data.runtime || "")}</span><span>会话 <code>${esc(short(e.data.session, 40))}</code></span><span>${esc(e.data.workspace)}</span><button class="seq" data-act="seq" data-v="${e.seq}">#${e.seq}</button></div>`;
        let body = "";
        if (["tool.call", "tool.started", "tool.completed"].includes(e.type)) body = `<div class="tool"><code>${esc(e.data.tool)}</code> <code>${esc(e.data.input || "")}</code>${e.type === "tool.started" ? `<div>等待返回…</div>` : `<div>→ ${esc(e.data.output || "")}</div>`}</div>`;
        if (e.type === "decision.summary") body = `<div class="why"><b>${esc(e.data.title)}</b><br>${esc(e.data.why)}</div>`;
        if (e.type === "question.asked") body = `<div class="route">${esc(e.data.question)}<br>选项：${e.data.options.map(esc).join(" / ")}</div>`;
        if (e.type === "question.answered" && e.data.note) body = `<div class="route">补充说明：${esc(e.data.note)}</div>`;
        if (e.type === "attempt.failed") body = `<div class="find">${esc(e.data.error)}</div>`;
        if (e.type === "task.retry_scheduled") body = `<div class="route">重试策略：${esc(e.data.strategy)}</div>`;
        if (e.type === "review.rejected") body = e.data.findings.map(f => `<div class="find"><b>[${esc(f.severity)}]</b> ${esc(f.text)}<br><span class="mono">${esc(f.ref)}</span></div>`).join("");
        if (e.type === "review.approved") body = `<div class="route">引用：${e.data.refs.map(esc).join("；")}</div>`;
        if (e.type === "artifact.created") body = `<div class="route">${esc(e.data.desc)}<br><span class="mono">${esc(e.data.path)} · sha256 ${esc(e.data.hash)}…</span> <a class="link" href="/api/file?path=${encodeURIComponent(e.data.path)}" target="_blank">查看</a></div>`;
        if (e.type === "policy.violation") body = `<div class="find">${(e.data.files || []).map(esc).join("、")}</div>`;
        if (e.type === "result.submitted" && e.data.risks?.length) body = `<div class="route">风险：${e.data.risks.map(esc).join("；")}</div>`;
        if (e.type === "approval.requested") body = `<pre class="cmd">$ ${esc(e.data.command)}</pre>`;
        return `<div class="tl-i"><span class="ev-i ${toneOf(e.type)}">${ICON[e.type] || "·"}</span><div><div class="ev-t"><b>${esc(who(e.actor).name)}</b>　${esc(e.text)}</div>${body}</div><div class="r"><span>${clock(e.ts)}</span><button class="seq" data-act="seq" data-v="${e.seq}">#${e.seq}</button></div></div>`;
      }).join("");
      const cands = t.candidates.map(c => `<tr class="${c.id === t.agent ? "pick-row" : ""}"><td>${avatar(c.id)} ${esc(who(c.id).name)}${c.id === t.agent ? " ✓" : ""}</td><td>${c.excluded ? `<span class="x">已排除：${esc(c.excluded)}</span>` : `<span class="x">${esc(c.note)}</span>`}</td></tr>`).join("");
      const lastAt = t.attempts.at(-1);
      const reviews = st.events.filter(e => /^review\./.test(e.type) && (e.task === t.id || e.data?.target === t.id));
      return `<div class="crumbs"><button class="link" data-act="nav" data-v="board">← 工作台</button><span>/</span><span>任务详情</span></div>
        <div class="task-hero"><div><span class="tid">${t.id}</span> <span class="pill ${tone}">${label}</span>${t.attempts.length > 1 ? ` <span class="pill gray">第 ${t.attempts.length} 次尝试</span>` : ""}<h1>${esc(t.title)}</h1><p>${esc(t.desc)}</p></div>
          <div class="run-ctl"><button class="btn sm" data-act="auditTask" data-v="${t.id}">在审计日志中查看</button></div></div>
        <div class="detail"><div>
          ${sessionCard(st, t)}
          <article class="card"><div class="card-h"><h3>验收标准</h3><span>完成必须附带证据</span></div>
            <ul class="acc">${t.accept.map(a => `<li class="${done ? "ok" : ""}"><i>${done ? "✓" : "○"}</i>${esc(a)}</li>`).join("")}</ul>
            ${t.summary ? `<div class="route" style="margin-top:10px"><b>结构化结果：</b>${esc(t.summary)}<br>证据：${(t.evidence || []).map(esc).join("；")}</div>` : ""}
          </article>
          <article class="card"><div class="card-h"><h3>执行轨迹</h3><span>${evs.length} 条事件 · 按尝试分组</span></div>
            <div class="tl">${timeline || `<p class="small muted">任务还没有开始。</p>`}</div>
            <p class="honest">这里展示 Agent 通过 ACP 回传的工具调用、结构化结果和产物；模型的原始思考（agent_thought_chunk）不会被记录。</p>
          </article>
          <article class="card"><div class="card-h"><h3>Prompt</h3><span>最近一次尝试中由编排器通过 ACP 发给 Agent</span></div><pre class="prompt">${esc(prompt)}</pre></article>
        </div><div>
          <article class="card"><div class="card-h"><h3>为什么分配给 ${esc(m.name)}</h3><span>主控指定 · 记录于 ${t.delegated ? "orchestration.accepted" : "plan.proposed"}</span></div>
            <table class="cand"><tbody>${cands}</tbody></table>
            ${t.overridden ? `<p class="small muted" style="margin-top:8px">你在确认计划时改派了执行者。</p>` : ""}
          </article>
          <article class="card"><div class="card-h"><h3>依赖</h3></div>
            <div class="kvs"><label>上游</label><span>${t.deps.length ? t.deps.map(d => `<button class="link" data-act="task" data-v="${d}">${d} ${esc(st.tasks[d].title)}</button>`).join("<br>") : "无"}</span>
            <label>下游</label><span>${st.order.filter(id => st.tasks[id].deps.includes(t.id)).map(d => `<button class="link" data-act="task" data-v="${d}">${d} ${esc(st.tasks[d].title)}</button>`).join("<br>") || "无"}</span></div>
          </article>
          <article class="card"><div class="card-h"><h3>尝试记录</h3><span>重试会新建尝试，旧记录保留</span></div>
            ${t.attempts.length ? t.attempts.map(a => { const [al, at] = ATTEMPT_STATUS[a.status]; return `<div class="att"><b>#${a.n}</b><span class="pill ${at}">${al}</span><code class="faint" title="${esc(a.session)}">${esc(short((a.session || "").split("/").pop(), 28))}</code><span class="faint" style="margin-left:auto">${clock(a.start)}</span></div>${a.error ? `<div class="find">${esc(a.error)}</div>` : ""}`; }).join("") : `<p class="small muted">还没有尝试。</p>`}
          </article>
          <article class="card"><div class="card-h"><h3>运行环境</h3></div>
            <div class="kvs"><label>Agent</label><span>${esc(agentName(t.agent))}</span><label>运行时</label><span>${esc(lastStart.runtime || memberRt(m))} ${lastStart.config?.model ? `· ${esc(lastStart.config.model)}${lastStart.config.effort ? ` (${esc(lastStart.config.effort)})` : ""}${lastStart.config.label || lastStart.config.mode ? ` · 权限 ${esc(lastStart.config.label || lastStart.config.mode)}` : ""} ` : ""}${lastStart.agentInfo ? `· ${esc(lastStart.agentInfo.name || "")} ${esc(lastStart.agentInfo.version || "")}` : ""}</span><label>协议</label><span>ACP</span><label>隔离方式</label><span>${esc(lastStart.enforcement || "—")}</span><label>会话</label><span class="mono">${esc(lastAt?.session || "—")}</span><label>工作区</label><span class="mono">${esc(ws)}</span><label>工作区策略</label><span>${WS_LABEL[m.ws] || "—"}</span></div>
          </article>
          <article class="card"><div class="card-h"><h3>产物</h3><span>${t.artifacts.length} 个</span></div>
            ${t.artifacts.length ? t.artifacts.map(a => `<div class="art"><span><b>${esc(a.name)}</b> <span class="faint small">尝试 ${a.attempt}</span> <button class="seq" data-act="seq" data-v="${a.seq}">#${a.seq}</button></span><span class="small muted">${esc(a.desc)}</span><span class="mono">${esc(a.path)} · sha256 ${esc(a.hash)}…</span><a class="link" href="/api/file?path=${encodeURIComponent(a.path)}" target="_blank">查看内容</a></div>`).join("") : `<p class="small muted">还没有产物。</p>`}
          </article>
          ${reviews.length ? `<article class="card"><div class="card-h"><h3>评审</h3></div>${reviews.map(e => `<div class="att"><span class="pill ${e.type === "review.approved" ? "green" : "red"}">${e.type === "review.approved" ? "通过" : "驳回"}</span><span>${esc(who(e.actor).name)} · ${e.task} 尝试 ${e.attempt}</span><button class="seq" data-act="seq" data-v="${e.seq}" style="margin-left:auto">#${e.seq}</button></div>`).join("")}</article>` : ""}
        </div></div>`;
    }

    // ---------- Session: watch the agent and step in ----------
    let SHOWN = null; // the state on screen, so session views can render requests still waiting
    const SESSION_TYPES = ["attempt.started", "session.prompt", "context.handoff", "board.posted", "agent.message", "user.message", "message.routed", "message.delivered", "tool.call", "tool.started", "tool.completed", "question.asked", "question.answered", "approval.requested", "approval.granted", "approval.denied", "input.requested", "input.answered", "control.taken", "control.released", "session.interrupted", "result.submitted", "attempt.failed"];
    function chatItem(e) {
      const d = e.data || {};
      switch (e.type) {
        case "attempt.started": return `<div class="chat-div">${e.task ? `${e.task} · ` : ""}尝试 ${e.attempt} · ${esc(d.runtime || "")}${d.config?.model ? ` · ${esc(d.config.model)}` : ""}${d.resumed ? " · 恢复了原会话" : ""}<details><summary>编排器发出的任务说明</summary><pre class="prompt">${esc(d.prompt)}</pre></details></div>`;
        case "run.created": return `<div class="chat-div">${d.mode === "goal" ? "目标" : "规划"} · ${esc(d.goal || "")}</div>`;
        case "plan.revision_requested": return `<div class="chat-div">按你的意见重新规划</div>`;
        case "plan.proposed": return `<div class="chat-note green">◇ 提出了 ${(d.tasks || []).length} 个任务的计划</div>`;
        case "agent.message": {
          // The structured result block is for the orchestrator; in the chat it collapses to a label.
          const m = (d.text || "").match(/^([\s\S]*?)\s*```json\s*[\s\S]*?```\s*$/);
          return `<div class="msg from-agent">${avatar(e.actor)}<div class="bubble">${esc(m ? m[1] : d.text)}${m ? `<span class="via">附结构化结果</span>` : ""}</div></div>`;
        }
        case "session.prompt": {
          const label = { system: "主控上下文", context: "团队上下文", goal: "目标提示", followup: "继续提示" }[d.channel] || "Janus 提示";
          return `<div class="chat-prompt"><div class="chat-prompt-h">→ ${label}<span class="via">Janus 发给 Agent</span></div><details><summary>查看内容</summary><pre>${esc(d.prompt || "")}</pre></details></div>`;
        }
        case "context.handoff": return `<div class="chat-note">⇄ 上游任务 ${esc(d.from || e.text)} 的结果已带入本次任务</div>`;
        case "board.posted": return `<div class="chat-note">${d.kind === "blocker" ? "⚠" : d.kind === "note" ? "·" : "↗"} 协作者写回看板：${esc(d.text || e.text)}</div>`;
        // A message with an id is drawn where it reached the agent: joined into the running turn
        // (an inline insert), sent as a turn of its own, or delivered after waiting. Until then it
        // sits in the pending tray above the composer.
        case "user.message":
          if (d.id) return "";
          return `<div class="msg from-user"><div class="bubble">${esc(d.text)}<span class="via">${{ steer: "已插入正在进行的这一轮", queued: "这一轮结束后发送", prompt: "作为新一轮发送", next: "下次会话时带给它" }[d.delivery] || ""}</span></div></div>`;
        case "message.routed": {
          const m = SHOWN?.msgs?.[d.id];
          if (!m) return "";
          if (d.delivery === "steer") return `<div class="msg from-user"><div class="bubble insert"><span class="insert-h">↪ ${m.by === "lead" ? "主控插话" : "插话"} · 已插入正在进行的这一轮</span>${esc(m.text)}</div></div>`;
          if (d.delivery === "prompt") return userBubble(m, "作为新的一轮发送");
          return "";
        }
        case "message.delivered": {
          const ms = (d.ids || []).map(id => SHOWN?.msgs?.[id]).filter(Boolean);
          if (!d.ids) return `<div class="chat-note ${toneOf(e.type)}">${ICON[e.type] || "·"} ${esc(e.text)}</div>`;
          return ms.map(m => userBubble(m, m.delivery === "next" ? "留言 · 在这次会话开始时带入" : "排队消息 · 上一轮结束后发送")).join("");
        }
        case "tool.started": return `<div class="chat-tool pending"><code>${esc(d.tool)}</code> ${esc(short(d.input || e.text, 120))}<span class="pill blue">等待返回</span></div>`;
        case "tool.completed": return `<div class="chat-tool"><code>${esc(d.tool)}</code> ${esc(short(d.input || e.text, 120))}<div>→ ${esc(short(d.output || "", 240))}${d.status === "failed" ? ` <span class="pill red">失败</span>` : ""}</div></div>`;
        case "tool.call": return `<div class="chat-tool"><code>${esc(d.tool)}</code> ${esc(short(d.input || e.text, 120))}${d.status === "failed" ? ` <span class="pill red">失败</span>` : ""}</div>`;
        case "result.submitted": return `<div class="chat-note"><b>结构化结果：${esc(d.summary || e.text)}</b>${d.evidence?.length ? `<div>证据：${esc(d.evidence.join("；"))}</div>` : ""}${d.risks?.length ? `<div>风险：${esc(d.risks.join("；"))}</div>` : ""}</div>`;
        case "agent.status": return `<div class="chat-note amber">◌ ${esc(e.text)}</div>`;
        // A request still waiting is answered right here, with the same card as the inbox.
        case "approval.requested": case "input.requested": {
          const item = SHOWN?.inbox.find(i => i.key === d.key);
          if (item) return (e.type === "input.requested" ? inputAsk : approvalAsk)(SHOWN, item, S.replay == null && S.live);
          return `<div class="chat-note ${toneOf(e.type)}">${ICON[e.type] || "·"} ${esc(who(e.actor).name)}：${esc(e.text)}</div>`;
        }
        default: return `<div class="chat-note ${toneOf(e.type)}">${ICON[e.type] || "·"} ${esc(who(e.actor).name)}：${esc(e.text)}</div>`;
      }
    }
    const userBubble = (m, via) => `<div class="msg from-user"><div class="bubble">${esc(m.text)}<span class="via">${m.by === "lead" ? "主控 · " : ""}${via}</span></div></div>`;
    // Messages sent to this session that have not reached the agent yet, newest last.
    function pendingTray(target) {
      const st = SHOWN;
      if (!st?.msgs) return "";
      const agentOf = target.task ? st.tasks[target.task]?.agent : target.agent;
      const list = Object.values(st.msgs).filter(m => !m.deliveredSeq && ["pending", "queued", "next"].includes(m.delivery)
        && (target.task ? ((m.task || m.routedTask) === target.task || (!m.task && !m.routedTask && m.to === agentOf)) : m.to === target.agent));
      if (!list.length) return "";
      const label = { pending: ["发送中…", "blue"], queued: ["排队 · 这一轮结束后发送", "amber"], next: ["留言 · 下次会话开始时带给它", "gray"] };
      return `<div class="msg-tray"><div class="msg-tray-h">待发送 ${list.length}</div>${list.map(m => {
        const [l, tone] = label[m.delivery];
        return `<div class="msg-tray-i"><span class="pill ${tone}">${m.delivery === "pending" ? `<i class="spin"></i>` : ""}${l}</span><span class="msg-tray-t">${esc(m.text)}</span></div>`;
      }).join("")}</div>`;
    }
    // One conversation view for every session: a task's attempt, or everything one agent has done in this run.
    // `target` is { task } or { agent }; `open` says whether a session is running right now.
    function chatCard({ title, evs, open, human, idle, target, offline }) {
      const live = S.live && S.replay == null;
      const key = "sess-" + (target.task || target.agent);
      const attr = target.task ? `data-task="${esc(target.task)}"` : `data-agent="${esc(target.agent)}"`;
      const b = (act, label, cls = "") => `<button class="btn sm ${cls}" data-act="${act}" ${attr}>${label}</button>`;
      let state, buttons = "", placeholder = "给 Agent 发消息，⌘/Ctrl + Enter 发送", enabled = true;
      if (open && live) {
        state = human ? (idle ? ["人工接管 · 等你的消息", "amber"] : ["人工接管 · 正在处理", "blue"]) : ["托管中 · 自主执行", "blue"];
        buttons = human
          ? (idle ? b("sessSend", "发送", "primary") + b("sessRelease", "交还托管") + b("sessFinish", "以当前结果完成") : b("sessSend", "发送", "primary") + b("sessInterrupt", "打断这一轮", "danger") + b("sessRelease", "交还托管"))
          : b("sessSend", "插话", "primary") + b("sessInterrupt", "打断并接管", "danger") + b("sessTakeover", "接管");
      } else if (offline?.resume) {
        state = ["已中断", "gray"]; placeholder = "补充信息或直接写「继续」，发送后从中断处恢复";
        buttons = b("sessSend", "发送并继续", "primary") + `<button class="btn sm" data-act="resumeRun">从中断处继续</button>`;
      } else if (offline?.leave && live) {
        state = ["当前没有会话", "gray"]; placeholder = "留言会在它下一次会话开始时带给它";
        buttons = b("sessSend", "留言", "primary");
      } else {
        state = ["会话已结束", "gray"]; enabled = false; placeholder = live ? "这个会话已经结束" : "只读查看";
      }
      return `<article class="card session"><div class="card-h"><h3>${esc(title)}</h3><span class="pill ${state[1]}">${state[0]}</span></div>
        <div class="chat" id="chat">${evs.map(chatItem).join("") || `<p class="small muted">开始执行后，这里会实时显示对话、工具调用和你的消息。</p>`}</div>
        ${pendingTray(target)}
        <div class="composer ${enabled ? "" : "off"}">
          <textarea id="sessInput" data-bind="sessDraft" data-key="${key}" ${attr} placeholder="${placeholder}" ${enabled ? "" : "disabled"}>${esc(S.drafts[key] || "")}</textarea>
          <div class="composer-f"><span class="btns">${buttons}</span></div>
        </div>
      </article>`;
    }
    function sessionCard(st, t) {
      const evs = st.events.filter(e => e.task === t.id && (SESSION_TYPES.includes(e.type) || (e.type === "agent.status" && e.data?.turn === "idle")));
      return chatCard({ title: "会话", evs, open: t.live, human: t.control === "human", idle: t.turn === "idle", target: { task: t.id }, offline: { resume: ["interrupted", "failed"].includes(st.run.status), leave: false } });
    }
    // Everything one agent did in this run, and where a message to it goes right now.
    function agentSession(st, id) {
      const mine = e => e.actor === id || e.to === id;
      const evs = st.events.filter(e => (mine(e) && (SESSION_TYPES.includes(e.type) || (e.type === "agent.status" && e.data?.turn === "idle")))
        || (id === "lead" && ["run.created", "plan.revision_requested", "plan.proposed"].includes(e.type)));
      const tasks = st.order.map(x => st.tasks[x]).filter(t => t.agent === id && t.live);
      const open = tasks.length > 0 || (id === "lead" && ["planning", "running"].includes(st.run.status));
      let human = false, idle = false;
      for (const e of evs) {
        if (["control.taken"].includes(e.type) || (e.type === "session.interrupted" && !e.data?.finish)) human = true;
        if (["control.released", "attempt.started", "plan.proposed", "run.created", "plan.revision_requested"].includes(e.type)) human = false;
        if (e.type === "agent.status" && e.data?.turn === "idle") idle = true;
        if (((e.type === "user.message" || e.type === "message.routed") && e.data?.delivery === "prompt") || ["control.released", "message.delivered", "attempt.started"].includes(e.type)) idle = false;
      }
      const active = !["delivered", "accepted", "accepted_with_risk", "cancelled"].includes(st.run.status);
      return { evs, open, human, idle, offline: { resume: ["interrupted", "failed"].includes(st.run.status), leave: active } };
    }
    function agentPage(st) {
      const id = S.agentId, m = who(id), sess = agentSession(st, id);
      const tasks = st.order.map(x => st.tasks[x]).filter(t => t.agent === id);
      return `<div class="crumbs"><button class="link" data-act="nav" data-v="board">← 工作台</button></div>
        <div class="task-hero"><div style="display:flex;gap:12px;align-items:center">${avatar(id, "lg")}<div><h1>${esc(m.name)}</h1><p>${esc(m.role || "")}${m.runtime ? ` · ${esc(memberRt(m))}` : ""}${m.model ? ` · ${esc(m.model)}` : ""}</p></div></div></div>
        <div class="detail"><div>${chatCard({ title: "对话", ...sess, target: { agent: id } })}</div>
          <div><article class="card"><div class="card-h"><h3>负责的任务</h3><span>${tasks.length} 个</span></div>
            ${tasks.map(t => { const [l, tone] = TASK_STATUS[t.status]; return `<div class="att"><button class="link" data-act="task" data-v="${t.id}">${t.id} ${esc(t.title)}</button><span class="pill ${tone}" style="margin-left:auto">${l}</span></div>`; }).join("") || `<p class="small muted">${id === "lead" ? "主控负责规划和协调。" : "还没有分配任务。"}</p>`}
          </article></div></div>`;
    }
    function sessCmd(type, ds) {
      const body = { type, task: ds.task || "", agent: ds.agent || "" };
      if (type === "message") {
        const el = $("#sessInput"), text = (el?.value || "").trim();
        if (!text) { toast("先写点什么。"); el?.focus(); return; }
        body.text = text; S.drafts[el.dataset.key] = ""; el.value = "";
      }
      act(body);
    }

    // ---------- Audit ----------
    function invariants(events) {
      const active = {}, numbers = {};
      let overlap = 0, gaps = 0, noEvidence = 0, unsubmitted = 0, badQuestion = 0, badReview = 0, badActor = 0;
      const submitted = new Set();
      for (const e of events) {
        if (e.type === "attempt.started") { if (active[e.task]) overlap++; active[e.task] = e.attempt; (numbers[e.task] ||= []).push(e.attempt); }
        if (["attempt.failed", "task.succeeded", "review.rejected"].includes(e.type)) active[e.task] = null;
        if (e.type === "result.submitted") submitted.add(e.task + "#" + e.attempt);
        if (e.type === "task.succeeded") { if (!e.data?.summary || !e.data?.evidence?.length) noEvidence++; if (!submitted.has(e.task + "#" + e.attempt)) unsubmitted++; }
        if (e.type === "question.asked" && !(e.data?.question && e.data?.options?.length)) badQuestion++;
        if (/^review\./.test(e.type) && !(e.data?.refs?.length || e.data?.findings?.every(f => f.ref))) badReview++;
        if (/^(task\.(ready|assigned|succeeded|reopened|retry_scheduled)|attempt\.)/.test(e.type) && e.actor !== "janus") badActor++;
      }
      Object.values(numbers).forEach(ns => ns.forEach((n, i) => { if (n !== i + 1) gaps++; }));
      const attempts = Object.values(numbers).flat().length;
      return [
        ["每个任务同一时间最多一个进行中的尝试", !overlap, `${attempts} 次尝试`],
        ["重试会新建尝试，旧记录保留", !gaps, `${Object.keys(numbers).length} 个任务`],
        ["任务状态只由编排器（Janus）改变", !badActor, "Agent 只提交进度与结果"],
        ["标记完成前已提交结构化结果和证据", !noEvidence && !unsubmitted, `${events.filter(e => e.type === "task.succeeded").length} 次完成`],
        ["等待输入时附带可回答的问题", !badQuestion, `${events.filter(e => e.type === "question.asked").length} 个问题`],
        ["评审结论引用了具体产物或证据", !badReview, `${events.filter(e => /^review\./.test(e.type)).length} 次评审`]
      ];
    }
    function auditPage(full) {
      const f = S.audit;
      const events = full.events;
      const rows = events.filter(e => (f.cat === "all" || categoryOf(e.type) === f.cat) && (!f.task || e.task === f.task || e.data?.target === f.task) && (!f.actor || e.actor === f.actor || e.to === f.actor));
      const actors = [...new Set(events.flatMap(e => [e.actor, e.to]).filter(Boolean))];
      const inv = invariants(events);
      return `<div class="page-h"><div><h1>审计与回放</h1><p>工作台上的每个状态都由下面的事件推导出来。Agent 只能提交进度、问题和结果；任务状态只由编排器改变。选中任意一条事件，可以回放到当时的状态。</p></div>
          <div class="run-ctl"><button class="btn sm" data-act="export" ${events.length ? "" : "disabled"}>下载 JSONL</button></div></div>
        <article class="card inv"><div class="panel-h"><h3>系统不变量检查</h3><span>基于当前 ${events.length} 条事件实时计算</span></div>
          <ul>${inv.map(([l, ok, n]) => `<li class="${ok ? "" : "bad"}"><i>${ok ? "✓" : "✕"}</i>${l}<span>${n}</span></li>`).join("")}</ul></article>
        <div class="toolbar">
          <div class="filters" style="margin:0">${Object.keys(CATEGORY_LABEL).map(k => `<button class="${f.cat === k ? "on" : ""}" data-act="auditCat" data-v="${k}">${CATEGORY_LABEL[k]}</button>`).join("")}</div>
          <select data-bind="auditTask" aria-label="按任务筛选"><option value="">全部任务</option>${full.order.map(id => `<option value="${id}" ${f.task === id ? "selected" : ""}>${id} ${esc(short(full.tasks[id].title, 14))}</option>`).join("")}</select>
          <select data-bind="auditActor" aria-label="按参与者筛选"><option value="">全部参与者</option>${actors.map(a => `<option value="${a}" ${f.actor === a ? "selected" : ""}>${esc(who(a).name)}</option>`).join("")}</select>
          <span class="small muted">${rows.length} 条</span>
        </div>
        <div class="card log">
          <div class="log-r head"><span>#</span><span>时间</span><span>类型</span><span>参与者</span><span>任务</span><span>内容</span><span></span></div>
          ${rows.map(e => `<div class="log-r ${S.hl === e.seq ? "hl" : ""}" id="row-${e.seq}" data-act="row" data-v="${e.seq}">
            <span class="mono">${e.seq}</span><span class="mono">${clock(e.ts)}</span><span class="mono">${e.type}</span>
            <span class="who">${avatar(e.actor)}${esc(who(e.actor).name)}${e.to ? ` → ${esc(who(e.to).name)}` : ""}</span>
            <span class="mono">${e.task || "—"}${e.attempt ? ` #${e.attempt}` : ""}</span><span>${esc(e.text)}</span>
            <button class="btn sm" data-act="replayAt" data-v="${e.seq}">回放</button></div>
            ${S.openRow === e.seq ? `<div class="log-json"><pre class="json">${esc(JSON.stringify(e, null, 2))}</pre></div>` : ""}`).join("") || `<p class="small muted" style="padding:14px">没有匹配的事件。</p>`}
        </div>`;
    }

    // ---------- Team ----------
    function teamPage(full) {
      const cards = team().map(m => {
        const a = full.agents[m.id];
        const [pl, pt] = AGENT_PHASE[a?.phase || "idle"];
        return `<article class="card member"><div class="member-h">${avatar(m.id, "lg")}<div class="grow"><b>${esc(m.name)}${m.lead ? " · 主控" : ""}</b><span>${esc(m.role)} · ${esc(memberRt(m))} · ACP</span></div><span class="pill ${pt}">${pl}</span></div>
          <p>${esc(m.desc)}</p>
          <div class="kvs"><label>限制</label><span>${m.limits.map(esc).join("；")}</span><label>工作区策略</label><span>${WS_LABEL[m.ws]}</span><label>权限</label><span>${esc(m.limits?.[1] || "—")}</span><label>最大并发</label><span>1</span><label>Agent</label><span class="mono">${esc(memberRt(m))} · ${esc(m.model || "默认模型")}${m.effort ? ` · ${esc(m.effort)}` : ""}</span></div></article>`;
      }).join("");
      return `<div class="page-h"><div><h1>团队与权限</h1><p>Agent 定义描述它能做什么；团队成员身份决定它在这个目录里以什么角色、什么权限工作。下面是这个 Run 创建时的团队快照。</p></div><div class="run-ctl"><button class="btn sm" data-act="editEnv">工作区设置</button></div></div>
        <div class="team-grid">${cards}</div>`;
    }

    function modal() {
      if (S.modal !== "goal") return "";
      const st = derive(S.events);
      const running = S.live && st.run.goal && !["delivered", "accepted", "accepted_with_risk", "cancelled", "failed", "interrupted"].includes(st.run.status);
      return `<div class="modal-bg" data-act="closeModalBg"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="goalTitle">
        <h2 id="goalTitle">新目标</h2><p>主控会先给你一份计划，确认后才开始执行。</p>
        <div class="field" style="margin-top:14px"><label for="goalWs">执行环境</label><select id="goalWs">${S.setup.workspaces.map(w => `<option value="${w.id}" ${w.id === (S.wsId || S.runConfig?.workspace?.id) ? "selected" : ""}>${esc(w.name)} · ${esc(w.path)}</option>`).join("")}</select></div>
        <div class="field" style="margin-top:14px"><textarea id="goalInput" style="min-height:96px" placeholder="例如：给 divide 增加除零保护，并补充测试"></textarea></div>
        <div class="suggest">${SUGGESTIONS.map(([l], i) => `<button data-act="modalSuggest" data-v="${i}">${l}</button>`).join("")}</div>
        ${running ? `<div class="note" style="margin-top:12px">当前 Run 会继续在后台运行，可以在顶部切换查看。</div>` : ""}
        <div class="row-end" style="margin-top:16px"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn primary" data-act="startGoal">交给主控 →</button></div>
      </div></div>`;
    }

    // ============================================================
    // Actions
    // ============================================================
    function download() {
      if (S.runId) window.location.href = `/api/runs/${S.runId}/export`;
    }
    function goAudit(seq) {
      S.page = "audit"; S.replay = null; S.hl = seq; S.openRow = seq; S.audit = { cat: "all", task: "", actor: "" };
      render(); setTimeout(() => document.getElementById("row-" + seq)?.scrollIntoView({ block: "center", behavior: "smooth" }), 30);
    }
    const ACT = {

      nav: v => { S.page = v; if (v !== "board") S.replay = null; render(); window.scrollTo(0, 0); },
      task: v => { S.page = "task"; S.taskId = v; render(); window.scrollTo(0, 0); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; },
      closeModal: () => { S.modal = null; render(); },
      closeModalBg: (v, el, e) => { if (e.target === el) ACT.closeModal(); },
      modalSuggest: v => { const el = $("#goalInput"); el.value = SUGGESTIONS[v][1]; el.focus(); },
      startGoal: () => { const goal = $("#goalInput").value.trim(); if (!goal) { toast("先描述你想要的结果。"); return; } const ws = $("#goalWs")?.value; if (!ws) { toast("先在设置里创建一个执行环境。"); return; } createRun(goal, ws); },
      editEnv: () => openWsEdit(wsOf(S.runConfig?.workspace?.id) || curWs()),

      cancelRun: () => { if (confirm("取消后会结束所有进行中的 Agent 会话。继续吗？")) act({ type: "cancel" }); },
      pick: (v, el) => { S.drafts[el.dataset.key] = v; el.parentElement.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o === el)); },
      answer: (v, el) => {
        const key = el.dataset.key, task = el.dataset.task, answer = S.drafts[key];
        if (!answer) { toast("先选择一个选项。"); return; }
        const note = document.querySelector(`[data-note="${key}"]`)?.value.trim() || "";
        act({ type: "answer", key, task, answer, note });
      },
      approve: (v, el) => act({ type: "approve", key: el.dataset.key, task: el.dataset.task, agent: el.dataset.agent, allow: v === "1", option: el.dataset.option || null, label: el.dataset.label || "" }),
      formPick: (v, el) => {
        const d = S.drafts[el.dataset.key] ||= {}, k = el.dataset.k;
        if (el.dataset.multi) { const set = new Set(d[k] || []); set.has(v) ? set.delete(v) : set.add(v); d[k] = [...set]; } else d[k] = d[k] === v ? undefined : v;
        render();
      },
      formBool: (v, el) => { const d = S.drafts[el.dataset.key] ||= {}; d[el.dataset.k] = !d[el.dataset.k]; render(); },
      inputSend: (v, el) => {
        const key = el.dataset.key, item = derive(S.events).inbox.find(i => i.key === key);
        const content = Object.fromEntries(Object.entries(S.drafts[key] || {}).filter(([, x]) => x !== undefined && x !== "" && !(Array.isArray(x) && !x.length)));
        const missing = v === "accept" ? (item?.schema?.required || []).filter(k => content[k] === undefined) : [];
        if (missing.length) { toast(`还有必填项：${missing.map(k => item.schema.properties?.[k]?.title || k).join("、")}`); return; }
        act({ type: "input", key, task: el.dataset.task, agent: el.dataset.agent, action: v, content });
      },
      pause: () => act({ type: "pause" }),
      resume: () => act({ type: "resume" }),
      extendBudget: () => act({ type: "extendBudget", minutes: 60 }),
      diag: () => act({ type: "accept" }),
      copy: () => {
        const r = derive(S.events).result; if (!r) return;
        const text = [r.headline, r.summary, "", "证据：", ...r.evidence.map(e => `- ${e.text}（事件 #${e.seq}）`), "", "风险：", ...(r.risks.length ? r.risks.map(x => "- " + x) : ["- 无"])].join("\n");
        navigator.clipboard?.writeText(text).then(() => toast("已复制交付摘要。"), () => toast("浏览器不允许访问剪贴板。"));
      },
      export: download,
      medium: v => { S.medium = v; render(); },
      boardView: v => { S.boardView = v; S.boardSel = null; render(); },
      boardMore: v => { S.boardMore[v] = !S.boardMore[v]; render(); },
      fact: (v, el, e) => {
        if (e.target.closest("a, button:not([data-act=fact]), .fact-x")) return;
        S.boardSel = S.boardSel?.key === v ? null : { key: v, tasks: (el.dataset.tasks || "").split(",").filter(Boolean), agents: (el.dataset.agents || "").split(",").filter(Boolean) };
        render();
      },
      seq: v => goAudit(Number(v)),
      auditTask: v => { S.page = "audit"; S.audit = { cat: "all", task: v, actor: "" }; S.hl = null; render(); window.scrollTo(0, 0); },
      auditCat: v => { S.audit.cat = v; render(); },
      row: (v, el, e) => { if (e.target.closest("button")) return; const n = Number(v); S.openRow = S.openRow === n ? null : n; S.hl = n; render(); },
      replayAt: v => { S.replay = Number(v); S.page = "board"; render(); window.scrollTo(0, 0); },
      replayStep: v => { S.replay = Math.min(S.events.length, Math.max(1, S.replay + Number(v))); render(); },
      live: () => { S.replay = null; render(); },
      sessSend: (v, el) => sessCmd("message", el.dataset),
      sessInterrupt: (v, el) => sessCmd("interrupt", el.dataset),
      sessTakeover: (v, el) => sessCmd("takeover", el.dataset),
      sessRelease: (v, el) => sessCmd("release", el.dataset),
      sessFinish: (v, el) => { if (confirm("用当前产出完成这个任务？写任务里已有的改动会照常记录成 diff。")) sessCmd("finish", el.dataset); },
      agentChat: (v, el, e) => { if (e.target.closest("button:not([data-act=agentChat])")) return; S.page = "agent"; S.agentId = v; render(); window.scrollTo(0, 0); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; },
      resumeRun: () => act({ type: "resumeRun" }),
    };
    Object.assign(ACT, SETUP_ACT);
    const BIND = {
      sessDraft: (v, el) => { S.drafts[el.dataset.key] = v; },
      formField: (v, el) => { (S.drafts[el.dataset.key] ||= {})[el.dataset.k] = el.dataset.num ? (v === "" ? undefined : Number(v)) : v; },
      replay: v => { S.replay = Number(v); render(); },
      auditTask: v => { S.audit.task = v; render(); },
      auditActor: v => { S.audit.actor = v; render(); },
      boardAgent: v => { S.boardAgent = v; S.boardSel = null; render(); },
      boardTask: v => { S.boardTask = v; S.boardSel = null; render(); }
    };
    Object.assign(BIND, SETUP_BIND);
    document.addEventListener("click", e => {
      if (S.menu && !e.target.closest(".menu-wrap")) { S.menu = null; renderScreen(); }
      const el = e.target.closest("[data-act]");
      if (!el || el.disabled) return;
      ACT[el.dataset.act]?.(el.dataset.v, el, e);
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && S.modal) ACT.closeModal();
      if (e.key === "Escape" && S.screen !== "app" && (S.roleDraft || S.connDraft || S.picker)) { S.roleDraft = S.connDraft = S.picker = null; renderScreen(); }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "goalText") { e.preventDefault(); ACT.startTask(); }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.id === "sessInput" && !e.target.disabled) { e.preventDefault(); sessCmd("message", e.target.dataset); }
      if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    });
    document.addEventListener("input", e => { const k = e.target.dataset?.bind; if (k) BIND[k]?.(e.target.value, e.target); });

    (async function boot() {
      await Promise.all([loadRuns(), loadMeta()]);
      await loadSetup(); watchChecks();
      const params = new URLSearchParams(location.search);
      if (params.get("settings")) { go("settings", { tab: params.get("settings") }); if (params.get("new")) SETUP_ACT.connType(params.get("new")); if (params.get("role")) SETUP_ACT.roleOpen(params.get("role")); return; }
      if (params.get("ws") === "new") { openWsEdit(null); return; }
      if (params.get("ws")) { rememberWs(params.get("ws")); if (params.get("edit")) openWsEdit(wsOf(params.get("ws"))); else go("home"); return; }
      const wanted = params.get("run");
      const live = S.runs.find(r => ["planning", "awaiting_plan", "running"].includes(r.status));
      if (wanted || live) { openRun(wanted || live.id).then(() => { if (params.get("task")) ACT.task(params.get("task")); if (params.get("agent")) { S.page = "agent"; S.agentId = params.get("agent"); render(); } }).catch(err => { toast("打不开这个任务：" + err.message); go("home"); }); return; }
      // First run: go to whatever is still missing; afterwards, straight to the workspace.
      const step = nextStep();
      if (step && !S.setup.workspaces.length) step[2](); else go("home");
    })();
  </script>
</body>
</html>
