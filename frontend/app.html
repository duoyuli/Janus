    // One row anatomy for both lists: icon · name and one line · relation · state · action.
    const dot = (tone, text) => `<span class="state"><i class="dot ${tone}"></i>${esc(text)}</span>`;
    const avStack = roles => roles.length ? `<span class="stack">${roles.slice(0, 4).map(r => roleAv(r, "sm")).join("")}${roles.length > 4 ? `<span class="more">+${roles.length - 4}</span>` : ""}</span>` : "";

    function agentsSection() {
      const rows = S.setup.connections.map(c => {
        const k = kindOf(c.kind);
        const [label, tone] = connStatus(c);
        const model = c.options?.model;
        const auth = k?.auths?.find(a => a.id === c.auth)?.label;
        const roles = S.setup.roles.filter(r => r.connection === c.id);
        const login = loginAuth(c), loggingIn = !!login && c.login?.state === "running";
        const perms = ctrlsOf(c).filter(x => x.permission);
        const sub = [k?.name, auth, model ? `${model.options.length} 个模型` : null, c.options && !c.options.controls ? "未读取权限模式" : perms.length ? perms.map(x => x.type === "boolean" ? x.name : x.options.map(o => o.name).join(" / ")).join("；") : c.options ? "无权限模式" : null].filter(Boolean).join("，");
        const menu = S.menu === c.id ? `<div class="menu" role="menu">
            ${login ? `<button data-act="connLogin" data-v="${c.id}">${c.loggedIn ? "重新登录" : "登录"} ${esc(login.label)}</button>` : ""}
            <button data-act="connTest" data-v="${c.id}">检查配置</button><button data-act="connEdit" data-v="${c.id}">编辑</button>
            <button data-act="roleNew" data-v="${c.id}">在这个 Agent 上新建角色</button>
            <button class="danger" data-act="connDelete" data-v="${c.id}">删除</button></div>` : "";
        let extra = "";
        if (loggingIn) extra = `<div class="srow-x">按提示完成 ${esc(login.label)} 登录，完成后会自动测试。${c.loginLog ? `<pre class="log-tail">${esc(c.loginLog.replace(/\x1b\[[0-9;]*m/g, "")).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}</pre>` : ""}</div>`;
        else if (login && !c.loggedIn) extra = `<div class="srow-x warn">还没有登录 ${esc(login.label)}。<button class="link" data-act="connLogin" data-v="${c.id}">登录</button></div>`;
        else if (c.status === "testing") extra = `<div class="srow-x">${checkList(c)}</div>`;
        else if (c.status === "error") extra = `<div class="srow-x bad">${esc(c.error)} <button class="link" data-act="connTest" data-v="${c.id}">重新检查</button><button class="link" data-act="connEdit" data-v="${c.id}">修改配置</button></div>`;
        else if (c.status === "untested") extra = `<div class="srow-x">还没有检查配置，读到模型后才能给角色使用。<button class="link" data-act="connTest" data-v="${c.id}">检查</button></div>`;
        return `<div class="srow">
          <button class="srow-main" data-act="connEdit" data-v="${c.id}">${typeIcon(k)}<span class="srow-t"><b>${esc(c.name)}<code class="id-tag" title="配置目录 ${esc(c.home?.replace(/\/home$/, "") || "")}">${esc(c.id)}</code></b><span>${esc(sub)}</span></span></button>
          <span class="srow-rel">${roles.length ? `${avStack(roles)}<span class="rel-t">${roles.length} 个角色</span>` : `<button class="link" data-act="roleNew" data-v="${c.id}">新建角色</button>`}</span>
          <span class="srow-state">${dot(tone, label)}</span>
          <span class="menu-wrap"><button class="icon-btn" data-act="toggleMenu" data-v="${c.id}" aria-label="${esc(c.name)} 的更多操作">⋯</button>${menu}</span>
          ${extra}
        </div>`;
      }).join("");
      const quick = ["codex", "claude", "pi", "grok"].map(id => kindOf(id)).filter(Boolean).map(k => `<button class="quick" data-act="connNewType" data-v="${k.id}">${typeIcon(k)}<span><b>${esc(k.name)}</b><small>复制本机配置</small></span></button>`).join("");
      return `<header class="set-h"><div><h1>Agents</h1><p>每个 Agent 在独立的进程和配置目录里运行，不影响你本机的 Agent。</p></div><button class="btn primary" data-act="connNew">添加 Agent</button></header>
        ${rows ? `<div class="slist"><div class="slist-h"><span>Agent</span><span>挂载的角色</span><span>状态</span><span></span></div>${rows}</div>`
          : `<div class="slist empty"><h3>还没有接入 Agent</h3><p>把你本机已经在用的 Agent 迁移过来，配置和凭据会一并复制。</p><div class="quick-row">${quick}</div><button class="link" data-act="connNew">查看全部类型，包括 API Key、预设和自定义命令</button></div>`}`;
    }

    // ACP adapters: installed on demand into Janus home, one directory per version, `current`
    // switched atomically. Installs and update checks run in the background; poll until they end.
    let adapterPoll;
    async function loadAdapters() {
      try { S.adapters = await api("/api/adapters"); } catch (err) { S.adapters = { adapters: [], dir: "" }; toast("读取适配器失败：" + err.message); return; }
      const busy = S.adapters.adapters.some(a => a.job?.state === "running");
      if (busy && !adapterPoll) adapterPoll = setInterval(loadAdapters, 1500);
      if (!busy && adapterPoll) { clearInterval(adapterPoll); adapterPoll = null; S.adapters.adapters.filter(a => a.job?.ended > Date.now() - 2500).forEach(a => toast(`${a.name}：${a.job.detail}`)); }
      if (S.screen === "settings") renderScreen();
    }
    async function adapterAct(id, action, version) {
      try { S.adapters = await api(`/api/adapters/${id}/${action}`, version ? { version } : {}); } catch (err) { toast(err.message); return; }
      loadAdapters();
    }
    function adaptersSection() {
      const data = S.adapters;
      const head = `<header class="set-h"><div><h1>ACP 适配器</h1><p>Agent 通过 ACP 适配器接入 Janus。第一次检查用到它的 Agent 时自动安装；之后可以在这里检查更新、升级，或切回上一个版本。正在运行的会话不受影响。</p></div>${data?.dir ? `<span class="chip mono" title="适配器安装目录">${esc(data.dir.replace(/^\/Users\/[^/]+/, "~"))}</span>` : ""}</header>`;
      if (!data) return head + `<div class="card quiet">读取中…</div>`;
      const rows = data.adapters.map(a => {
        const job = a.job, running = job?.state === "running";
        const dis = running ? "disabled" : "";
        const src = a.source.kind === "npm" ? `npm · ${a.source.package}` : `GitHub · ${a.source.repo.replace("https://github.com/", "")}`;
        const pill = running ? `<span class="pill blue">${job.action === "install" ? "安装中" : "检查中"}</span>`
          : !a.current ? `<span class="pill gray">未安装</span>`
          : a.updateAvailable ? `<span class="pill amber">有新版本</span>` : `<span class="pill green">已安装</span>`;
        const checked = a.latest ? `最新 <span class="mono">${esc(a.latest)}</span>${a.checkedAt ? ` · ${clock(a.checkedAt)} 检查` : ""}` : "还没有检查更新";
        const prev = a.versions.filter(v => !v.current);
        const rollback = prev.length ? `<div class="ad-meta">上一个版本 <span class="mono">${esc(prev[0].version)}</span> · <button class="link" data-act="adapterUse" data-v="${a.id}" data-version="${esc(prev[0].version)}" ${dis}>切回</button></div>` : "";
        const actions = !a.current
          ? `<button class="btn sm primary" data-act="adapterInstall" data-v="${a.id}" ${dis}>安装</button>`
          : `${a.updateAvailable ? `<button class="btn sm primary" data-act="adapterInstall" data-v="${a.id}" ${dis}>升级到 ${esc(a.latest)}</button>` : ""}<button class="btn sm" data-act="adapterCheck" data-v="${a.id}" ${dis}>检查更新</button>`;
        let extra = "";
        if (running) extra = `<div class="ad-x">${job.action === "install" ? "正在下载和构建，完成后自动设为当前版本…" : "正在查询最新版本…"}${a.log ? `<pre class="log-tail">${esc(a.log)}</pre>` : ""}</div>`;
        else if (job?.state === "error") extra = `<div class="ad-x bad">${esc(job.detail)}${a.log ? `<pre class="log-tail">${esc(a.log)}</pre>` : ""}</div>`;
        return `<div class="ad-row">
          <div class="ad-name">${typeIcon(kindOf(a.id))}<div><b>${esc(a.name)}</b><div class="ad-meta">${esc(src)}</div></div></div>
          <div class="ad-ver">
            <div class="ad-cur">${a.current ? `<span class="mono">${esc(a.current)}</span>` : `<span class="faint">—</span>`}${pill}</div>
            <div class="ad-meta">${checked}</div>
            ${rollback}
          </div>
          <div class="ad-act">${actions}</div>
          ${extra}
        </div>`;
      }).join("");
      return head + `<div class="card ad-list">${rows}</div>`;
    }

    function rolesSection() {
      const rows = S.setup.roles.map(r => {
        const c = connOf(r.connection), k = c && kindOf(c.kind);
        const facts = [c?.options?.controls && (permWrites(r.session, c) ? "可写" : "只读"), permLabel(r.session, c), r.prompt && "提示词", r.skills?.length && `${r.skills.length} Skill`, r.mcp?.length && `${r.mcp.length} MCP`].filter(Boolean);
        return `<div class="srow">
          <button class="srow-main" data-act="roleOpen" data-v="${r.id}">${roleAv(r)}<span class="srow-t"><b>${esc(r.name)}${r.lead ? `<span class="lead-mark">主控</span>` : ""}</b><span>${esc(r.desc || r.role || "还没有填写职责")}</span></span></button>
          <span class="srow-rel">${c ? `${typeIcon(k, "sm")}<span class="rel-t"><b>${esc(c.name)}</b>${esc(r.model || c.options?.model?.current || "默认模型")}${r.effort ? `，${esc(r.effort)}` : ""}</span>` : `<button class="link warn-t" data-act="roleOpen" data-v="${r.id}">选择 Agent</button>`}</span>
          <span class="srow-state facts">${facts.map(f => `<span class="fact">${esc(f)}</span>`).join("") || `<span class="faint small">只读</span>`}</span>
          <button class="icon-btn" data-act="roleOpen" data-v="${r.id}" aria-label="编辑 ${esc(r.name)}">›</button>
        </div>`;
      }).join("");
      return `<header class="set-h"><div><h1>角色</h1><p>决定谁用什么模型、带什么指令和工具做事。</p></div><button class="btn primary" data-act="roleNew">新建角色</button></header>
        ${okConns().length ? "" : `<div class="note warn" style="margin-bottom:12px">还没有可用的 Agent。可以先编辑角色，但要在 Agents 里测试通过后才能运行。</div>`}
        ${rows ? `<div class="slist"><div class="slist-h"><span>角色</span><span>Agent 与模型</span><span>挂载与权限</span><span></span></div>${rows}</div>` : `<div class="slist empty"><h3>还没有角色</h3><p>角色决定谁做什么。先建一个主控，再建几个负责具体工作的成员。</p><button class="btn primary" data-act="roleNew">新建角色</button></div>`}`;
    }

    // ---------- Session controls: whatever the agent itself declares (read when it is checked) ----------
    const ctrlsOf = c => c?.options?.controls || [];
    // Only agents with /goal can lead (same rule as the orchestrator).
    const leadCapable = c => ["claude", "codex"].includes(c?.base);
    const ctrlValue = (session, c) => session?.[c.id] === undefined ? c.current : session[c.id];
    const PERM_ICON = {
      eye: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>`,
      shield: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l5.5 2v4c0 3.3-2.3 5.9-5.5 7-3.2-1.1-5.5-3.7-5.5-7v-4z"/><path d="M5.6 8l1.7 1.7 3.1-3.2"/></svg>`,
      risky: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l5.5 2v4c0 3.3-2.3 5.9-5.5 7-3.2-1.1-5.5-3.7-5.5-7v-4z"/><path d="M8 5v3.6M8 10.6v.4"/></svg>`,
      edit: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/></svg>`,
      plan: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M10.4 5.6L9 9 5.6 10.4 7 7z"/></svg>`
    };
    // Only for the icon: whether an option widens what the agent may do unasked is the agent's call.
    const permKind = o => { const v = `${o.value} ${o.name}`; return /read[-_ ]?only/i.test(v) ? "eye" : /full|bypass|always|yolo|danger|dontask/i.test(v) ? "risky" : /plan/i.test(v) ? "plan" : /edit/i.test(v) ? "edit" : "shield"; };
    // Same rule as the orchestrator: a read-only preset or Plan switched on only reads; agents
    // without permission modes edit freely.
    function permWrites(session, conn) {
      return !ctrlsOf(conn).filter(c => c.permission).some(c => {
        const v = ctrlValue(session, c), n = String(v).toLowerCase().replace(/[-_ ]/g, "");
        return (/plan/i.test(c.id) && (v === true || v === "on")) || n === "readonly" || n === "plan";
      });
    }
    // "Agent · Plan 关闭": a role's permission choices in the agent's own words.
    function permLabel(session, conn) {
      return ctrlsOf(conn).filter(c => c.permission).map(c => {
        const v = ctrlValue(session, c);
        return typeof v === "boolean" ? `${c.name} ${v ? "开启" : "关闭"}` : (c.options.find(o => o.value === v)?.name || v || "");
      }).filter(Boolean).join(" · ");
    }
    function permSection(r, c) {
      if (!c) return `<div class="note" style="margin-top:-8px">先选择 Agent。权限选项由 Agent 自己声明，每种 Agent 都不一样。</div>`;
      if (c.status === "testing") return `<div class="note" style="margin-top:-8px">正在检查 ${esc(c.name)}，读取它的权限模式…</div>`;
      if (!c.options?.controls) return `<div class="note warn" style="margin-top:-8px">还没有读取 ${esc(c.name)} 的权限模式。<button class="link" data-act="connTest" data-v="${c.id}">检查 Agent</button></div>`;
      const perms = ctrlsOf(c).filter(x => x.permission);
      if (!perms.length) return `<div class="note" style="margin-top:-8px">${esc(c.name)} 没有声明权限模式：工具调用直接执行，不会发起审批，可以修改工作目录中的文件。</div>`;
      return perms.map(x => {
        const v = ctrlValue(r.session, x);
        if (x.type === "boolean") return `<div class="tg-group pmode"><label class="tg"><span><b>${esc(x.name)}</b><small>${esc(x.desc || "")}</small></span><button class="switch" role="switch" aria-checked="${!!v}" data-act="roleCtrl" data-id="${esc(x.id)}" data-bool="1" aria-label="${esc(x.name)}"><i></i></button></label></div>`;
        return `<div class="pmode" role="radiogroup" aria-label="${esc(x.name)}">
          <div class="pmode-h"><b>${esc(x.name)}</b>${x.desc ? `<small>${esc(x.desc)}</small>` : ""}</div>
          ${x.options.map(o => { const k = permKind(o), on = o.value === v; return `<button class="pmode-opt ${k === "risky" ? "risky" : ""}" role="radio" aria-checked="${on}" data-act="roleCtrl" data-id="${esc(x.id)}" data-v="${esc(o.value)}">${PERM_ICON[k]}<span class="grow"><b>${esc(o.name || o.value)}</b>${o.value === x.current ? `<em>Agent 默认</em>` : ""}${o.desc ? `<small>${esc(o.desc)}</small>` : ""}</span><span class="tick">${on ? "✓" : ""}</span></button>`; }).join("")}
        </div>`;
      }).join("");
    }
    function otherCtrls(r, c) {
      const rest = ctrlsOf(c).filter(x => !x.permission);
      if (!rest.length) return "";
      return `<section class="rsec"><h3>会话选项</h3><span class="faint small">${esc(c.name)} 提供</span></section>
        <div class="tg-group">${rest.map(x => { const v = ctrlValue(r.session, x); return `<label class="tg"><span><b>${esc(x.name)}</b><small>${esc(x.desc || "")}</small></span>${x.type === "boolean"
          ? `<button class="switch" role="switch" aria-checked="${!!v}" data-act="roleCtrl" data-id="${esc(x.id)}" data-bool="1" aria-label="${esc(x.name)}"><i></i></button>`
          : `<select class="ctl-sel" data-bind="roleCtrlSel" data-id="${esc(x.id)}" aria-label="${esc(x.name)}">${x.options.map(o => `<option value="${esc(o.value)}" ${o.value === v ? "selected" : ""}>${esc(o.name || o.value)}${o.value === x.current ? "（默认）" : ""}</option>`).join("")}</select>`}</label>`; }).join("")}</div>`;
    }

    // ---------- Role editor: one column, top to bottom, the way the role is read ----------
    function roleDrawer() {
      const r = S.roleDraft, c = connOf(r.connection), opt = c?.options || {};
      const sel = (k, list, cur, empty) => `<select id="rd-${k}" data-bind="roleField" data-k="${k}">${empty ? `<option value="">${esc(empty)}</option>` : ""}${list.map(o => `<option value="${esc(o.value)}" ${o.value === cur ? "selected" : ""}>${esc(o.name || o.value)}</option>`).join("")}</select>`;
      const toggle = (k, t, s) => `<label class="tg"><span><b>${t}</b><small>${s}</small></span><button class="switch" role="switch" aria-checked="${!!r[k]}" data-act="roleToggle" data-v="${k}" aria-label="${t}"><i></i></button></label>`;
      const lib = S.skills?.skills || [];
      const picked = (r.skills || []).map(id => lib.find(s => s.id === id) || { id, name: id, description: "" });
      const q = (S.skillQuery || "").toLowerCase();
      const sd = S.skillDraft;
      const skillPicker = !S.skillPick ? "" : sd ? `<div class="picker-box">
          <div class="field"><label for="sk-name">名称</label><input id="sk-name" data-bind="skillField" data-k="name" value="${esc(sd.name || "")}" placeholder="code-review"></div>
          <div class="field"><label for="sk-desc">什么时候用</label><input id="sk-desc" data-bind="skillField" data-k="description" value="${esc(sd.description || "")}" placeholder="评审代码变更时使用"></div>
          <div class="field"><label for="sk-content">内容</label><textarea id="sk-content" rows="6" data-bind="skillField" data-k="content" placeholder="写给 Agent 的做法和步骤">${esc(sd.content || "")}</textarea></div>
          <div class="row-end"><button class="btn sm ghost" data-act="skillDraftCancel">取消</button><button class="btn sm primary" data-act="skillCreate">添加到 Skill 库</button></div></div>`
        : `<div class="picker-box">${lib.length ? `<input id="skillQuery" data-bind="skillQuery" value="${esc(S.skillQuery || "")}" placeholder="搜索 Skill 库">` : ""}
          <div class="pick-list">${!S.skills ? `<p class="faint small" style="padding:10px 12px">读取中…</p>` : lib.filter(s => !q || `${s.name} ${s.description}`.toLowerCase().includes(q)).map(s => { const on = (r.skills || []).includes(s.id); return `<button class="pick-row ${on ? "on" : ""}" data-act="roleSkill" data-v="${esc(s.id)}"><span class="ck">${on ? "✓" : ""}</span><span class="grow"><b>${esc(s.name)}</b><small>${esc(s.description)}</small></span></button>`; }).join("") || `<p class="faint small" style="padding:10px 12px">${lib.length ? "没有匹配的 Skill" : "Skill 库还是空的"}</p>`}</div>
          <div class="row-end" style="justify-content:space-between"><span><button class="link" data-act="skillNew">新建</button><button class="link" data-act="skillImport" style="margin-left:12px">从文件夹导入</button></span><button class="btn sm" data-act="skillPick">完成</button></div></div>`;
      const d = S.mcpDraft;
      const mcpPicker = S.mcpPick ? `<div class="picker-box">
          ${d ? `<div class="grid2"><div class="field"><label for="mcp-name">名称</label><input id="mcp-name" data-bind="mcpField" data-k="name" value="${esc(d.name || "")}" placeholder="filesystem"></div><div class="field"><label for="mcp-command">启动命令</label><input id="mcp-command" class="mono" data-bind="mcpField" data-k="command" value="${esc(d.command || "")}" placeholder="npx -y @modelcontextprotocol/server-filesystem ."></div></div>
              <div class="field"><label for="mcp-env">环境变量</label><textarea id="mcp-env" class="mono" rows="2" data-bind="mcpField" data-k="envText" placeholder="KEY=value">${esc(d.envText || "")}</textarea></div>
              <div class="row-end"><button class="btn sm ghost" data-act="mcpCancel">取消</button><button class="btn sm primary" data-act="mcpAdd">添加</button></div>`
            : `<div class="row-end" style="justify-content:space-between"><button class="link" data-act="mcpNew">填写一个 MCP</button><button class="btn sm" data-act="mcpPick">完成</button></div>`}
        </div>` : "";
      return `<div class="modal-bg" data-act="roleBg"><div class="rdlg" role="dialog" aria-modal="true" aria-labelledby="rdTitle">
        <header class="rdlg-h">
          <span class="menu-wrap"><button class="av-btn" data-act="toggleMenu" data-v="color" aria-label="选择颜色">${roleAv({ ...r, init: r.init || (r.name || "").replace(/\s+/g, "").slice(0, 2).toUpperCase() }, "lg")}</button>
            ${S.menu === "color" ? `<div class="menu swatch-menu">${ROLE_COLORS.map(col => `<button class="sw ${r.color === col ? "on" : ""}" style="background:${col}" data-act="roleColor" data-v="${col}" aria-label="颜色 ${col}"></button>`).join("")}</div>` : ""}</span>
          <h2 id="rdTitle">${r.id ? "编辑角色" : "新建角色"}</h2>
          <button class="icon-btn" data-act="roleClose" aria-label="关闭">✕</button>
        </header>
        <div class="rdlg-body">
          <div class="grid2"><div class="field"><label for="rd-name">名称</label><input id="rd-name" data-bind="roleField" data-k="name" value="${esc(r.name)}" placeholder="Reviewer"></div><div class="field"><label for="rd-role">定位</label><input id="rd-role" data-bind="roleField" data-k="role" value="${esc(r.role)}" placeholder="评审"></div></div>
          <div class="field"><label for="rd-desc">职责</label><input id="rd-desc" data-bind="roleField" data-k="desc" value="${esc(r.desc)}" placeholder="独立检查变更，寻找风险与反例"></div>

          <section class="rsec"><h3>由谁来做</h3>
            <div class="grid3"><div class="field"><label for="rd-connection">Agent</label>${sel("connection", S.setup.connections.map(x => ({ value: x.id, name: x.name })), r.connection, "选择 Agent")}</div>
              <div class="field"><label for="rd-model">模型</label>${!c ? `<select disabled><option>—</option></select>` : opt.model?.options?.length ? sel("model", opt.model.options, r.model, `默认（${opt.model.current}）`) : c.status === "testing" ? `<div class="model-wait">读取模型中…</div>` : `<button class="model-wait link" data-act="connTest" data-v="${c.id}">${c.status === "error" ? "检查未通过，重新检查" : "检查 Agent 以读取模型"}</button>`}</div>
              <div class="field"><label for="rd-effort">推理强度</label>${opt.effort?.options?.length ? sel("effort", opt.effort.options, r.effort, `默认（${opt.effort.current}）`) : `<select disabled><option>默认</option></select>`}</div></div>
          </section>

          <section class="rsec"><h3>指令</h3>
            <textarea id="rd-prompt" class="instr" data-bind="roleField" data-k="prompt" placeholder="告诉这个角色怎么做事，例如：只读，不修改文件；重点检查边界条件、错误处理和测试覆盖。">${esc(r.prompt || "")}</textarea>
          </section>

          <section class="rsec"><h3>Skills${picked.length ? `<em>${picked.length}</em>` : ""}</h3>${S.skillPick ? "" : `<button class="link" data-act="skillPick">添加</button>`}</section>
          ${picked.length ? `<div class="mounted">${picked.map(s => `<div class="mrow"><span class="m-ic">✦</span><span class="grow"><b>${esc(s.name)}</b><small>${esc(s.description)}</small></span><button class="icon-btn" data-act="roleSkillRemove" data-v="${esc(s.id)}" aria-label="移除 ${esc(s.name)}">×</button></div>`).join("")}</div>` : ""}${skillPicker}

          ${r.mcp?.length ? `<div class="mounted">${r.mcp.map((m, i) => `<div class="mrow"><span class="m-ic">⧉</span><span class="grow"><b>${esc(m.name)}</b><small class="mono">${esc([m.command, ...(m.args || [])].join(" "))}${(m.envKeys || []).length ? ` · ${m.envKeys.length} 个环境变量` : ""}</small></span><button class="icon-btn" data-act="mcpRemove" data-v="${i}" aria-label="移除 ${esc(m.name)}">×</button></div>`).join("")}</div>` : ""}${mcpPicker}

          <section class="rsec"><h3>权限</h3>${ctrlsOf(c).some(x => x.permission) ? `<span class="faint small">${esc(c.name)} 的权限模式</span>` : ""}</section>
          ${permSection(r, c)}
          ${c?.options?.controls ? `<p class="pmode-note">${permWrites(r.session, c) ? "按这个模式，Agent 会修改文件，直接改工作目录。" : "按这个模式，Agent 只读不写。"}主控规划时会看到这个模式，按它分配任务。Agent 自己判断哪些操作要先问你，它发起的审批、表单和链接都会进入「需要你处理」，按 Agent 给出的选项呈现。</p>` : ""}
          ${otherCtrls(r, c)}

          <section class="rsec"><h3>协作</h3></section>
          <div class="tg-group">${leadCapable(c) ? toggle("lead", "可以担任主控", "用 /goal 推进目标，需要时编排协作者") : `<label class="tg"><span><b>可以担任主控</b><small>只有 Claude Code 或 Codex 能做主控（需要 /goal）</small></span><button class="switch" role="switch" aria-checked="false" disabled aria-label="可以担任主控"><i></i></button></label>`}</div>
        </div>
        <footer class="rdlg-f">${r.id ? `<button class="btn ghost danger" data-act="roleDelete" data-v="${r.id}">删除</button>` : ""}<span style="flex:1"></span><button class="btn ghost" data-act="roleClose">取消</button><button class="btn primary" data-act="roleSave">${r.id ? "保存" : "创建"}</button></footer>
      </div></div>`;
    }

    // "复制本机配置": show which files and shell variables would be copied, never their values.
    let previewTimer;
    function loadPreview() {
      const d = S.connDraft; if (!d) return;
      const key = `${d.kind}|${d.source || ""}`;
      if (S.preview?.key === key) return;
      S.preview = { key, loading: true };
      clearTimeout(previewTimer);
      previewTimer = setTimeout(async () => {
        try { S.preview = { key, ...(await api(`/api/local-config?kind=${encodeURIComponent(d.kind)}&source=${encodeURIComponent(d.source || "")}`)) }; }
        catch (err) { S.preview = { key, error: err.message }; }
        if (S.connDraft) renderScreen();
      }, 250);
    }
    function importPreview(d) {
      const p = S.preview;
      if (!p || p.key !== `${d.kind}|${d.source || ""}`) { setTimeout(loadPreview); return `<div class="note">正在检查本机配置…</div>`; }
      if (p.loading) return `<div class="note">正在检查本机配置…</div>`;
      if (p.error) return `<div class="find">${esc(p.error)}</div>`;
      if (!p.files.length && !p.env.length) return `<div class="note warn">在 ${esc(p.source)} 没有找到 ${esc(kindOf(d.kind).name)} 的配置。${d.showSource ? "" : `<button class="link" data-act="connShowSource">更改来源</button>`}</div>`;
      return `<div class="import-pv"><div class="import-h"><b>从 ${esc(p.source.replace(/^\/Users\/[^/]+/, "~"))} 复制</b>${d.showSource ? "" : `<button class="link" data-act="connShowSource">更改</button>`}</div>
        <ul>${p.files.map(f => `<li><code>${esc(f.file)}</code><span>${esc(f.note)}</span></li>`).join("")}
        ${p.env.map(e => `<li><code>$${esc(e.name)}</code><span>shell 环境变量</span></li>`).join("")}</ul></div>`;
    }

    // Readable id = folder name. Suggested from type and name until the user types their own.
    let idTimer;
    function suggestId() {
      const d = S.connDraft; if (!d || d.id || d.idTouched) return;
      clearTimeout(idTimer);
      idTimer = setTimeout(async () => {
        try { const { id } = await api(`/api/agent-id?kind=${encodeURIComponent(d.kind)}&name=${encodeURIComponent(d.name || "")}`); if (S.connDraft === d && !d.idTouched) { d.newId = id; renderScreen(); } } catch {}
      }, 200);
    }

        return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? "" : ` <span class="faint">可选</span>`}</label><input id="${id}" ${f.type === "secret" ? `type="password" autocomplete="off" placeholder="${saved ? "已保存，留空表示不修改" : esc(f.placeholder || "")}"` : `placeholder="${esc(f.placeholder || "")}"`} value="${f.type === "secret" ? "" : esc(d[f.key] || "")}" data-bind="connField" data-k="${f.key}">${f.help ? `<div class="hint">${esc(f.help)}</div>` : ""}</div>`;
      };
      const status = prev ? connStatus(prev) : null;
      const injected = { ...(k.fixedEnv || {}), ...((k.endpoints || []).find(e => e.id === (d.endpoint || k.endpoints[0]?.id))?.env || {}) };
      const authBlock = auths.length ? `<div class="field"><label>认证</label><div class="seg stretch">${auths.map(a => `<button class="${a.id === auth.id ? "on" : ""}" data-act="connAuth" data-v="${a.id}">${esc(a.label)}</button>`).join("")}</div>${auth.desc ? `<div class="hint">${esc(auth.desc)}</div>` : ""}</div>
          ${auth.id === "import" ? `${d.showSource ? auth.fields.map(field).join("") : ""}${importPreview(d)}` : auth.fields.map(field).join("")}
          ${auth.login && prev ? `<div class="hint">${prev.loggedIn ? `已登录 ${esc(auth.label)}。` : "还没有登录。"}<button class="link" data-act="connLogin" data-v="${prev.id}" style="margin-left:6px">${prev.loggedIn ? "重新登录" : "现在登录"}</button></div>` : ""}` : "";
      const presetBlock = k.token ? `${(k.endpoints || []).length ? `<div class="field"><label>接入点</label><div class="seg stretch">${k.endpoints.map(e => `<button class="${e.id === (d.endpoint || k.endpoints[0].id) ? "on" : ""}" data-act="connEndpoint" data-v="${e.id}">${esc(e.label)}</button>`).join("")}</div></div>` : ""}
          ${field({ key: "token", label: k.token.label, type: "secret", required: true, help: k.token.help })}
` : "";
      return `<div class="modal-bg" data-act="connBg"><div class="pdlg" role="dialog" aria-modal="true" aria-labelledby="pdlgTitle">
        <aside class="pdlg-rail">
          <div class="rail-search"><input id="railQuery" data-bind="railQuery" value="${esc(S.railQuery || "")}" placeholder="搜索" aria-label="搜索 Agent 类型"></div>
          <div class="rail-list">${groups || `<p class="small muted" style="padding:10px">没有匹配的类型</p>`}</div>
        </aside>
        <section class="pdlg-form">
          <header class="pdlg-h">${typeIcon(k, "lg")}<div class="grow"><h2 id="pdlgTitle">${editing ? `编辑 ${esc(prev?.name || k.name)}` : "添加 Agent"}</h2><p>${esc(k.desc)}</p></div>
            ${status ? `<span class="pill ${status[1]}">${status[0]}</span>` : ""}
            <button class="btn sm" data-act="connSave" data-v="test" ${d.saving ? "disabled" : ""} title="保存并检查运行时、凭据、启动、会话和一次真实回复">保存并检查</button>
            <button class="btn sm ghost" data-act="connCancel" aria-label="关闭">✕</button></header>

              <div class="field"><label for="cf-newId">ID</label>${editing ? `<input id="cf-newId" class="mono" value="${esc(d.id)}" disabled>` : `<input id="cf-newId" class="mono" data-bind="connField" data-k="newId" value="${esc(d.newId || "")}" placeholder="codex" autocomplete="off" spellcheck="false">`}
                <div class="hint mono">~/.janus/agents/${esc((editing ? d.id : d.newId) || "")}</div></div></div>
            ${k.command ? `<div class="field"><label for="cf-command">启动命令</label><input id="cf-command" class="mono" data-bind="connField" data-k="command" value="${esc(d.command || "")}" placeholder="npx -y @zed-industries/claude-code-acp"></div>` : ""}
            ${authBlock}${presetBlock}

              ${k.runtime ? `<div class="field"><label for="cf-bin">运行时路径</label><input id="cf-bin" class="mono" data-bind="connField" data-k="bin" value="${esc(d.bin || "")}" placeholder="${esc(k.runtime.detected || k.runtime.placeholder)}"></div>` : ""}
              <div class="field"><label for="cf-prompt">自定义提示词</label><textarea id="cf-prompt" data-bind="connField" data-k="prompt" rows="3" placeholder="对这个 Agent 的所有角色生效">${esc(d.prompt || "")}</textarea></div>
              <div class="field"><label for="cf-env">环境变量</label><textarea id="cf-env" class="mono" data-bind="connField" data-k="envText" rows="3" placeholder="KEY=value">${esc(d.envText || "")}</textarea></div>
              ${k.token ? `<div class="field"><label>预设变量</label><pre class="env-preview">${esc(envText(injected))}\n${esc(k.token.envKey)}=••••••</pre></div>` : ""}
            </div></details>
          </div>
          <footer class="pdlg-f"><button class="btn ghost" data-act="connCancel">取消</button><button class="btn primary" data-act="connSave" ${d.saving ? "disabled" : ""}>${d.saving ? "保存中…" : editing ? "保存" : "创建"}</button></footer>
        </section>
      </div></div>`;
    }

    // ---------- Workspace: which roles, which directory, which permissions ----------
    function wsDraftFrom(ws) {
      const members = {};
      for (const r of S.setup.roles) {
        const m = ws?.members.find(x => x.role === r.id);
        members[r.id] = { on: m ? true : !ws && !!r.connection };
      }
      const lead = ws?.lead || S.setup.roles.find(r => r.lead && leadCapable(connOf(r.connection)))?.id || "";
      const path = ws?.path || (S.setup.workspaces.length ? "" : S.meta?.defaultCwd || "");
      if (path !== S.inspectFor) { S.inspectFor = path; S.cfg.path = path; inspectPath(); }
      return { id: ws?.id || "", name: ws?.name || "", path, lead, members };
    }
    function openWsEdit(ws) { S.wsDraft = wsDraftFrom(ws); go("workspace"); }
    function wsEditPage() {
      const d = S.wsDraft ||= wsDraftFrom(curWs());
      const rows = S.setup.roles.map(r => {
        const m = d.members[r.id] ||= { on: false };
        const c = connOf(r.connection);
        return `<tr class="${m.on ? "" : "off"}">
          <td><label class="chk"><input type="checkbox" data-act="wsToggle" data-id="${r.id}" data-v="on" ${m.on ? "checked" : ""} ${c ? "" : "disabled"}> ${roleAv(r, "sm")} <span><b>${esc(r.name)}</b><span class="faint small">${c ? `${esc(c.name)} · ${esc(r.model || "默认模型")}` : "未绑定 Agent"}</span></span></label></td>
          <td><input type="radio" name="lead" data-act="wsLead" data-v="${r.id}" ${d.lead === r.id ? "checked" : ""} ${m.on && leadCapable(c) ? "" : "disabled"} title="${leadCapable(c) ? "" : "只有 Claude Code 或 Codex 能做主控"}" aria-label="${esc(r.name)} 作为主控"></td>
          <td class="small muted">${c?.options?.controls ? (permWrites(r.session, c) ? "可修改文件" : "只读") : "—"}</td><td class="small muted">${esc(permLabel(r.session, c) || "—")}</td>
        </tr>`;
      }).join("");
      return `${topbar(d.id ? `<span class="set-crumb">工作区设置</span>` : "")}
        <div class="page-narrow">${onboardBar()}
          <div class="set-h"><div><h1>${d.id ? esc(d.name || "工作区") : "新建工作区"}</h1><p>在哪个目录执行任务、启用哪些角色、各自的权限。</p></div></div>
          <div class="dsec">项目目录</div>
          <div class="card" style="padding:14px">
            <div class="path-row field"><input id="wsPath" data-bind="wsPath" value="${esc(d.path)}" aria-label="项目目录" placeholder="/path/to/your/repo"><button class="btn" data-act="pickFolder">选择文件夹…</button></div>
            ${S.meta?.defaultCwd ? `<div class="presets"><button data-act="wsPreset" data-v="${esc(S.meta.defaultCwd)}">示例项目 examples/calc</button></div>` : ""}
            <div class="small muted" style="margin-top:10px" id="inspectLine">${inspectLine()}</div>
            <div class="field" style="margin-top:12px"><label for="wsName">名称 <span class="faint">可选，默认用目录名</span></label><input id="wsName" data-bind="wsName" value="${esc(d.name)}"></div>
          </div>
          <div class="dsec">启用的角色与权限</div>
          <div class="card"><table class="ws-table"><thead><tr><th>角色</th><th>主控</th><th>文件<small>由权限模式决定</small></th><th>权限模式<small>在角色里设置</small></th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="faint">还没有角色，先去「设置 → 角色」创建。</td></tr>`}</tbody></table></div>
          <div class="set-next">${d.id ? `<button class="btn ghost danger" data-act="wsDelete" data-v="${d.id}">删除工作区</button>` : "<span></span>"}<span class="row-end"><button class="btn ghost" data-act="wsCancel">取消</button><button class="btn primary" data-act="wsSave">${d.id ? "保存" : "创建工作区"}</button></span></div>
        </div>`;
    }
    function folderPicker() {
      const p = S.picker, data = p.data;
      return `<div class="modal-bg" data-act="pickerBg"><div class="card modal picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
        <h2 id="pickTitle">${p.mode === "skill" ? "选择 Skill 文件夹" : "选择项目文件夹"}</h2>
        <p class="small muted">浏览器出于安全原因不会把文件夹的完整路径交给网页，所以这里由本机的 Janus 列出目录。</p>
        ${data ? `<div class="crumbs mono" style="margin-top:12px">${esc(data.path)}${data.git ? ` <span class="pill green">Git 仓库</span>` : ""}</div>
        <div class="pick-tools"><button class="btn sm" data-act="pickGo" data-v="${esc(data.home)}">⌂ 主目录</button>${data.parent ? `<button class="btn sm" data-act="pickGo" data-v="${esc(data.parent)}">↑ 上一级</button>` : ""}<label class="small muted"><input type="checkbox" data-act="pickHidden" ${p.hidden ? "checked" : ""}> 显示隐藏文件夹</label></div>
        <div class="dir-list">${data.entries.map(e => `<button class="dir" data-act="pickGo" data-v="${esc(e.path)}"><span>📁 ${esc(e.name)}</span>${e.git ? `<span class="pill green">git</span>` : ""}</button>`).join("") || `<p class="small muted" style="padding:12px">没有子文件夹。</p>`}</div>` : `<p class="small muted" style="margin-top:12px">${esc(p.error || "读取中…")}</p>`}
        <div class="row-end" style="margin-top:14px"><button class="btn ghost" data-act="pickerClose">取消</button><button class="btn primary" data-act="pickUse" ${data ? "" : "disabled"}>${p.mode === "skill" ? "复制到 Skill 库" : "使用这个文件夹"}</button></div>
      </div></div>`;
    }
    async function pickerGo(path) {
      S.picker = { ...S.picker, data: null, error: null };
      renderScreen();
      try { S.picker.data = await api(`/api/fs?path=${encodeURIComponent(path || "")}&hidden=${S.picker.hidden ? "true" : "false"}`); }
      catch (err) { S.picker.error = err.message; }
      renderScreen();
    }

    // ---------- Workspace home: start a task, see who will do it, find earlier runs ----------
    function homePage() {
      const ws = curWs();
      if (!ws) return `${topbar()}<div class="page-narrow">${onboardBar() || ""}<div class="card empty"><h3>还没有工作区</h3><p>工作区指定任务在哪个目录执行、由哪些角色参与。</p><button class="btn primary" data-act="wsNew">新建工作区</button></div></div>`;
      const members = ws.members.map(m => ({ ...m, r: roleOf(m.role) }));
      const problems = members.filter(m => !m.r || !connOf(m.r.connection) || connOf(m.r.connection).status !== "ok").map(m => m.r ? `${m.r.name}（${connOf(m.r.connection) ? "Agent 未测试通过" : "未绑定 Agent"}）` : "已删除的角色");
      const runs = runsOf(ws);
      const STATUS = { planning: ["规划中", "blue"], awaiting_plan: ["等你确认计划", "amber"], waiting_input: ["等你决策", "amber"], running: ["执行中", "blue"], delivered: ["已交付", "green"], accepted: ["已验收", "green"], accepted_with_risk: ["已接受风险", "amber"], failed: ["失败", "red"], cancelled: ["已取消", "gray"], interrupted: ["已中断", "gray"] };
      return `${topbar()}
        <div class="page-narrow">${onboardBar()}
          <div class="home-h"><div><h1>${esc(ws.name)}</h1><p class="mono faint">${esc(ws.path)}</p></div><button class="btn sm" data-act="wsEdit" data-v="${ws.id}">工作区设置</button></div>
          <div class="card composer-card">
            <textarea id="goalText" data-bind="goal" placeholder="说出你想要的结果，例如：给 divide 增加除零保护，并补充测试">${esc(S.goal)}</textarea>
            <div class="composer-row"><div class="suggest" style="margin:0">${SUGGESTIONS.map(([l], i) => `<button data-act="suggest" data-v="${i}">${l}</button>`).join("")}</div><button class="btn primary" data-act="startTask" ${problems.length ? "disabled" : ""}>交给主控 →</button></div>
          </div>
          ${problems.length ? `<div class="note warn" style="margin-top:12px">这些角色还不能运行：${esc(problems.join("、"))}。<button class="link" data-act="goSettingsRoles">去设置 →</button></div>` : ""}
          <div class="dsec">这个工作区的团队 <button class="link" data-act="wsEdit" data-v="${ws.id}">调整</button></div>
          <div class="team-strip">${members.map(m => { const c = connOf(m.r?.connection); return `<div class="tm">${roleAv(m.r, "lg")}<span><b>${esc(m.r?.name || "已删除")}${m.role === ws.lead ? ` <span class="pill violet">主控</span>` : ""}</b><small>${esc(c?.name || "未绑定")} · ${esc(m.r?.model || c?.options?.model?.current || "默认模型")}</small><small>${permWrites(m.r?.session, c) ? "可修改文件" : "只读"}${permLabel(m.r?.session, c) ? ` · ${esc(permLabel(m.r?.session, c))}` : ""}${m.r?.skills?.length ? ` · ${m.r.skills.length} Skill` : ""}${m.r?.mcp?.length ? ` · ${m.r.mcp.length} MCP` : ""}</small></span></div>`; }).join("")}</div>
          <div class="dsec">任务记录 <span class="faint">${runs.length} 个</span></div>
          <div class="card run-list">${runs.map(r => { const [l, t] = STATUS[r.status] || [r.status, "gray"]; return `<button class="run-row" data-act="openRun" data-v="${r.id}"><span class="grow"><b>${esc(r.goal)}</b><small>${new Date(r.createdAt).toLocaleString()}</small></span><span class="pill ${t}">${l}</span></button>`; }).join("") || `<p class="pv-empty">还没有任务。在上面写下第一个目标。</p>`}</div>
        </div>`;
    }

    // ---------- Actions ----------
    // Checks run in the background on the server; the page only polls, so leaving or reloading never cancels one.
    async function testConn(id) {
      try { await api(`/api/connections/${id}/test`, {}); } catch (err) { toast("无法开始检查：" + err.message); return; }
      await loadSetup(); watchChecks();
    }
    let checkPoll;
    function watchChecks() {
      if (checkPoll) return;
      const running = () => S.setup.connections.filter(c => c.status === "testing").map(c => c.id);
      let before = running();
      if (!before.length) return;
      checkPoll = setInterval(async () => {
        await loadSetup();
        const now = running();
        for (const id of before.filter(x => !now.includes(x))) { const c = connOf(id); if (c) toast(c.status === "ok" ? `${c.name} 检查通过` : `${c.name} 检查未通过：${c.error || ""}`); }
        before = now;
        if (!now.length) { clearInterval(checkPoll); checkPoll = null; }
      }, 1500);
    }
    const CHECK_STEPS = ["ACP 适配器", "运行时", "凭据", "启动 Agent", "打开会话", "试运行"];
    function checkList(c) {
      const done = c.check || [];
      if (!done.length) return "";
      const testing = c.status === "testing";
      // Custom commands bring their own agent: they have no adapter step.
      const steps = c.base === "custom" ? CHECK_STEPS.slice(1) : CHECK_STEPS;
      return `<ol class="check">${steps.map(name => {
        const st = done.find(x => x.step === name);
        const cls = !st ? "wait" : st.ok === true ? "ok" : st.ok === false ? "bad" : "run";
        if (!st && !testing) return "";
        return `<li class="${cls}"><i>${{ ok: "✓", bad: "✕", run: "", wait: "" }[cls]}</i><b>${name}</b><span>${esc(st?.detail || "")}</span></li>`;
      }).join("")}</ol>`;
    }
    let loginPoll;
    async function loginConn(id) {
      try { await api(`/api/connections/${id}/login`, {}); } catch (err) { toast(err.message); return; }
      toast("已开始登录：按卡片上的提示完成，完成后会自动测试。");
      clearInterval(loginPoll);
      loginPoll = setInterval(async () => {
        await loadSetup();
        const c = connOf(id);
        if (!c || c.login?.state !== "running") { clearInterval(loginPoll); if (c?.loggedIn) testConn(id); }
      }, 2000);
    }
    async function ensureRoleLibs(force) {
      if (!S.skills || force) await api("/api/skills").then(x => { S.skills = x; renderScreen(); }, () => { S.skills = { skills: [] }; });
    }
    function openRole(role) {
      S.roleDraft = structuredClone(role); S.mcpDraft = null; S.skillQuery = ""; S.skillPick = false; S.mcpPick = false;
      ensureRoleLibs(); renderScreen();
    }
    const SETUP_ACT = {
      goHome: () => { const ws = curWs(); ws ? go("home") : (nextStep() ? nextStep()[2]() : go("home")); },
      goSettings: () => go("settings", { tab: S.tab || "agents" }),
      goSettingsRoles: () => go("settings", { tab: "roles" }),
      settingsTab: v => { if (v === "adapters") loadAdapters(); go("settings", { tab: v }); },
      adapterInstall: v => adapterAct(v, "install"),
      adapterCheck: v => adapterAct(v, "check"),
      adapterUse: (v, el) => adapterAct(v, "use", el.dataset.version),
      onbNext: () => nextStep()?.[2](),
      toggleMenu: v => { S.menu = S.menu === v ? null : v; renderScreen(); },
      wsOpen: v => { S.menu = null; go("home", { ws: v }); },
      wsNew: () => { S.menu = null; openWsEdit(null); },
      wsEdit: v => { S.menu = null; openWsEdit(wsOf(v)); },
      wsCancel: () => go(curWs() ? "home" : "settings"),
      wsSave: async () => {
        const d = S.wsDraft;
        const members = Object.entries(d.members).filter(([, m]) => m.on).map(([role]) => ({ role }));
        try {
          const ws = await setupSave("workspaces", { id: d.id, name: d.name, path: d.path, lead: d.lead, members });
          S.wsDraft = null; await loadSetup(); toast(`已保存工作区 ${ws.name}`); go("home", { ws: ws.id });
        } catch (err) { toast(err.message); }
      },
      wsDelete: async v => {
        if (!confirm(`删除工作区「${wsOf(v)?.name}」？已有的任务记录会保留。`)) return;
        try { await setupDelete("workspaces", v); S.wsDraft = null; await loadSetup(); rememberWs(S.setup.workspaces[0]?.id || ""); go(S.setup.workspaces.length ? "home" : "workspace"); } catch (err) { toast(err.message); }
      },
      wsPreset: v => { S.wsDraft.path = v; S.cfg.path = v; inspectPath(); renderScreen(); },
      wsToggle: (v, el) => { const m = S.wsDraft.members[el.dataset.id]; m[v] = !m[v]; if (v === "on" && !m.on && S.wsDraft.lead === el.dataset.id) S.wsDraft.lead = ""; renderScreen(); },
      wsLead: v => { S.wsDraft.lead = v; renderScreen(); },
      pickFolder: () => { S.picker = { hidden: false }; pickerGo(S.wsDraft.path); },
      pickGo: v => pickerGo(v),
      pickHidden: () => { S.picker.hidden = !S.picker.hidden; pickerGo(S.picker.data?.path); },
      pickUse: async () => {
        const p = S.picker.data.path, mode = S.picker.mode; S.picker = null;
        if (mode !== "skill") { SETUP_ACT.wsPreset(p); return; }
        try { const sk = await api("/api/skills/import", { path: p }); await ensureRoleLibs(true); S.roleDraft.skills = [...(S.roleDraft.skills || []), sk.id]; renderScreen(); toast(`已导入 Skill ${sk.name}`); }
        catch (err) { renderScreen(); toast(err.message); }
      },
      pickerClose: () => { S.picker = null; renderScreen(); },
      pickerBg: (v, el, e) => { if (e.target === el) SETUP_ACT.pickerClose(); },
      suggest: v => { S.goal = SUGGESTIONS[v][1]; renderScreen(); },
      startTask: () => { const goal = S.goal.trim(); if (!goal) { toast("先告诉 Janus 你想完成什么。"); $("#goalText")?.focus(); return; } createRun(goal, curWs().id); },
      openRun: v => openRun(v),

      connNew: () => { S.menu = null; S.railQuery = ""; SETUP_ACT.connType(S.setup.connections.length ? "claude" : "codex"); },
      connNewType: v => { S.menu = null; S.railQuery = ""; SETUP_ACT.connType(v); },
      connType: v => {
        const k = kindOf(v), d = S.connDraft || {};
        const keep = d.name && d.name !== kindOf(d.kind)?.name;
        S.connDraft = { kind: v, auth: k.auths?.[0]?.id || "", name: keep ? d.name : k.name, api: "openai-completions", prompt: d.prompt || "", envText: d.envText || "", endpoint: k.endpoints?.[0]?.id, newId: d.idTouched ? d.newId : "", idTouched: d.idTouched };
        renderScreen(); suggestId();
      },
      connEdit: v => { const c = connOf(v); S.menu = null; S.railQuery = ""; S.connDraft = { ...c, envText: envText(c.env) }; renderScreen(); },
      connCancel: () => { S.connDraft = null; renderScreen(); },
      connBg: (v, el, e) => { if (e.target === el) SETUP_ACT.connCancel(); },
      connAuth: v => { S.connDraft.auth = v; renderScreen(); },
      connShowSource: () => { S.connDraft.showSource = true; renderScreen(); setTimeout(() => $("#cf-source")?.focus()); },
      connEndpoint: v => { S.connDraft.endpoint = v; renderScreen(); },
      connSave: async v => {
        const d = S.connDraft; d.saving = true; renderScreen();
        try {
          const c = await setupSave("connections", d);
          await loadSetup();
          if (v === "test") { S.connDraft = { ...connOf(c.id), envText: envText(c.env) }; } else { S.connDraft = null; toast(`已保存 ${c.name}，正在检查配置`); }
          renderScreen();
          if (loginAuth(c) && !connOf(c.id)?.loggedIn) loginConn(c.id); else testConn(c.id);
        } catch (err) { d.saving = false; renderScreen(); toast(err.message); }
      },
      connTest: v => { S.menu = null; testConn(v); },
      connLogin: v => { S.menu = null; loginConn(v); },
      connDelete: async v => {
        const c = connOf(v), used = S.setup.roles.filter(r => r.connection === v).map(r => r.name);
        const msg = `删除「${c?.name || v}」和它的独立目录（包括登录凭据）？` + (used.length ? `\n\n这些角色正在使用它，删除后会变成未绑定，需要重新选择 Agent：${used.join("、")}` : "");
        if (!confirm(msg)) return;
        S.menu = null; if (S.connDraft?.id === v) S.connDraft = null;
        try { await setupDelete("connections", v); await loadSetup(); toast(`已删除 ${c?.name || v}`); } catch (err) { await loadSetup(); alert(err.message); }
      },

      roleOpen: v => openRole(roleOf(v)),
      roleNew: v => {
        const n = S.setup.roles.length;
        openRole({ id: "", name: "新角色", role: "", desc: "", connection: v || okConns()[0]?.id || "", model: "", effort: "", session: {}, lead: false, color: ROLE_COLORS[n % ROLE_COLORS.length], init: "", prompt: "", skills: [], mcp: [] });
      },
      roleClose: () => { S.roleDraft = null; renderScreen(); },
      roleBg: (v, el, e) => { if (e.target === el) SETUP_ACT.roleClose(); },
      roleToggle: v => { S.roleDraft[v] = !S.roleDraft[v]; renderScreen(); },
      // Choosing the agent's default drops the key, so the role follows the agent if its default changes.
      roleCtrl: (v, el) => {
        const r = S.roleDraft, id = el.dataset.id, c = ctrlsOf(connOf(r.connection)).find(x => x.id === id);
        const next = el.dataset.bool ? !ctrlValue(r.session, c) : v;
        r.session = { ...(r.session || {}) };
        if (next === c?.current) delete r.session[id]; else r.session[id] = next;
        renderScreen();
      },
      roleColor: v => { S.roleDraft.color = v; S.menu = null; renderScreen(); },
      roleSkillRemove: v => { S.roleDraft.skills = (S.roleDraft.skills || []).filter(id => id !== v); renderScreen(); },
      roleSkill: v => { const s = new Set(S.roleDraft.skills || []); s.has(v) ? s.delete(v) : s.add(v); S.roleDraft.skills = [...s]; renderScreen(); },
      roleSave: async () => {
        const r = S.roleDraft;
        try { const saved = await setupSave("roles", r); S.roleDraft = null; await loadSetup(); toast(`已保存角色 ${saved.name}`); } catch (err) { toast(err.message); }
      },
      roleDelete: async v => {
        if (!confirm(`删除角色「${roleOf(v)?.name}」？`)) return;
        try { await setupDelete("roles", v); S.roleDraft = null; await loadSetup(); } catch (err) { alert(err.message); }
      },
      skillPick: () => { S.skillPick = !S.skillPick; renderScreen(); if (S.skillPick) setTimeout(() => $("#skillQuery")?.focus()); },
      mcpPick: () => { S.mcpPick = !S.mcpPick; S.mcpDraft = null; renderScreen(); },
      mcpNew: () => { S.mcpDraft = { name: "", command: "", envText: "" }; renderScreen(); setTimeout(() => $("#mcp-name")?.focus()); },
      mcpCancel: () => { S.mcpDraft = null; renderScreen(); },
      mcpAdd: () => {
        const d = S.mcpDraft;
        if (!/^[A-Za-z0-9_-]+$/.test(d.name || "")) { toast("名称只能包含字母、数字、- 和 _。"); return; }
        if (!(d.command || "").trim()) { toast("请填写启动命令。"); return; }
        S.roleDraft.mcp = [...(S.roleDraft.mcp || []), { name: d.name, command: d.command.trim(), envText: d.envText }];
        S.mcpDraft = null; S.mcpPick = false; renderScreen();
      },
      skillNew: () => { S.skillDraft = { name: "", description: "", content: "" }; renderScreen(); setTimeout(() => $("#sk-name")?.focus()); },
      skillDraftCancel: () => { S.skillDraft = null; renderScreen(); },
      skillCreate: async () => {
        try { const sk = await api("/api/skills", S.skillDraft); S.skillDraft = null; await ensureRoleLibs(true); S.roleDraft.skills = [...(S.roleDraft.skills || []), sk.id]; renderScreen(); toast(`已添加 Skill ${sk.name}`); }
        catch (err) { toast(err.message); }
      },
      skillImport: () => { S.picker = { hidden: true, mode: "skill" }; pickerGo(""); },
      mcpRemove: v => { S.roleDraft.mcp = S.roleDraft.mcp.filter((_, i) => i !== Number(v)); renderScreen(); }
    };
    const SETUP_BIND = {
      connField: (v, el) => {
        const k = el.dataset.k; S.connDraft[k] = v;
        if (k === "source") { S.preview = null; loadPreview(); }
        if (k === "newId") { S.connDraft.idTouched = !!v; renderScreen(); }
        if (k === "name") suggestId();
      },
      railQuery: v => { S.railQuery = v; renderScreen(); },
      roleField: (v, el) => {
        const r = S.roleDraft, k = el.dataset.k; r[k] = v;
        if (k === "connection") { r.model = ""; r.effort = ""; r.session = {}; }
        if (k === "name" && !r.id) r.init = "";
        if (el.tagName === "SELECT") renderScreen();
      },
      skillQuery: v => { S.skillQuery = v; renderScreen(); },
      roleCtrlSel: (v, el) => { const r = S.roleDraft, id = el.dataset.id, c = ctrlsOf(connOf(r.connection)).find(x => x.id === id); r.session = { ...(r.session || {}) }; if (v === c?.current) delete r.session[id]; else r.session[id] = v; },
      skillField: (v, el) => { S.skillDraft[el.dataset.k] = v; },
      mcpField: (v, el) => { S.mcpDraft[el.dataset.k] = v; },
      wsPath: v => { S.wsDraft.path = v; S.cfg.path = v; inspectPath(); },
      wsName: v => { S.wsDraft.name = v; },
      goal: v => { S.goal = v; }
    };

    // ============================================================
    // App shell
    // ============================================================
    function mountApp() {
      $("#root").innerHTML = `<header class="hdr" id="hdr"></header><div class="tbar" id="tbar"></div><main class="main" id="main"></main><div id="modal"></div>`;
      S.mounted = null;
    }
    function patch(id, html) { const el = document.getElementById(id); if (el && el.__h !== html) { el.innerHTML = html; el.__h = html; } }

    function render() {
      if (S.screen !== "app") return;
      const full = derive(S.events);
      if (S.replay != null && S.replay >= S.events.length) S.replay = null;
      const st = S.replay != null ? derive(S.events.slice(0, S.replay)) : full;
      SHOWN = st;
      patch("hdr", header(full));
      patch("tbar", taskBar(full));
      const key = S.page + (S.page === "task" ? S.taskId : S.page === "agent" ? S.agentId : "") + (S.replay != null ? ":replay" : "");
      if (S.mounted !== key) { $("#main").innerHTML = skeleton(); S.mounted = key; }
      if (S.page === "board") {
        if (S.replay != null) syncReplay(full);
        patch("r-run", runCard(st));
        patch("r-inbox", inbox(st));
        patch("r-result", resultCard(st));
        patch("r-dag", dag(st));
        patch("r-agents", agentsPanel(st));
        patch("r-shared", shared(st, full));
      } else if (S.page === "task") {
        const chat = $("#chat"), atBottom = !chat || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
        const typing = document.activeElement?.id === "sessInput";
        patch("r-task", taskPage(st));
        const c2 = $("#chat"); if (c2 && atBottom) c2.scrollTop = c2.scrollHeight;
        if (typing) { const el = $("#sessInput"); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }
      }
      else if (S.page === "agent") {
        const chat = $("#chat"), atBottom = !chat || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
        const typing = document.activeElement?.id === "sessInput";
        patch("r-agent", agentPage(st));
        const c2 = $("#chat"); if (c2 && atBottom) c2.scrollTop = c2.scrollHeight;
        if (typing) { const el = $("#sessInput"); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }
      }
      else if (S.page === "audit") patch("r-audit", auditPage(full));
      else patch("r-team", teamPage(full));
      patch("modal", modal());
    }

    function skeleton() {
      if (S.page === "board") return `${S.replay != null ? `<div class="replay" id="replayBar"><b>回放模式</b><span>只读 · 界面显示的是当时的状态</span><button data-act="replayStep" data-v="-1" aria-label="上一条事件">‹</button><input type="range" id="replayRange" min="1" data-bind="replay" aria-label="回放位置"><button data-act="replayStep" data-v="1" aria-label="下一条事件">›</button><button data-act="live">回到实时 →</button><span id="replayLabel"></span></div>` : ""}
        <div class="board"><div><section id="r-run"></section><section id="r-inbox"></section><section id="r-result"></section><section id="r-dag"></section><section id="r-shared"></section></div><aside class="side"><section id="r-agents"></section></aside></div>`;
      return `<section id="r-${S.page}"></section>`;
    }
    function syncReplay(full) {
      const r = $("#replayRange"); if (!r) return;
      r.max = full.events.length;
      if (document.activeElement !== r) r.value = S.replay;
      const e = full.events[S.replay - 1];
      $("#replayLabel").textContent = `第 ${S.replay} / ${full.events.length} 条 · ${clock(e.ts)} · ${who(e.actor).name}：${e.text}`;
    }

    function header(full) {
      return `<div class="hdr-in">
        <div class="brand" data-act="goHome" role="button" tabindex="0" style="cursor:pointer"><span class="mark">J</span>Janus</div>
        <div class="ctx">${wsSwitcher()}</div>
        <div class="hdr-r"><button class="btn sm" data-act="goSettings">⚙ 设置</button></div>
      </div>`;
    }
    // Inside the workspace: which task this is, and its views.
    function taskBar(full) {
      const n = full.inbox.length, ws = curWs();
      const tabs = [["board", "工作台"], ["audit", "审计与回放"], ["team", "团队与权限"]];
      return `<div class="tbar-in">
        <button class="link back" data-act="goHome">← ${esc(ws?.name || "工作区")}</button>
        <span class="tb-title" title="${esc(full.run.goal)}">${esc(full.run.goal || "")}</span>${S.live ? "" : `<span class="chip demo" title="这个任务不在当前编排器进程里，只能查看">只读</span>`}
        <nav class="tabs" aria-label="任务视图">${tabs.map(([k, l]) => `<button class="tab ${S.page === k || (k === "board" && ["task", "agent"].includes(S.page)) ? "on" : ""}" data-act="nav" data-v="${k}">${l}${k === "board" && n ? `<span class="count" title="需要你处理">${n}</span>` : ""}</button>`).join("")}</nav>
      </div>`;
    }

    // ---------- Board ----------
    function stageIndex(st) {
      const r = st.run.status;
      if (["idle", "planning", "awaiting_plan"].includes(r)) return 0;
      if (r === "delivered") return 4;
      if (r === "accepted") return 5;
      const kind = k => st.order.map(id => st.tasks[id]).find(t => t.kind === k);
      if (kind("deliver")?.attempts.length) return 3;
      if (kind("review")?.attempts.length) return 2;
      return 1;
    }
    function runStatus(st) {
      const r = st.run;
      if (r.status === "cancelled") return ["已取消", "gray"];
      if (r.status === "failed") return ["Run 失败", "red"];
      if (r.status === "interrupted") return ["已中断", "gray"];
      if (r.paused) return ["已暂停", "gray"];
      if (r.status === "planning") return ["主控正在启动", "blue"];
      if (r.status === "awaiting_plan") return ["等你确认计划", "amber"];
      if (r.status === "accepted") return ["已验收", "green"];
      if (r.status === "accepted_with_risk") return ["已接受风险", "amber"];
      if (r.status === "waiting_input") return ["等你决策", "amber"];
      if (r.status === "delivered") return ["已交付 · 等你验收", "green"];
      if (st.inbox.length) return [`等你处理 ${st.inbox.length} 项`, "amber"];
      return ["团队执行中", "blue"];
    }
    function runCard(st) {
      const r = st.run;
      if (!r.goal) return `<div class="card run skeleton">正在连接编排器…</div>`;
      const [label, tone] = runStatus(st);
      const done = st.order.filter(id => st.tasks[id].status === "succeeded").length;
      const idx = r.mode === "goal" ? goalStageIndex(st) : stageIndex(st);
      const live = S.replay == null && S.live;
      const active = !["delivered", "accepted", "accepted_with_risk", "cancelled", "failed", "interrupted"].includes(r.status);
      const ctl = live && active ? `${r.status === "running" || r.paused ? `<button class="btn sm" data-act="${r.paused ? "resume" : "pause"}" title="暂停后不再启动新任务，进行中的尝试会继续">${r.paused ? "▶ 继续" : "Ⅱ 暂停"}</button>` : ""}<button class="btn sm ghost danger" data-act="cancelRun">取消</button>` : "";
      return `<article class="card run">
        <div class="run-top"><div><span class="pill ${tone}">● ${label}</span><h1>${esc(r.goal)}</h1></div><div class="run-ctl">${ctl}</div></div>
        ${r.status === "failed" ? `<div class="note warn" style="margin-top:10px">${esc(r.error)}</div>` : ""}
        ${["interrupted", "failed"].includes(r.status) && S.replay == null ? `<div class="resume-row"><span>${r.status === "interrupted" ? "编排器重启时中断了。已完成的任务会保留，未完成的从原处继续。" : "可以从失败处继续。"}也可以点右侧的 Agent 进入对话，补充信息后再继续。</span><button class="btn primary sm" data-act="resumeRun">从中断处继续</button></div>` : ""}
        <div class="run-meta"><span>主控 <b>${esc(agentName("lead"))}</b></span><span>工作区 <b>${esc(wsNote(r))}</b></span><span>团队 <b>${team().length} 人</b></span><span>开始 <b>${clock(r.start)}</b></span><span>用时 <b>${dur(r.now - r.start)}</b></span><span>任务 <b>${done} / ${st.order.length || "—"}</b></span></div>
        <ol class="stages">${goalStages(st, idx).map((s, i) => `<li class="${i < idx ? "done" : i === idx ? "on" : ""}">${i < idx ? "✓ " : ""}${s}</li>`).join("")}</ol>
      </article>`;
    }

    function inbox(st) {
      const live = S.replay == null && S.live;
      if (!st.inbox.length) {
        if (st.run.status === "planning") return `<div class="card quiet" style="margin-top:14px">◌ 主控 Agent 正在启动，马上开始推进目标。</div>`;
        if (st.run.status === "running") return `<div class="card quiet" style="margin-top:14px">✓ 目前没有需要你处理的事项。Agent 的问题和权限请求会出现在这里。</div>`;
        return "";
      }
      // Plan confirmations and task-failure decisions belong to the removed plan-first flow: an old
      // run still lists them on its board, but there is nothing left to answer them with.
      const ASK = { question: questionAsk, budget: budgetAsk, session: sessionAsk, input: inputAsk, approval: approvalAsk };
      const open = st.inbox.filter(item => ASK[item.kind]);
      if (!open.length) return "";
      const items = open.map(item => ASK[item.kind](st, item, live)).join("");
      return `<div class="sec-h"><h2>需要你处理<span class="count">${open.length}</span></h2><span>相关任务会等待你的决定，其他任务继续</span></div>${items}`;
    }
    // Every request an agent puts in front of the person — Janus questions, ACP permission requests,
    // ACP forms and links — shares one card: who asks and where, what it is about, then either the
    // agent's own options or a form built from its JSON Schema.
    // @project-doc docs/architecture/frontend.md#request_cards
    function askShell(st, item, { pill, tone = "amber", agent, title, body, controls, foot }) {
      const where = item.task ? `${item.task} · ${esc(st.tasks[item.task]?.title || "")}` : "主控会话";
      return `<article class="card ask">
        <div class="ask-h"><span class="pill ${tone}">${pill}</span>${avatar(agent)}<b>${title}</b><span class="r">${clock(st.events[item.seq - 1].ts)} <button class="seq" data-act="seq" data-v="${item.seq}">#${item.seq}</button></span></div>
        ${body || ""}
        <div class="kv"><label>来自</label><span>${esc(who(agent).name)} · ${where}</span>${foot || ""}</div>
        ${controls}
      </article>`;
    }
    function questionAsk(st, item, live) {
      const t = st.tasks[item.task], q = t.question, draft = S.drafts[item.key];
      const downstream = st.order.filter(id => st.tasks[id].deps.includes(item.task));
      return askShell(st, item, {
        pill: "问题", agent: q.from, title: `${esc(who(q.from).name)} 在 ${item.task} 中提问${q.blocking ? " · 阻塞中" : ""}`,
        body: `<p class="q">${esc(q.question)}</p><div class="route">↳ 主控 Agent 转交给你：${esc(item.reason)}</div>`,
        controls: `<div class="opts">${q.options.map(o => `<button class="opt ${draft === o ? "on" : ""}" data-act="pick" data-key="${item.key}" data-v="${esc(o)}" ${live ? "" : "disabled"}>${esc(o)}${o === item.recommend ? "<small>主控建议</small>" : ""}</button>`).join("")}</div>
          <textarea data-note="${item.key}" placeholder="补充说明（可选），会和回答一起发给 Agent" ${live ? "" : "disabled"}></textarea>
          <div class="ask-f"><button class="btn primary" data-act="answer" data-key="${item.key}" data-task="${item.task}" ${live ? "" : "disabled"}>提交回答</button><span class="small muted">回答会写入事件日志，并通过 ACP 发回会话 <code>${esc(t.attempts.at(-1)?.session || "")}</code>。${downstream.length ? `受影响的下游任务：${downstream.join("、")}。` : ""}</span></div>`
      });
    }
    // ACP elicitation: a form (JSON Schema) or a link to finish elsewhere.
    function inputAsk(st, item, live) {
      const dis = live ? "" : "disabled";
      if (item.mode === "url") return askShell(st, item, {
        pill: "打开链接", agent: item.agent, title: `${esc(who(item.agent).name)} 需要你在浏览器里完成一步`,
        body: `<p class="req-msg">${esc(item.message)}</p>${item.url ? `<p style="margin-top:8px"><a href="${esc(item.url)}" target="_blank" rel="noopener" class="mono">${esc(item.url)}</a></p>` : ""}`,
        controls: `<div class="ask-f req-opts"><button class="btn primary" data-act="inputSend" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent}" data-v="accept" ${dis}>已完成</button><button class="btn reject" data-act="inputSend" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent}" data-v="decline" ${dis}>拒绝</button></div>`
      });
      return askShell(st, item, {
        pill: "需要填写", agent: item.agent, title: `${esc(who(item.agent).name)} 需要你提供信息`,
        body: `<p class="req-msg">${esc(item.message)}</p>${schemaForm(item.key, item.schema, live)}`,
        controls: `<div class="ask-f req-opts"><button class="btn primary" data-act="inputSend" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent}" data-v="accept" ${dis}>提交</button><button class="btn ghost" data-act="inputSend" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent}" data-v="decline" ${dis}>跳过</button><button class="btn ghost danger" data-act="inputSend" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent}" data-v="cancel" ${dis}>取消</button><span class="small muted">内容通过 ACP 原样交回 Agent。</span></div>`
      });
    }
    // Render the subset of JSON Schema that ACP forms use: single and multi select (oneOf/anyOf/enum),
    // text, number, boolean, and per-question "custom answer" fields.
    function schemaForm(key, schema, live) {
      const props = Object.entries(schema?.properties || {}), req = new Set(schema?.required || []);
      const d = S.drafts[key] ||= {}, dis = live ? "" : "disabled";
      const customFor = ([k, p]) => p?._meta?.lody?.elicitation?.customAnswerFor || (/_custom$/.test(k) && props.some(([o]) => o === k.replace(/_custom$/, "")) ? k.replace(/_custom$/, "") : null);
      const customs = Object.fromEntries(props.filter(customFor).map(e => [customFor(e), e]));
      const choices = p => (p.oneOf || p.anyOf || p.items?.anyOf || p.items?.oneOf || (p.enum || p.items?.enum || []).map(v => ({ const: v, title: String(v) })))
        .map(o => ({ value: o.const, label: o._meta?.label || String(o.title ?? o.const).split(" — ")[0], desc: o.description || o._meta?.description || (String(o.title || "").includes(" — ") ? String(o.title).split(" — ").slice(1).join(" — ") : "") }));
      const field = ([k, p]) => {
        if (customFor([k, p])) return "";
        const head = `<label>${esc(p.title || k)}${req.has(k) ? ` <span class="faint">*</span>` : ""}</label>${p.description ? `<small>${esc(p.description)}</small>` : ""}`;
        const multi = p.type === "array", opts = choices(p);
        let input;
        if (opts.length) {
          const on = v => multi ? (d[k] || []).includes(v) : d[k] === v;
          input = `<div class="opts">${opts.map(o => `<button class="opt ${on(o.value) ? "on" : ""}" data-act="formPick" data-key="${key}" data-k="${esc(k)}" data-multi="${multi ? 1 : ""}" data-v="${esc(o.value)}" ${dis}>${esc(o.label)}${o.desc ? `<small>${esc(o.desc)}</small>` : ""}</button>`).join("")}</div>`;
        } else if (p.type === "boolean") {
          input = `<div class="opts"><button class="switch" role="switch" aria-checked="${!!d[k]}" data-act="formBool" data-key="${key}" data-k="${esc(k)}" ${dis}><i></i></button></div>`;
        } else if (p.type === "number" || p.type === "integer") {
          input = `<input type="number" data-bind="formField" data-key="${key}" data-k="${esc(k)}" data-num="1" value="${esc(d[k] ?? "")}" ${dis}>`;
        } else if (p.maxLength && p.maxLength <= 120) {
          input = `<input type="text" data-bind="formField" data-key="${key}" data-k="${esc(k)}" value="${esc(d[k] ?? "")}" ${dis}>`;
        } else {
          input = `<textarea data-bind="formField" data-key="${key}" data-k="${esc(k)}" ${dis}>${esc(d[k] ?? "")}</textarea>`;
        }
        const c = customs[k];
        const custom = c ? `<input type="text" class="custom" data-bind="formField" data-key="${key}" data-k="${esc(c[0])}" value="${esc(d[c[0]] ?? "")}" placeholder="${esc(c[1].description || "或者写下你自己的回答")}" ${dis}>` : "";
        return `<div class="form-f">${head}${input}${custom}</div>`;
      };
      return props.map(field).join("");
    }
    function sessionAsk(st, item) {
      if (item.agent) return `<article class="card ask">
        <div class="ask-h"><span class="pill amber">会话</span>${avatar(item.agent)}<b>${esc(who(item.agent).name)} 在等你的消息</b><span class="r">${clock(st.events[item.seq - 1].ts)}</span></div>
        <div class="ask-f"><button class="btn primary" data-act="agentChat" data-v="${item.agent}">进入对话</button></div>
      </article>`;
      const t = st.tasks[item.task];
      return `<article class="card ask">
        <div class="ask-h"><span class="pill amber">会话</span>${avatar(t.agent)}<b>${esc(who(t.agent).name)} 在 ${item.task} 中等你的消息</b><span class="r">${clock(st.events[item.seq - 1].ts)} <button class="seq" data-act="seq" data-v="${item.seq}">#${item.seq}</button></span></div>
        <p class="small muted" style="margin-top:8px">你接管了这个会话。Agent 这一轮已经结束，在你发消息、交还托管或结束任务之前，它会一直等待。</p>
        <div class="ask-f"><button class="btn primary" data-act="task" data-v="${item.task}">进入会话</button></div>
      </article>`;
    }
    function budgetAsk(st, item, live) {
      return `<article class="card ask">
        <div class="ask-h"><span class="pill amber">预算</span><b>Run 已达到墙钟预算</b><span class="r">${clock(st.events[item.seq - 1].ts)} <button class="seq" data-act="seq" data-v="${item.seq}">#${item.seq}</button></span></div>
        <div class="find" style="margin-top:10px">${esc(item.text)}</div>
        <div class="ask-f"><button class="btn primary" data-act="extendBudget" ${live ? "" : "disabled"}>追加 60 分钟</button><button class="btn danger" data-act="cancelRun" ${live ? "" : "disabled"}>取消这个 Run</button></div>
      </article>`;
    }
    // ACP permission request: the agent's own options, each answered by its optionId.
    function approvalAsk(st, item, live) {
      const dis = live ? "" : "disabled";
      const opts = item.options?.length ? item.options : [{ optionId: "", name: "批准这一次", kind: "allow_once" }, { optionId: "", name: "拒绝", kind: "reject_once" }];
      const diff = (item.content || []).filter(c => c.type === "diff").map(c => `<pre class="cmd req-diff">${esc(c.path || "")}\n${esc((c.newText || "").slice(0, 2000))}</pre>`).join("");
      const btn = o => { const allow = /^allow/.test(o.kind || ""); return `<button class="btn ${allow ? (o.kind === "allow_once" ? "primary" : "allow") : "reject"}" data-act="approve" data-key="${item.key}" data-task="${item.task || ""}" data-agent="${item.agent || ""}" data-option="${esc(o.optionId)}" data-label="${esc(o.name || "")}" data-v="${allow ? 1 : 0}" ${dis}>${esc(o.name || o.optionId)}</button>`; };
      return askShell(st, item, {
        pill: "审批", tone: "red", agent: item.agent || st.tasks[item.task]?.agent, title: `${esc(who(item.agent || st.tasks[item.task]?.agent).name)} 请求你决定：${esc(item.title || "执行操作")}`,
        body: `${item.command && item.command !== item.title ? `<pre class="cmd">$ ${esc(item.command)}</pre>` : ""}${diff}`,
        foot: `<label>原因</label><span>${esc(item.policy)}</span>`,
        controls: `<div class="ask-f req-opts">${opts.map(btn).join("")}<span class="small muted">${esc(item.impact || "")}</span></div>`
      });
    }

    function resultCard(st) {
      const r = st.result; if (!r) return "";
      const live = S.replay == null;
      const d = r.diagnosis;
      const seq = n => n ? `<button class="seq" data-act="seq" data-v="${n}">#${n}</button>` : "";
      const actions = !r.accepted && live ? [...d.actions.map(([a, l]) => `<button class="btn sm" data-act="diag" data-v="${a}">${l}</button>`), `<button class="btn sm primary" data-act="diag" data-v="accept">${r.risks.length ? "核对后接受风险并验收" : "验收通过"}</button>`].join("") : "";
      return `<div class="sec-h"><h2>交付结果</h2><span>每条结论都能追溯到事件</span></div>
        <article class="card result">
          <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill green">已交付</span><span class="pill ${r.confidence === "高" ? "green" : "amber"}">置信度 ${r.confidence}</span>${r.accepted ? `<span class="pill green">✓ 你已于 ${clock(r.accepted)} 验收</span>` : ""}<button class="seq" data-act="seq" data-v="${r.seq}">#${r.seq}</button></div>
          <h2>${esc(r.headline)}</h2><p>${esc(r.summary)}</p>
          <div class="res-grid">
            <div><h4>交付物</h4><ul>${r.deliverables.map(a => `<li><span><b>${esc(a.name)}</b> ${seq(a.seq)} <a class="link" href="/api/file?path=${encodeURIComponent(a.path)}" target="_blank">查看</a></span><span class="small muted">${esc(a.desc)}</span><span class="mono">${esc(a.path)}</span></li>`).join("")}</ul></div>
            <div><h4>证据</h4><ul>${r.evidence.map(e => `<li><span>${esc(e.text)} ${seq(e.seq)}</span></li>`).join("")}</ul><p class="small muted" style="margin-top:8px">${esc(r.review)}</p></div>
            <div><h4>风险与限制</h4><ul>${r.risks.length ? r.risks.map(x => `<li>⚠ ${esc(x)}</li>`).join("") : "<li>没有已知风险</li>"}</ul></div>
          </div>
          <div class="diag ${d.cat ? "warn" : ""}">
            <h4>偏差诊断 · 如果结果不符合预期，问题最可能来自哪里</h4>
            <div class="cats">${DIAG_CATS.map(([k, l]) => `<span class="${d.cat === k ? "hit" : ""}">${l}</span>`).join("")}</div>
            <b>${esc(d.title)}</b><p>${esc(d.text)} ${d.refs.filter(Boolean).map(seq).join(" ")}</p>
            ${actions ? `<div class="res-f">${actions}</div>` : ""}
          </div>
          <div class="res-f"><button class="btn sm" data-act="copy">复制交付摘要</button><button class="btn sm" data-act="export">下载事件日志 (JSONL)</button><button class="btn sm ghost" data-act="nav" data-v="audit">在审计日志中逐条核对 →</button></div>
        </article>`;
    }

    function dag(st) {
      if (!st.order.length) return !st.run.goal ? "" : st.run.mode === "goal"
        ? `<div class="sec-h"><h2>任务图</h2></div><div class="card quiet">主控正在自己推进目标，还没有交给协作者的任务。需要协作时，它提交的编排会出现在这里。</div>`
        : `<div class="sec-h"><h2>任务图</h2></div><div class="card skeleton">主控 Agent 正在理解目标、匹配成员…</div>`;
      const depth = {};
      const dep = id => depth[id] ??= st.tasks[id].deps.length ? 1 + Math.max(...st.tasks[id].deps.map(dep)) : 0;
      st.order.forEach(dep);
      const cols = [];
      st.order.forEach(id => (cols[depth[id]] ||= []).push(st.tasks[id]));
      const node = t => {
        const [label, tone] = TASK_STATUS[t.status];
        const n = t.attempts.length;
        const sel = S.boardSel ? (S.boardSel.tasks.includes(t.id) ? " hl" : " dim") : "";
        return `<button class="node ${tone}${sel}" data-act="task" data-v="${t.id}">
          <span class="node-h"><span class="tid">${t.id}</span><span class="pill ${tone}">${label}</span></span>
          <b>${esc(t.title)}</b>
          <span class="node-a">${avatar(t.agent)} ${esc(who(t.agent).name)}${n > 1 ? ` · 第 ${n} 次尝试` : ""}</span>
          ${t.status === "running" ? `<span class="bar"><i style="width:${t.progress}%"></i></span>` : ""}
          ${t.status === "blocked" ? `<span class="small muted">等待 ${t.blockedBy} 修复后复审</span>` : ""}
        </button>`;
      };
      return `<div class="sec-h"><h2>任务图</h2><span>箭头表示依赖关系 · 点击任务查看执行详情</span></div>
        <div class="card dag"><div class="dag-cols">${cols.map(c => `<div class="dag-col">${c.map(node).join("")}</div>`).join("")}</div></div>`;
    }

    function agentsPanel(st) {
      const members = team();
      const active = members.filter(m => { const a = st.agents[m.id]; return a && !["idle"].includes(a.phase); }).length;
      const rows = members.map(m => {
        const a = st.agents[m.id] || { phase: "idle", beat: 0, progress: null };
        const mine = st.order.map(id => st.tasks[id]).filter(t => t.agent === m.id);
        const cur = mine.find(t => ["running", "waiting_input", "waiting_approval", "assigned"].includes(t.status));
        const next = mine.find(t => ["created", "pending", "ready", "blocked"].includes(t.status));
        let phase = a.phase;
        if (!m.lead && !cur && phase !== "error") phase = "idle";
        const [pl, pt] = AGENT_PHASE[phase] || AGENT_PHASE.idle;
        let line;
        if (m.lead) line = st.inbox.length ? `<b>等你处理 ${st.inbox.length} 项</b>，其余任务继续调度` : cur ? `<b>${cur.id}</b> ${esc(cur.title)}` : (a.note ? esc(a.note) : st.run.status === "delivered" ? "已完成最终验收" : "按依赖调度任务");
        else if (cur) line = `<b>${cur.id}</b> ${esc(cur.title)}${cur.status === "waiting_input" ? " · 等你回答" : cur.status === "waiting_approval" ? " · 等你审批" : a.note ? ` · ${esc(a.note)}` : ""}${cur.control === "human" ? " · 人工接管中" : ""}`;
        else if (next) line = next.status === "blocked" ? `${next.id} 等待 ${next.blockedBy} 修复` : `下一步 ${next.id} · 等待 ${next.deps.filter(d => st.tasks[d].status !== "succeeded").join("、") || "调度"}`;
        else line = mine.length ? "分配的任务都已完成" : st.order.length ? (st.run.mode === "goal" ? "主控没有给它派任务" : "本次计划没有分配任务") : "待命";
        const meta = [phase, a.session ? short(a.session.split("/").pop(), 18) : null, a.beat ? `心跳 ${ago(a.beat, st.run.now)}` : null].filter(Boolean);
        const sel = S.boardSel ? (S.boardSel.agents.includes(m.id) ? " hl" : " dim") : "";
        return `<div class="agent${sel}" data-act="agentChat" data-v="${m.id}" role="button" tabindex="0" title="查看 ${esc(m.name)} 的对话"><div class="agent-m">${avatar(m.id, "")}<div class="grow"><b>${esc(m.name)} <span class="chat-link">对话 →</span></b><span>${esc(m.role)} · ${esc(memberRt(m))}${m.model ? ` · ${esc(m.model)}` : ""}</span></div><span class="pill ${pt}">${pl}</span></div>
          <div class="agent-t">${line}</div>
          ${cur && cur.status === "running" && a.progress ? `<div class="bar"><i style="width:${a.progress}%"></i></div>` : ""}
          <div class="agent-x">${meta.map(esc).join(" · ")}</div></div>`;
      }).join("");
      return `<article class="card panel"><div class="panel-h"><h3>Agent 状态</h3><span>${members.length} 个成员 · ${active} 个活跃</span></div>${rows}</article>`;
    }

    // ---------- Shared board: the facts every agent can rely on, rebuilt from the event log ----------
    const ART_KIND = { report: "回复", git_diff: "代码改动", test_report: "测试结果" };
    const kb = n => n == null ? "" : n < 1024 ? `${n} B` : `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`;
    function boardFacts(st) {
      const ev = st.events, results = [], handoffs = [], decisions = [], notes = {}, blockers = [];
      const recorded = ev.some(e => e.type === "context.handoff");
      const lastResult = (task, before) => results.filter(r => r.task === task && r.seq < before).at(-1);
      let plans = 0, revisions = 0;
      for (const e of ev) {
        const d = e.data || {};
        const base = { seq: e.seq, ts: e.ts, by: e.actor };
        switch (e.type) {
          case "plan.proposed": plans++; break;
          case "result.submitted":
            results.push({ ...base, key: "r" + e.seq, task: e.task, attempt: e.attempt, summary: d.summary || e.text, evidence: d.evidence || [], risks: d.risks || [] }); break;
          case "context.handoff":
            handoffs.push({ ...base, key: "h" + e.seq, from: d.from, to: e.task, agent: e.to, summary: d.summary || "", artifacts: d.artifacts || [] }); break;
          case "attempt.started":
            // Runs from before handoffs were recorded: the orchestrator injected every dependency's latest result here.
            if (!recorded && !d.resumed) (st.tasks[e.task]?.deps || []).forEach(dep => {
              const r = lastResult(dep, e.seq);
              const arts = st.artifacts.filter(a => a.task === dep && a.seq < e.seq).map(a => a.name);
              handoffs.push({ ...base, key: "h" + e.seq + dep, by: r?.by || st.tasks[dep]?.agent, from: dep, to: e.task, agent: e.to, summary: r?.summary || "", artifacts: arts });
            }); break;
