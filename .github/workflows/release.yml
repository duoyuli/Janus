# Pushing a tag v<version> builds Janus.app for Apple silicon with the server and Node.js inside,
# packs it into Janus-<version>.dmg and publishes it on the GitHub release of that tag.
# Running the workflow by hand builds the DMG as a workflow artifact only.
# See docs/operations/ci_release.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the build (for example 0.2.0-rc1)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  dmg:
    name: Build Janus.dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test orchestrator
        working-directory: backend
        run: cargo test --locked
      - name: Test macOS app
        working-directory: frontend
        run: swift test

      - name: Package
        run: frontend/scripts/package.sh --version "${{ steps.v.outputs.version }}"

      - name: Check the app
        run: |
          app=dist/Janus.app
          for f in Contents/MacOS/Janus Contents/MacOS/janus-server Contents/Resources/node/bin/node; do
            [ "$(lipo -archs "$app/$f")" = arm64 ] || { echo "$f is not arm64"; exit 1; }
          done
          codesign --verify --strict "$app"
          # Bare file names, so `shasum -a 256 -c SHA256SUMS.txt` works next to the download.
          (cd dist && shasum -a 256 Janus-*.dmg | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Janus-${{ steps.v.outputs.version }}
          path: |
            dist/Janus-*.dmg
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="下载 Janus-${{ steps.v.outputs.version }}.dmg，打开后把 Janus 拖进「应用程序」。安装包没有用 Apple 开发者证书签名，第一次打开时需要在「系统设置 → 隐私与安全性」中点「仍要打开」。只支持 Apple 芯片（M 系列）的 Mac，macOS 14 以上。安装包自带 Node.js，只需要装好你要用的 Agent CLI，见仓库 docs/operations/deployment.md。"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Janus-*.dmg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/Janus-*.dmg dist/SHA256SUMS.txt --title "Janus ${{ steps.v.outputs.version }}" --notes "$notes" --generate-notes
          fi
