# Pushing a tag v<version> builds Janus.app for Apple silicon with the server and Node.js inside,
# packs it into Janus-<version>.dmg and publishes it on the GitHub release of that tag.
# Running the workflow by hand builds the DMG as a workflow artifact only.
# See docs/operations/20261101-ci_release.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the build (for example 0.2.0-rc1)"
        required: true
        default: "0.0.0-dev"
      leg:
        description: "both: GitHub's Mac, the local runner after five minutes. local: the local runner alone, to try it"
        type: choice
        options: [both, local]
        default: both

permissions:
  contents: write
  # Reading CI's runs for the tagged commit.
  actions: read

jobs:
  # Two legs of one job: GitHub's Mac, and the maintainer's own Mac when GitHub has none for five
  # minutes (.github/scripts/claim-runner.sh). Only one of them builds and publishes.
  dmg:
    name: Build Janus.dmg (${{ matrix.where }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.leg == 'local' && '{"include":[{"where":"local","runner":["self-hosted","macOS","ARM64","janus-local"],"other":"Build Janus.dmg (hosted)"}]}' || '{"include":[{"where":"hosted","runner":["macos-15"],"other":"Build Janus.dmg (local)"},{"where":"local","runner":["self-hosted","macOS","ARM64","janus-local"],"other":"Build Janus.dmg (hosted)"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Which runner works
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claim-runner.sh "${{ matrix.where }}" "${{ matrix.other }}"
      # The hosted leg reads this step to know the job was taken over.
      - name: Take over
        if: matrix.where == 'local' && steps.claim.outputs.work == 'true'
        run: echo "Packaging on the local runner"
      # No Rust cache: caches saved on a tag are visible to that tag only, so the next release could
      # never use one, and main's (debug) cache does not help a release build.
      # The local runner builds with the toolchain the machine has: installing one would change the
      # maintainer's own default.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.claim.outputs.work == 'true' && runner.environment == 'github-hosted'

      - name: Version
        id: v
        if: steps.claim.outputs.work == 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The self-signed certificate (frontend/scripts/make-signing-cert.sh) gives every release the
      # same identity; without the secrets the app is signed ad hoc.
      - name: Signing certificate
        if: steps.claim.outputs.work == 'true'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No MACOS_SIGNING_P12 secret: signing ad hoc"; exit 0; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode >"$RUNNER_TEMP/signing.p12"
          # The local runner is the maintainer's own account: the last step puts its keychain list back.
          security list-keychains -d user | tr -d '"' >"$RUNNER_TEMP/keychains.before"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          # codesign finds the private key only in a keychain on the user's search list, even with --keychain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          id="$(security find-identity -p codesigning "$kc" | awk '$1 ~ /^[0-9]+\)$/ { print $2; exit }')"
          [ -n "$id" ] || { echo "The certificate in MACOS_SIGNING_P12 has no code-signing identity"; exit 1; }
          echo "JANUS_SIGN_IDENTITY=$id" >>"$GITHUB_ENV"
          echo "JANUS_SIGN_KEYCHAIN=$kc" >>"$GITHUB_ENV"

      - name: Package
        if: steps.claim.outputs.work == 'true'
        run: frontend/scripts/package.sh --version "${{ steps.v.outputs.version }}"

      - name: Check the app
        if: steps.claim.outputs.work == 'true'
        run: |
          app=dist/Janus.app
          for f in Contents/MacOS/Janus Contents/MacOS/janus-server Contents/Resources/node/bin/node; do
            [ "$(lipo -archs "$app/$f")" = arm64 ] || { echo "$f is not arm64"; exit 1; }
          done
          codesign --verify --deep --strict "$app"
          # The update parts put back together are the same signed app (what the in-app updater does).
          t="$RUNNER_TEMP/parts"; rm -rf "$t"; mkdir -p "$t"
          tar -xzf dist/Janus-*-app.tar.gz -C "$t"
          tar -xzf dist/Janus-*-node.tar.gz -C "$t/Janus.app/Contents/Resources"
          codesign --verify --deep --strict "$t/Janus.app"
          # Bare file names, so `shasum -a 256 -c SHA256SUMS.txt` works next to the download.
          (cd dist && shasum -a 256 Janus-*.dmg Janus-*.tar.gz update.json | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        if: steps.claim.outputs.work == 'true'
        with:
          name: Janus-${{ steps.v.outputs.version }}
          # Both legs work only when a hosted machine arrives in the moment the local one takes over.
          overwrite: true
          path: |
            dist/Janus-*.dmg
            dist/Janus-*.tar.gz
            dist/update.json
            dist/SHA256SUMS.txt

      # The tests are CI's, for the same commit (pushed to main with the tag), running while this
      # packages: publish only once they passed there. CI's answer is its job "CI result", not the
      # run's conclusion: a hosted leg that never got a machine fails the run after the tests passed.
      - name: Wait for CI on this commit
        if: steps.claim.outputs.work == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --event push --limit 1 \
                    --json databaseId,url --jq '.[0] // empty | "\(.databaseId) \(.url)"')"
            set -- $run
            if [ -n "${1:-}" ]; then
              r="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$1/jobs?per_page=100" \
                    --jq '.jobs[] | select(.name == "CI result") | "\(.status) \(.conclusion)"')"
              case "$r" in
                "completed success") echo "CI passed: $2"; exit 0 ;;
                completed*) echo "CI for ${GITHUB_SHA} ended with ${r#completed }: $2. Fix it (or rerun it) and run this workflow again."; exit 1 ;;
              esac
            elif [ "$i" -ge 30 ]; then
              echo "No CI run for ${GITHUB_SHA}: push the commit to main before tagging it."; exit 1
            fi
            sleep 20
          done
          echo "CI for ${GITHUB_SHA} did not finish within 40 minutes."; exit 1

      - name: Publish release
        if: steps.claim.outputs.work == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.v.outputs.version }}"
          # The change log is written before tagging: the section "## <version>" in CHANGELOG.md.
          notes="$(awk -v h="## ${version}" '
            $0 == h { on = 1; next }
            on && /^## / { exit }
            on { if (!started && $0 == "") next; started = 1; print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md 缺少「## ${version}」一节：发布前先写这一版的 change log"
            exit 1
          fi
          install="下载 Janus-${version}.dmg，打开后把 Janus 拖进「应用程序」。安装包没有用 Apple 开发者证书签名，第一次打开时需要在「系统设置 › 隐私与安全性」中点「仍要打开」；之后可在应用内一键更新。macOS 的资源访问权限仍可能需要重新授权，可在「设置 › 通用 › macOS 权限」逐项处理。只支持 Apple 芯片（M 系列）的 Mac，macOS 15 以上。安装包自带 Node.js，只需要装好你要用的 Agent CLI，见仓库 docs/operations/20261031-deployment.md。"
          install_en="Download Janus-${version}.dmg, open it and drag Janus into Applications. The package is not signed with an Apple developer certificate, so on first launch choose Open Anyway under System Settings › Privacy & Security; later versions update inside the app. macOS resource permissions may still need renewed authorization; use Settings › General › macOS Permissions to review them. Apple silicon Macs (M series) only, macOS 15 or later. The package bundles Node.js; you only need the agent CLIs you plan to use, see docs/operations/20261031-deployment.md in the repository."
          body="$(printf '%s\n\n---\n\n%s\n\n%s' "$notes" "$install" "$install_en")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/Janus-*.dmg dist/Janus-*.tar.gz dist/update.json dist/SHA256SUMS.txt --clobber
            gh release edit "$tag" --notes "$body"
          else
            gh release create "$tag" dist/Janus-*.dmg dist/Janus-*.tar.gz dist/update.json dist/SHA256SUMS.txt --title "Janus ${version}" --notes "$body"
          fi

      # GitHub's machine is thrown away after the job; the maintainer's is not.
      - name: Put the keychain list back
        if: always() && runner.environment == 'self-hosted'
        run: |
          [ -f "$RUNNER_TEMP/keychains.before" ] || exit 0
          security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.before")
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/keychains.before"
