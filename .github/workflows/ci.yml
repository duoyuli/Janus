# Every push to main or to an rc/ branch (release candidates are tagged there) and every pull request:
# orchestrator lints and tests, the web client's checks, tests and build, and the macOS app's build and tests.
# Run by hand with leg=local to try the app's tests on the local runner alone.
# See docs/operations/20261101-ci_release.md.
name: CI

on:
  push:
    branches: [main, "rc/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "both: GitHub's Mac, the local runner after five minutes. local: the local runner alone, to try it"
        type: choice
        options: [both, local]
        default: both

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The macOS legs and the result read this run's jobs.
  actions: read

jobs:
  # Linux: the orchestrator's code and tests do not depend on macOS, and Linux runners start at once
  # and have more cores, while macOS runners can queue for minutes. The macOS app needs macOS.
  backend:
    name: Orchestrator (cargo fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: backend
        run: cargo test --locked

  # The web client (web/): its packages exactly as package-lock.json names them, without their
  # install scripts; type checks, unit tests and the build the service embeds. Its end-to-end test
  # needs Chrome and the service and runs in `just e2e` (docs/operations/20261031-testing.md#web_e2e).
  web:
    name: Web client (check + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check
        working-directory: web
        run: npm run check
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npx vite build

  # Two legs of one job: GitHub's Mac, and the maintainer's own Mac when GitHub has none for five
  # minutes (.github/scripts/claim-runner.sh). A pull request gets the hosted leg only: it never
  # runs on the maintainer's machine.
  macos-app:
    name: macOS app (${{ matrix.where }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.leg == 'local' && '{"include":[{"where":"local","runner":["self-hosted","macOS","ARM64","janus-local"],"other":"macOS app (hosted)"}]}' || github.event_name != 'pull_request' && '{"include":[{"where":"hosted","runner":["macos-15"],"other":"macOS app (local)"},{"where":"local","runner":["self-hosted","macOS","ARM64","janus-local"],"other":"macOS app (hosted)"}]}' || '{"include":[{"where":"hosted","runner":["macos-15"],"other":"macOS app (local)"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Which runner works
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/claim-runner.sh "${{ matrix.where }}" "${{ matrix.other }}"
      # The hosted leg reads this step to know the job was taken over.
      - name: Take over
        if: matrix.where == 'local' && steps.claim.outputs.work == 'true'
        run: echo "Building and testing on the local runner"
      - name: Swift version
        if: steps.claim.outputs.work == 'true'
        run: swift --version
      # One build for both: `swift test` builds with testing enabled, which a plain `swift build`
      # does not share, so building first would compile everything twice.
      # The flags name Swift Testing's macro plugin where only the Command Line Tools are installed
      # (the local runner); on GitHub's machine, which has Xcode, there are none.
      - name: Build
        if: steps.claim.outputs.work == 'true'
        working-directory: frontend
        run: swift build --build-tests $(scripts/swift-test-flags.sh)
      - name: Test
        if: steps.claim.outputs.work == 'true'
        working-directory: frontend
        run: swift test --skip-build $(scripts/swift-test-flags.sh)

  # The one answer to "did CI pass for this commit": the orchestrator's checks, and the app's tests
  # on whichever leg did them. A hosted leg that never got a machine is cancelled by GitHub long
  # after the local leg passed and marks the run failed; this job is what the release waits for.
  result:
    name: CI result
    needs: [backend, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Orchestrator
        run: |
          [ "${{ needs.backend.result }}" = success ] || { echo "The orchestrator's checks ended with ${{ needs.backend.result }}"; exit 1; }
      - name: Web client
        run: |
          [ "${{ needs.web.result }}" = success ] || { echo "The web client's checks ended with ${{ needs.web.result }}"; exit 1; }
      - name: macOS app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every 10 seconds for 45 minutes: one leg passed its tests, one leg failed, or no leg is left.
          for _ in $(seq 1 270); do
            legs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("macOS app (")) | {name, status, conclusion, tested: ([.steps[]? | select(.name == "Test" and .conclusion == "success")] | length > 0)}]')"
            passed="$(jq -r '[.[] | select(.tested)] | .[0].name // empty' <<<"$legs")"
            failed="$(jq -r '[.[] | select(.conclusion == "failure")] | .[0].name // empty' <<<"$legs")"
            waiting="$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$legs")"
            if [ -n "$failed" ]; then echo "${failed} failed"; exit 1; fi
            if [ -n "$passed" ]; then echo "The app's tests passed on ${passed}"; exit 0; fi
            if [ "$waiting" = 0 ]; then echo "No leg built and tested the app: $(jq -c . <<<"$legs")"; exit 1; fi
            sleep 10
          done
          echo "The app's tests did not finish within 45 minutes"; exit 1
