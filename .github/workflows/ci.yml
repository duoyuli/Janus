# Every push to main and every pull request: orchestrator lints and tests, and the macOS app's build and tests.
# See docs/operations/20261101-ci_release.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Orchestrator (cargo fmt + clippy + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: backend
        run: cargo test --locked

  macos-app:
    name: macOS app (swift build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: frontend
        run: swift build
      - name: Test
        working-directory: frontend
        run: swift test
