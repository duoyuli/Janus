# Every push to main and every pull request: orchestrator lints and tests, and the macOS app's build and tests.
# See docs/operations/20261101-ci_release.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux: the orchestrator's code and tests do not depend on macOS, and Linux runners start at once
  # and have more cores, while macOS runners can queue for minutes. The macOS app needs macOS.
  backend:
    name: Orchestrator (cargo fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format
        working-directory: backend
        run: cargo fmt --check
      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: backend
        run: cargo test --locked

  macos-app:
    name: macOS app (swift build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      # One build for both: `swift test` builds with testing enabled, which a plain `swift build`
      # does not share, so building first would compile everything twice.
      - name: Build
        working-directory: frontend
        run: swift build --build-tests
      - name: Test
        working-directory: frontend
        run: swift test --skip-build
