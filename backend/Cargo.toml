[package]
name = "janus"
version = "0.1.0"
edition = "2024"
description = "Janus control plane: schedules local coding agents over ACP and records every fact in SQLite."

[dependencies]
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
