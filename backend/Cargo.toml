[package]
name = "janus"
version = "0.1.0"
edition = "2024"
description = "Janus control plane: schedules local coding agents over ACP and records every fact in SQLite."

[dependencies]
agent-client-protocol = "5.3"
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
jiff = "0.2.38"
# Signalling a process group through the system call (`acp::signal_group`); already in the tree.
rustix = { version = "1.1", features = ["process"] }
rquickjs = "0.14"
